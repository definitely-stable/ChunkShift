name: PATCH-TREE-001 T3B0 source-locked census contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/scripts/patch_tree_001_t3b0_census.py'
      - 'benchmarks/scripts/test_patch_tree_001_t3b0_census.py'
      - 'docs/benchmarks/PATCH-TREE-001-T3B0-EXACT-REAL-CALIBRATION.md'
      - '.github/workflows/patch-tree-001-t3b0-contracts.yml'
      - '.github/workflows/patch-tree-001-t3b0-real-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b0-contract:
    name: Locked T3B0 control tests (${{ matrix.os })
    runs-on: ${{ matrix.os }
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Source-lock fixtures and census invariants (NO real corpus)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/scripts/patch_tree_001_t3b0_census.py benchmarks/scripts/test_patch_tree_001_t3b0_census.py
          python -m unittest discover -s benchmarks/scripts -p 'test_patch_tree_001_t3b0_census.py' -v
          echo 'T3B0 SYNTHETIC_CONTRACT_ONLY; real source-locked calibration is main-only' >> "$GITHUB_STEP_SUMMARY"
