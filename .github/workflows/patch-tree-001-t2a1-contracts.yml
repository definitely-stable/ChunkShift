name: PATCH-TREE-001 T2A1 original CSM preflight contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeT2A1.cs'
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/PatchLabRunner.cs'
      - 'benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeT2A1Tests.cs'
      - 'docs/benchmarks/PATCH-TREE-001-T2A1-ORIGINAL-CSM-PREFLIGHT-PROTOCOL.md'
      - '.github/workflows/patch-tree-001-t2a1-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: CSM physical/semantic source locks and fail-closed synthetic preflight tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj \
            -c Release --filter FullyQualifiedName~PatchTreeT2A1
          echo 'T2A1 synthetic CSM/ChunkId contracts only; original main run required' >> "$GITHUB_STEP_SUMMARY"
