name: PATCH-DICT-001 D1-A real zstd entry contracts

on:
  pull_request:
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Dictionary/**'
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/PatchLabRunner.cs'
      - 'benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchDictD1aTests.cs'
      - 'docs/benchmarks/PATCH-DICT-001-D1A-ZSTD-ENTRY-PROTOCOL.md'
      - '.github/workflows/patch-dict-001-d1a-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  d1a:
    name: d1a-verified-frame (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout and pristine tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup Python for independent JSON ledger gate
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Restore and build benchmark lab
        shell: bash
        run: |
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Run all D1-A verification cases
        shell: bash
        run: |
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj \
            -c Release --no-build --no-restore --filter FullyQualifiedName~PatchDictD1aTests
      - name: Produce verified synthetic-only zstd entry ledger
        shell: bash
        env:
          RESULT: ${{ runner.temp }}/patch-dict-001-d1a-synthetic.json
        run: |
          dotnet benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll \
            patch-lab dict-d1a --output "$RESULT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          d = json.loads(Path(os.environ['RESULT']).read_text())
          assert d['experimentId'] == 'PATCH-DICT-001'
          assert d['evidenceClass'].endswith('NOT_FULL_CSP')
          assert d['bestContiguous']['runCount'] == 1
          assert d['bestComposite']['runCount'] > 1
          assert d['eligibleCandidatePlans'] == len(d['dictionaryObservations'])
          for item in d['dictionaryObservations']:
              assert 1 <= item['referenceCount'] <= 4
              assert item['entryAndPidxBytes'] == 64 + 32*item['referenceCount'] + item['storedBytes']
              assert item['dictionaryBytes'] <= d['dictionaryBudgetBytes']
              assert 0 < item['storedBytes'] <= d['targetBytes']
          print('D1-A synthetic ledger and full candidate population PASS; NOT whole-CSP evidence')
          print('SYNTHETIC ENTRY COSTS bytes: '
                f"raw={d['raw']['entryAndPidxBytes']} "
                f"plain={d['plainZstd']['entryAndPidxBytes']} "
                f"best_contiguous={d['bestContiguous']['entryAndPidxBytes']} "
                f"best_composite={d['bestComposite']['entryAndPidxBytes']} "
                f"best_any={d['bestAnyEntry']['entryAndPidxBytes']}")
          print(f"candidate_count={d['eligibleCandidatePlans']} "
                f"skipped_unstorable={d['skippedUnstorableFrames']} "
                f"skipped_budget={d['skippedBudgetPlans']}")
          PY
      - name: Archive synthetic-only per-entry evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-dict-001-d1a-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/patch-dict-001-d1a-synthetic.json
          if-no-files-found: error
          retention-days: 14
