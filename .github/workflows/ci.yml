name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChunkShift.slnx

      - name: Build
        run: dotnet build ChunkShift.slnx -c Release --no-restore

      - name: Test
        if: matrix.os != 'ubuntu-24.04'
        run: dotnet test ChunkShift.slnx -c Release --no-build --no-restore

      - name: Test with coverage
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          # One run per test project and target framework so each report is
          # attributable. ChunkShift.Patching targets net10.0 only.
          for tfm in net8.0 net10.0; do
            dotnet test tests/ChunkShift.Tests/ChunkShift.Tests.csproj -c Release --no-build --no-restore \
              -f "$tfm" --collect "XPlat Code Coverage" --results-directory "artifacts/coverage/$tfm"
          done
          dotnet test tests/ChunkShift.Patching.Tests/ChunkShift.Patching.Tests.csproj -c Release --no-build --no-restore \
            --collect "XPlat Code Coverage" --results-directory "artifacts/coverage/patching-net10.0"

      - name: Coverage summary
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = sorted(Path("artifacts/coverage").rglob("coverage.cobertura.xml"))
          if not reports:
              raise SystemExit("no coverage reports were produced")

          print("### Coverage\n")
          print("| Test run | Lines | Branches |")
          print("|---|---|---|")
          for report in reports:
              root = ET.parse(report).getroot()
              tfm = report.relative_to("artifacts/coverage").parts[0]
              lines = f"{float(root.get('line-rate')):.1%} ({root.get('lines-covered')}/{root.get('lines-valid')})"
              branches = f"{float(root.get('branch-rate')):.1%} ({root.get('branches-covered')}/{root.get('branches-valid')})"
              print(f"| {tfm} | {lines} | {branches} |")
          PY

      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 30

      - name: Verify CSM vectors with the independent decoder
        if: matrix.os == 'ubuntu-24.04'
        run: python3 tools/csm-fixtures/generate.py --verify tests/ChunkShift.Tests/Fixtures/CsmV1

      - name: Set up Python 3.14 for the CSP decoder
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify CSP vectors with the independent decoder
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          # The decoder needs the standard-library zstd module. Fail here rather
          # than fall back to a third-party package (PATCHING-DECISIONS D18).
          python -c "import sys; from compression import zstd; print(sys.version, zstd.zstd_version_info)"
          python tools/csp-fixtures/generate.py --verify tests/ChunkShift.Patching.Tests/Fixtures/CspV1

      - name: CLI CSM round-trip
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cli-smoke

          python3 - <<'PY'
          from pathlib import Path

          path = Path("artifacts/cli-smoke/content.bin")
          data = bytearray(1024 * 1024)
          state = 0xC5A5EED

          for index in range(len(data)):
              state ^= (state << 13) & 0xFFFFFFFF
              state ^= state >> 17
              state ^= (state << 5) & 0xFFFFFFFF
              state &= 0xFFFFFFFF
              data[index] = state & 0xFF

          path.write_bytes(data)
          PY

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            create artifacts/cli-smoke/content.bin artifacts/cli-smoke/content.csm --bidx --sha256 \
            > artifacts/cli-smoke/create.txt

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            inspect artifacts/cli-smoke/content.csm \
            > artifacts/cli-smoke/inspect.txt

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            verify artifacts/cli-smoke/content.csm artifacts/cli-smoke/content.bin \
            > artifacts/cli-smoke/verify.txt

          grep -q '^valid=true$' artifacts/cli-smoke/inspect.txt
          grep -q '^valid=true$' artifacts/cli-smoke/verify.txt
          grep -q '^bidx=true$' artifacts/cli-smoke/verify.txt

          cp artifacts/cli-smoke/content.bin artifacts/cli-smoke/wrong.bin
          python3 - <<'PY'
          from pathlib import Path

          path = Path("artifacts/cli-smoke/wrong.bin")
          data = bytearray(path.read_bytes())
          data[len(data) // 2] ^= 0x80
          path.write_bytes(data)
          PY

          set +e
          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            verify artifacts/cli-smoke/content.csm artifacts/cli-smoke/wrong.bin \
            > artifacts/cli-smoke/mismatch.txt
          status=$?
          set -e

          test "$status" -eq 1
          grep -q '^valid=false$' artifacts/cli-smoke/mismatch.txt
          grep -q 'Content' artifacts/cli-smoke/mismatch.txt

          # create must refuse to publish a manifest over its own source, both
          # by the same path and through a symbolic link, and leave it intact.
          cp artifacts/cli-smoke/content.bin artifacts/cli-smoke/self.bin
          ln -s self.bin artifacts/cli-smoke/self-link.csm

          for target in artifacts/cli-smoke/self.bin artifacts/cli-smoke/self-link.csm
          do
            set +e
            dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
              create artifacts/cli-smoke/self.bin "$target" \
              > artifacts/cli-smoke/self.txt 2>&1
            status=$?
            set -e

            test "$status" -eq 2
            grep -q 'must not be the same file' artifacts/cli-smoke/self.txt
            cmp artifacts/cli-smoke/content.bin artifacts/cli-smoke/self.bin
          done

          # plan is a read-only chunk reuse report. The edited input inserts
          # 4096 deterministic bytes in the middle of content.bin.
          cp artifacts/cli-smoke/content.bin artifacts/cli-smoke/edited.bin
          python3 - <<'PY'
          from pathlib import Path

          path = Path("artifacts/cli-smoke/edited.bin")
          data = path.read_bytes()
          path.write_bytes(data[:300000] + b"\x5a" * 4096 + data[300000:])
          PY

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            create artifacts/cli-smoke/edited.bin artifacts/cli-smoke/edited.csm --bidx --sha256 \
            > artifacts/cli-smoke/create-edited.txt

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            plan --base artifacts/cli-smoke/content.csm --target artifacts/cli-smoke/content.csm \
            > artifacts/cli-smoke/plan-self.txt

          grep -q '^valid=true$' artifacts/cli-smoke/plan-self.txt
          grep -q '^missing-bytes=0$' artifacts/cli-smoke/plan-self.txt
          grep -q '^reused-bytes=1048576$' artifacts/cli-smoke/plan-self.txt

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            plan --base artifacts/cli-smoke/content.csm --target artifacts/cli-smoke/edited.csm \
            > artifacts/cli-smoke/plan-edited.txt

          grep -q '^valid=true$' artifacts/cli-smoke/plan-edited.txt

          reused_bytes=$(grep '^reused-bytes=' artifacts/cli-smoke/plan-edited.txt | cut -d= -f2)
          missing_bytes=$(grep '^missing-bytes=' artifacts/cli-smoke/plan-edited.txt | cut -d= -f2)
          reused_chunks=$(grep '^reused-chunks=' artifacts/cli-smoke/plan-edited.txt | cut -d= -f2)
          missing_chunks=$(grep '^missing-chunks=' artifacts/cli-smoke/plan-edited.txt | cut -d= -f2)
          target_bytes=$(grep '^target-bytes=' artifacts/cli-smoke/plan-edited.txt | cut -d= -f2)
          target_chunks=$(grep '^target-chunks=' artifacts/cli-smoke/plan-edited.txt | cut -d= -f2)
          unique_missing_bytes=$(grep '^unique-missing-bytes=' artifacts/cli-smoke/plan-edited.txt | cut -d= -f2)

          test "$reused_bytes" -gt 0
          test "$missing_bytes" -gt 0
          test "$((reused_bytes + missing_bytes))" -eq "$target_bytes"
          test "$target_bytes" -eq "$(wc -c < artifacts/cli-smoke/edited.bin)"
          test "$((reused_chunks + missing_chunks))" -eq "$target_chunks"
          test "$unique_missing_bytes" -le "$missing_bytes"

          # Chunk ids from different hash suites are not comparable.
          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            create artifacts/cli-smoke/content.bin artifacts/cli-smoke/content-blake3.csm \
            > artifacts/cli-smoke/create-blake3.txt

          set +e
          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            plan --base artifacts/cli-smoke/content.csm --target artifacts/cli-smoke/content-blake3.csm \
            > artifacts/cli-smoke/plan-suite.txt 2> artifacts/cli-smoke/plan-suite.err
          status=$?
          set -e

          test "$status" -eq 1
          test ! -s artifacts/cli-smoke/plan-suite.txt
          grep -q 'different hash suites' artifacts/cli-smoke/plan-suite.err

          set +e
          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            plan --base artifacts/cli-smoke/content.csm \
            > artifacts/cli-smoke/plan-usage.txt 2>&1
          status=$?
          set -e

          test "$status" -eq 2
          grep -q 'plan requires --base' artifacts/cli-smoke/plan-usage.txt

  package-smoke:
    name: package-smoke
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChunkShift.slnx

      - name: Build package projects
        run: |
          dotnet build src/ChunkShift/ChunkShift.csproj -c Release --no-restore
          dotnet build src/ChunkShift.Patching/ChunkShift.Patching.csproj -c Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/ChunkShift/ChunkShift.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion=${PACKAGE_VERSION}
          dotnet pack src/ChunkShift.Patching/ChunkShift.Patching.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion=${PACKAGE_VERSION}

      - name: Check package runtime dependencies
        run: |
          python3 tools/package/check_dependencies.py "artifacts/packages/ChunkShift.${PACKAGE_VERSION}.nupkg"
          python3 tools/package/check_dependencies.py "artifacts/packages/ChunkShift.Patching.${PACKAGE_VERSION}.nupkg"

      - name: Consume produced package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/package-smoke
          dotnet run --project tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -- --evidence artifacts/package-smoke/jit-linux-x64.txt

      - name: Build and run samples against produced package
        shell: bash
        run: |
          set -euo pipefail
          work=artifacts/samples
          mkdir -p "$work"

          for project in Console AspNetCore
          do
            dotnet build "samples/ChunkShift.Samples.${project}/ChunkShift.Samples.${project}.csproj" -c Release \
              -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
              -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages"
          done

          console() {
            dotnet samples/ChunkShift.Samples.Console/bin/Release/net10.0/ChunkShift.Samples.Console.dll "$@"
          }

          head -c $((6 * 1024 * 1024)) /dev/urandom > "$work/content.bin"
          head -c $((9 * 1024 * 1024)) /dev/urandom > "$work/oversized.bin"

          # Console: scan, create, verify, then a content mismatch.
          console scan "$work/content.bin" > "$work/scan.txt"
          chunks=$(wc -l < "$work/scan.txt")
          test "$chunks" -gt 0

          console create "$work/content.bin" "$work/content.csm" > "$work/create.txt"
          grep -q '^manifest-id=' "$work/create.txt"
          console verify "$work/content.bin" "$work/content.csm" | grep -q '^valid=true '

          cp "$work/content.bin" "$work/wrong.bin"
          python3 -c 'import sys; p = sys.argv[1]; d = bytearray(open(p, "rb").read()); d[len(d) // 2] ^= 0x80; open(p, "wb").write(d)' "$work/wrong.bin"
          set +e
          console verify "$work/wrong.bin" "$work/content.csm" > "$work/mismatch.txt"
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '^valid=false ' "$work/mismatch.txt"

          # create never replaces an existing manifest.
          cp "$work/content.csm" "$work/existing.csm"
          set +e
          console create "$work/wrong.bin" "$work/existing.csm" 2> /dev/null
          status=$?
          set -e
          test "$status" -eq 2
          cmp "$work/content.csm" "$work/existing.csm"
          test -z "$(find "$work" -name '*.tmp')"

          # ASP.NET Core: request-body streaming with an explicit 8 MiB limit.
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          export ASPNETCORE_URLS="http://127.0.0.1:${port}"
          export ChunkShift__MaxRequestBodyBytes=$((8 * 1024 * 1024))
          export ChunkShift__ChunkStore="${GITHUB_WORKSPACE}/$work/store"
          dotnet samples/ChunkShift.Samples.AspNetCore/bin/Release/net10.0/ChunkShift.Samples.AspNetCore.dll \
            > "$work/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2> /dev/null || true; cat "$work/server.log"' EXIT

          ready=false
          for _ in $(seq 60)
          do
            if curl -sf -o /dev/null -X POST --data-binary '' "$ASPNETCORE_URLS/chunks"; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true

          post() {
            curl -sS --fail -X POST -H 'Content-Type: application/octet-stream' \
              --data-binary "@$1" "$ASPNETCORE_URLS/$2" "${@:3}"
          }

          # The server-side manifest verifies and matches the console one byte for byte.
          post "$work/content.bin" manifest -o "$work/server.csm"
          console verify "$work/content.bin" "$work/server.csm" | grep -q '^valid=true '
          cmp "$work/content.csm" "$work/server.csm"

          # Chunks are stored once; a repeated upload stores nothing new.
          post "$work/content.bin" chunks > "$work/chunks-1.txt"
          post "$work/content.bin" chunks > "$work/chunks-2.txt"
          grep -qx "chunks=${chunks} bytes=$((6 * 1024 * 1024)) stored=${chunks}" "$work/chunks-1.txt"
          grep -qx "chunks=${chunks} bytes=$((6 * 1024 * 1024)) stored=0" "$work/chunks-2.txt"
          test "$(find "$work/store" -type f | wc -l)" -eq "$chunks"

          # A body over the configured limit is refused, not silently accepted.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/octet-stream' \
            --data-binary "@$work/oversized.bin" "$ASPNETCORE_URLS/manifest" || true)
          test "$code" = 413

      - name: Upload package smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chunkshift-package-smoke
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/package-smoke/*.txt
          if-no-files-found: error
          retention-days: 7
