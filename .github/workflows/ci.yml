name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChunkShift.slnx

      - name: Build
        run: dotnet build ChunkShift.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ChunkShift.slnx -c Release --no-build --no-restore

      - name: Verify CSM vectors with the independent decoder
        if: matrix.os == 'ubuntu-24.04'
        run: python3 tools/csm-fixtures/generate.py --verify tests/ChunkShift.Tests/Fixtures/CsmV1

      - name: CLI CSM round-trip
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cli-smoke

          python3 - <<'PY'
          from pathlib import Path

          path = Path("artifacts/cli-smoke/content.bin")
          data = bytearray(1024 * 1024)
          state = 0xC5A5EED

          for index in range(len(data)):
              state ^= (state << 13) & 0xFFFFFFFF
              state ^= state >> 17
              state ^= (state << 5) & 0xFFFFFFFF
              state &= 0xFFFFFFFF
              data[index] = state & 0xFF

          path.write_bytes(data)
          PY

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            create artifacts/cli-smoke/content.bin artifacts/cli-smoke/content.csm --bidx --sha256 \
            > artifacts/cli-smoke/create.txt

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            inspect artifacts/cli-smoke/content.csm \
            > artifacts/cli-smoke/inspect.txt

          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            verify artifacts/cli-smoke/content.csm artifacts/cli-smoke/content.bin \
            > artifacts/cli-smoke/verify.txt

          grep -q '^valid=true$' artifacts/cli-smoke/inspect.txt
          grep -q '^valid=true$' artifacts/cli-smoke/verify.txt
          grep -q '^bidx=true$' artifacts/cli-smoke/verify.txt

          cp artifacts/cli-smoke/content.bin artifacts/cli-smoke/wrong.bin
          python3 - <<'PY'
          from pathlib import Path

          path = Path("artifacts/cli-smoke/wrong.bin")
          data = bytearray(path.read_bytes())
          data[len(data) // 2] ^= 0x80
          path.write_bytes(data)
          PY

          set +e
          dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
            verify artifacts/cli-smoke/content.csm artifacts/cli-smoke/wrong.bin \
            > artifacts/cli-smoke/mismatch.txt
          status=$?
          set -e

          test "$status" -eq 1
          grep -q '^valid=false$' artifacts/cli-smoke/mismatch.txt
          grep -q 'Content' artifacts/cli-smoke/mismatch.txt

          # create must refuse to publish a manifest over its own source, both
          # by the same path and through a symbolic link, and leave it intact.
          cp artifacts/cli-smoke/content.bin artifacts/cli-smoke/self.bin
          ln -s self.bin artifacts/cli-smoke/self-link.csm

          for target in artifacts/cli-smoke/self.bin artifacts/cli-smoke/self-link.csm
          do
            set +e
            dotnet run --project src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --no-build -- \
              create artifacts/cli-smoke/self.bin "$target" \
              > artifacts/cli-smoke/self.txt 2>&1
            status=$?
            set -e

            test "$status" -eq 2
            grep -q 'must not be the same file' artifacts/cli-smoke/self.txt
            cmp artifacts/cli-smoke/content.bin artifacts/cli-smoke/self.bin
          done

  package-smoke:
    name: package-smoke
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChunkShift.slnx

      - name: Build package project
        run: dotnet build src/ChunkShift/ChunkShift.csproj -c Release --no-restore

      - name: Pack
        run: dotnet pack src/ChunkShift/ChunkShift.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion=${PACKAGE_VERSION}

      - name: Consume produced package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/package-smoke
          dotnet run --project tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -- --evidence artifacts/package-smoke/jit-linux-x64.txt

      - name: Upload package smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chunkshift-package-smoke
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/package-smoke/*.txt
          if-no-files-found: error
          retention-days: 7
