name: Repository R0 model

on:
  pull_request:
    paths:
      - "tools/repository-preflight/**"
      - "docs/architecture/REPOSITORY-R0-PREFLIGHT-20261124.md"
      - "ROADMAP.md"
      - ".github/workflows/repository-r0-model.yml"
  push:
    branches: [main]
    paths:
      - "tools/repository-preflight/**"
      - "docs/architecture/REPOSITORY-R0-PREFLIGHT-20261124.md"
      - "ROADMAP.md"
      - ".github/workflows/repository-r0-model.yml"

permissions:
  contents: read

jobs:
  publication-model:
    name: publication-model (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run abstract Repository publication model
        run: python -m unittest discover -s tools/repository-preflight -p "test_*.py" -v
