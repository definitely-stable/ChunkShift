name: PATCH-TREE-001 T2A2 independently replay original physical evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/research/results/PATCH-TREE-001-T2A2-ORIGINAL-PHYSICAL-EVIDENCE-20261026-001.md'
      - 'docs/research/results/data/PATCH-TREE-001-T2A2-EVIDENCE-20261026-001/**'
      - '.github/workflows/patch-tree-001-t2a2-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify committed immutable original four-row physical ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/research/results/data/PATCH-TREE-001-T2A2-EVIDENCE-20261026-001/recompute.py

      - name: Independently fetch exact original run, parent, artifact and ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/definitely-stable/ChunkShift/actions/runs/40281148160 > "$RUNNER_TEMP/t2a2-run.json"
          gh api repos/definitely-stable/ChunkShift/actions/runs/40204580308 > "$RUNNER_TEMP/t2a2-parent.json"
          gh api repos/definitely-stable/ChunkShift/actions/artifacts/12632258695 > "$RUNNER_TEMP/t2a2-artifact.json"
          gh api repos/definitely-stable/ChunkShift/actions/artifacts/12632258695/zip > "$RUNNER_TEMP/t2a2-original.zip"
          echo 'be60d2982ae8c8eb904fbd4233dd91d5248b14cf8e36a1c4c2365629573dda8e  '"$RUNNER_TEMP/t2a2-original.zip" | sha256sum --check

      - name: Recompute every physical value, pinned original tree layout and all 16 samples
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/research/results/data/PATCH-TREE-001-T2A2-EVIDENCE-20261026-001/recompute.py \
            --original-zip "$RUNNER_TEMP/t2a2-original.zip" \
            --run-json "$RUNNER_TEMP/t2a2-run.json" \
            --artifact-json "$RUNNER_TEMP/t2a2-artifact.json" \
            --parent-json "$RUNNER_TEMP/t2a2-parent.json"
          echo 'T2A2 independently replayed original four .NET trees: PHYSICAL SIZE GAIN ONLY / NO paired T0 CPU, private RSS or publisher / NO_PRODUCTION_ADOPT' >> "$GITHUB_STEP_SUMMARY"

      - name: Reject mutated archived physical byte ledgers, CSP hash and path identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/t2a2-original.zip" <<'PY'
          import copy, importlib.util, pathlib, sys
          code = pathlib.Path("docs/research/results/data/PATCH-TREE-001-T2A2-EVIDENCE-20261026-001/recompute.py")
          spec = importlib.util.spec_from_file_location("independent_t2a2", code)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          original = module.verify_zip(pathlib.Path(sys.argv[1]))
          import csv
          with open(code.with_name("census.tsv"), encoding="utf-8") as f:
            ledger = list(csv.DictReader(f, delimiter="\t"))
          for mutate in ("t2WarmPhysicalBytes", "cspSha256", "targetTreeMapBytes"):
            altered = copy.deepcopy(original)
            if mutate == "cspSha256":
              altered["t2a2-original-pilot.json"]["pairs"][1]["samples"][1]["cspSha256"] = "0" * 64
            else:
              altered["t2a2-original-pilot.json"]["pairs"][0][mutate] += 1
            try:
              module.run_audit(altered, ledger)
            except ValueError:
              pass
            else:
              raise SystemExit("T2A2 independent negative mutation not rejected: " + mutate)
          print("Three independent semantic mutation tests passed")
          PY
