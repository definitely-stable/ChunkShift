name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact SemVer package version (for example 0.1.0 or 0.1.1-rc.1)"
        required: true
        type: string
      publish_nuget:
        description: "Publish to NuGet.org after validation (requires trusted publishing setup)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    name: validate-package${{ inputs.publish_nuget && '-publish' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release

    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release workflow must be dispatched from main." >&2
            exit 1
          fi

      - name: Validate requested version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^0\.1\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must follow the current 0.1.Z release train." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The requested version must be the one main declares: its X.Y.Z core
      # equals VersionPrefix, so every release first bumps VersionPrefix in a
      # reviewed PR. A version that is already on NuGet.org, or whose tag
      # already exists, is refused before anything is built.
      - name: Check version against VersionPrefix, NuGet.org and tags
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          prefix=$(dotnet msbuild src/ChunkShift/ChunkShift.csproj -getProperty:VersionPrefix | tr -d '[:space:]')
          if [[ "${VERSION%%-*}" != "${prefix}" ]]; then
            echo "Version ${VERSION} does not match VersionPrefix ${prefix} on this commit; bump VersionPrefix in a PR first." >&2
            exit 1
          fi

          # NuGet.org flat container: 404 means the package id has no versions
          # yet; any other non-200 answer is an error, not "not published".
          status=$(curl -sS -o nuget-versions.json -w '%{http_code}' \
            "https://api.nuget.org/v3-flatcontainer/chunkshift/index.json")
          if [[ "${status}" == 404 ]]; then
            echo '{"versions": []}' > nuget-versions.json
          elif [[ "${status}" != 200 ]]; then
            echo "NuGet.org version lookup failed with HTTP ${status}." >&2
            exit 1
          fi

          # Refuse any version that is not strictly higher, by SemVer 2.0
          # precedence, than every version already on NuGet.org: that covers
          # reuse (equal), lower cores, lower pre-releases (rc.2 < rc.10,
          # beta < rc.1) and a pre-release after its own stable release.
          python3 - <<'PY'
          import json, os, sys

          def precedence(version):
              core, _, pre = version.split("+", 1)[0].partition("-")
              numbers = tuple(int(part) for part in core.split("."))
              if not pre:
                  return (numbers, 1, ())
              return (numbers, 0, tuple(
                  (0, int(part), "") if part.isdigit() else (1, 0, part)
                  for part in pre.split(".")))

          requested = os.environ["VERSION"].lower()
          for version in json.load(open("nuget-versions.json"))["versions"]:
              if precedence(version) >= precedence(requested):
                  sys.exit(f"ChunkShift {requested} is not higher than published {version}; published versions are never reused.")
          PY

          if [[ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]]; then
            echo "Tag v${VERSION} already exists; release tags are never moved or reused." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore ChunkShift.slnx

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet build ChunkShift.slnx -c Release --no-restore
          dotnet test ChunkShift.slnx -c Release --no-build --no-restore

      - name: Pack exact release artifacts
        run: dotnet pack src/ChunkShift/ChunkShift.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion=${{ inputs.version }}

      # The release gate runs the same real-path package smoke as CI and heavy
      # validation (scanner, manifest create/verify/read, bounded 32 MiB
      # forward-only source) as a NativeAOT consumer of the exact package.
      - name: Consume exact package (NativeAOT)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/package-smoke
          dotnet publish tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -r linux-x64 --self-contained true -p:PublishAot=true -p:PublishTrimmed=true \
            -p:ChunkShiftPackageVersion="${VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -o artifacts/release-consumer-publish
          ./artifacts/release-consumer-publish/ChunkShift.PackageSmoke \
            --evidence artifacts/package-smoke/release-aot-linux-x64.txt

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chunkshift-${{ inputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: Attest package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

      - name: NuGet trusted-publishing login
        if: ${{ inputs.publish_nuget }}
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: ${{ inputs.publish_nuget }}
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # The package itself must not exist yet: a duplicate fails. Symbols
          # go separately and may be retried (--skip-duplicate), so a symbol
          # upload failure after the package is published can be recovered.
          dotnet nuget push "artifacts/packages/*.nupkg" --no-symbols \
            --api-key "${NUGET_API_KEY}" \
            --source "https://api.nuget.org/v3/index.json"
          dotnet nuget push "artifacts/packages/*.snupkg" --skip-duplicate \
            --api-key "${NUGET_API_KEY}" \
            --source "https://api.nuget.org/v3/index.json"

  # Tags the exact commit the published packages were built from. A separate
  # job holds the only write permission and runs no repository code.
  tag:
    name: tag-release
    needs: release
    if: ${{ inputs.publish_nuget }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create v${{ inputs.version }} tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Fails if the tag already exists; an existing tag is never moved.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="${GITHUB_SHA}"
