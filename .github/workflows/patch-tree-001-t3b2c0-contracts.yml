name: PATCH-TREE-001 T3B2C0 base stream trace contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeT3B2C0.cs'
      - 'benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeT3B2C0Tests.cs'
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/PatchLabRunner.cs'
      - '.github/workflows/patch-tree-001-t3b2c0-contracts.yml'
      - '.github/workflows/patch-tree-001-t3b2c0-real-calibration.yml'
      - 'docs/benchmarks/PATCH-TREE-001-T3B2C0-BASE-READ-TOPOLOGY-PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csp-stream:
    name: Observed public CSP create/apply (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Real public SDK CSP and bounded source interval tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj \
            -c Release --filter FullyQualifiedName~PatchTreeT3B2C0
          echo 'T3B2C0 SYNTHETIC TRACE CONTRACTS; NOT ORIGINAL PERFORMANCE EVIDENCE' >> "$GITHUB_STEP_SUMMARY"
