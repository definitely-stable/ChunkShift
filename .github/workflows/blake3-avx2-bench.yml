name: Blake3 AVX2 bench (temporary)

# Temporary measurement branch: compares upstream Blake3 master (PR base) with a local
# AVX2 register-pressure patch on GitHub-hosted runners. Runs only on pushes to
# this branch; the branch is deleted after the measurement.
on:
  push:
    branches: [bench/blake3-avx2-drow]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  bench:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: ubuntu-x64-1, optional: false }
          - { os: ubuntu-24.04, label: ubuntu-x64-2, optional: false }
          - { os: ubuntu-24.04, label: ubuntu-x64-3, optional: false }
          - { os: windows-2025, label: windows-x64-1, optional: false }
          - { os: windows-2025, label: windows-x64-2, optional: false }
          - { os: ubuntu-24.04-arm, label: ubuntu-arm64, optional: false }
          - { os: windows-11-arm, label: windows-arm64, optional: true }
          - { os: macos-15, label: macos-arm64, optional: false }
          - { os: macos-15-intel, label: macos-x64, optional: true }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: CPU
        id: cpu
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) cpu="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)";;
            Windows) cpu="$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name')";;
            macOS) cpu="$(sysctl -n machdep.cpu.brand_string)";;
          esac
          echo "cpu=$(echo "$cpu" | tr -s ' ' | sed 's/[[:space:]]*$//')" >> "$GITHUB_OUTPUT"

      - name: Measure
        shell: bash
        run: bash bench/blake3-avx2/run.sh "$RUNNER_TEMP/b3" "$RUNNER_TEMP/results-${{ matrix.label }}.txt"

      - name: Summary
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          py="$(command -v python3 || command -v python)"
          "$py" bench/blake3-avx2/summarize.py "$RUNNER_TEMP/results-${{ matrix.label }}.txt" "${{ matrix.label }}" "${{ steps.cpu.outputs.cpu }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.label }}
          path: ${{ runner.temp }}/results-${{ matrix.label }}.txt
          if-no-files-found: warn
          retention-days: 14
