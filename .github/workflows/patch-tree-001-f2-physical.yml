name: PATCH-TREE-001 F2 physical foundation

# Synthetic only. Do not download real corpus or open sealed holdouts.
on:
  pull_request:
    paths:
      - "src/ChunkShift.Patching/Creation/CspCreateExecution.cs"
      - "src/ChunkShift.Patching/Creation/CspPatchBuilder.cs"
      - "benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeF2*.cs"
      - "benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeF2PhysicalTests.cs"
      - "docs/benchmarks/PATCH-TREE-001-F2-PHYSICAL-FOUNDATION.md"
      - ".github/workflows/patch-tree-001-f2-physical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f2-synthetic:
    name: F2 genuine synthetic CSP create/apply and F0 accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: F2 physical mechanics tests
        run: dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~PatchTreeF2PhysicalTests
      - name: Mark no original-corpus verdict
        run: echo "F2-P1 synthetic-only physical mechanics; no original corpus or adoption evidence." >> "$GITHUB_STEP_SUMMARY"
