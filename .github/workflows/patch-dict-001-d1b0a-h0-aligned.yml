name: PATCH-DICT-001 D1-B0A H0-aligned original calibration

on:
  pull_request:
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Dictionary/PatchDictD1b0a.cs'
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Dictionary/PatchDictD1b0.cs'
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/PatchLabRunner.cs'
      - 'benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchDictD1b0aTests.cs'
      - 'docs/benchmarks/PATCH-DICT-001-D1B0A-H0-ALIGNED-PROTOCOL.md'
      - '.github/workflows/patch-dict-001-d1b0a-h0-aligned.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  contracts:
    name: d1b0a-full-csp-contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact source HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore and build
        shell: bash
        run: |
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Verify whole-CSP H0 and research Apply contracts
        shell: bash
        run: |
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj \
            -c Release --no-build --no-restore --filter FullyQualifiedName~PatchDictD1b0aTests

  original-calibration:
    name: d1b0a-locked-original-calibration
    runs-on: ubuntu-24.04
    needs: contracts
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify source identity and clean tree
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "CORPUS_ROOT=$HOME/patch-corpus" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/patch-dict-001-d1b0a" >> "$GITHUB_ENV"
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup independent Python 3.14 CSP decoder
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Restore verified upstream original release assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}
      - name: Materialize pinned corpus and verify pair lock
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$CORPUS_ROOT" --sources "$HOME/patch-corpus/sources" --download --lock
          echo "Frozen corpus digest: $(sha256sum "$CORPUS_ROOT/pairs.json")"
          test "$(sha256sum "$CORPUS_ROOT/pairs.json" | cut -d' ' -f1)" = \
            "8b3b92a9d0fba4bee80602aeafbdd443e5c612ff94889621537b8fb910fd22dd"
      - name: Build pinned research lab
        shell: bash
        run: |
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Measure first eligible original calibration files and real Apply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          dotnet benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll \
            patch-lab dict-d1b0a --corpus "$CORPUS_ROOT" \
            --output "$OUT/summary.json" --evidence-dir "$OUT/evidence" \
            --source-commit "$SOURCE_COMMIT"
      - name: Independently verify byte-identical H0 replay and real full-CSP Apply
        shell: bash
        run: |
          set -euo pipefail
          python - "$OUT/summary.json" "$OUT/evidence" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          summary = json.loads(pathlib.Path(sys.argv[1]).read_text())
          root = pathlib.Path(sys.argv[2])
          assert summary['experimentId'] == 'PATCH-DICT-001'
          assert summary['datasetRole'] == 'calibration'
          assert summary['sourceCommit'] == os.environ['SOURCE_COMMIT']
          assert summary['pairsSha256'] == '8b3b92a9d0fba4bee80602aeafbdd443e5c612ff94889621537b8fb910fd22dd'
          assert 1 <= summary['fileCount'] <= 2 and summary['fileCount'] == len(summary['files'])
          assert 'NOT_FRESH_HOLDOUT' in summary['evidenceClass']
          for i, row in enumerate(summary['files']):
              prefix = f'{i:02d}'
              assert row['family'] in ('dotnet-aspnetcore-win-x64', 'dotnet-runtime-linux-arm64')
              assert row['h0ReplayByteIdentical'] is True
              assert row['nonfocusEntriesIdentical'] is True
              assert row['h0PhysicalBytes'] >= row['alignedContiguousPhysicalBytes'] >= row['alignedCompositePhysicalBytes']
              assert row['compositeSavingsVsContiguous'] >= 0
              assert 0 <= row['contiguousReferences'] <= 4
              assert 0 <= row['compositeReferences'] <= 4
              assert row['contiguousEligibleTrials'] >= 0
              assert row['compositeEligibleTrials'] >= 0
              source = root / (prefix + '.base.bin')
              assert hashlib.sha256(source.read_bytes()).hexdigest() == row['originalBaseSha256']
              assert (root / (prefix + '.target.sha256')).read_text().strip() == row['originalTargetSha256']
              for label, bytes_key, sha_key in (
                  ('h0', 'h0PhysicalBytes', 'h0PatchSha256'),
                  ('contiguous', 'alignedContiguousPhysicalBytes', 'alignedContiguousSha256'),
                  ('composite', 'alignedCompositePhysicalBytes', 'alignedCompositeSha256'),
              ):
                  patch = root / (prefix + '-' + label + '.csp')
                  payload = patch.read_bytes()
                  assert len(payload) == row[bytes_key]
                  assert hashlib.sha256(payload).hexdigest() == row[sha_key]
                  proc = subprocess.run(
                      [sys.executable, 'tools/csp-fixtures/decode.py', str(patch),
                       '--base-manifest', str(root / (prefix + '.base.csm')),
                       '--base', str(source)], check=True, capture_output=True, text=True)
                  decoded = json.loads(proc.stdout)
                  assert decoded['verdict'] == 'valid', decoded
                  assert decoded['outputSha256'] == row['originalTargetSha256'], decoded
                  assert row[label+'Apply']['targetSha256'] == row['originalTargetSha256']
              print(f"D1-B0A matched H0 original {i}: {row['family']}/{row['path']}, "
                    f"whole bytes: {row['h0PhysicalBytes']}/"
                    f"{row['alignedContiguousPhysicalBytes']}/"
                    f"{row['alignedCompositePhysicalBytes']}; "
                    f"composite extra saving={row['compositeSavingsVsContiguous']} B")
          print('D1-B0A original exact H0 replay and independent physical Apply PASS — NOT DECISION')
          PY
      - name: Archive first-attempt original calibration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-dict-001-d1b0a-original-${{ github.sha }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 21
