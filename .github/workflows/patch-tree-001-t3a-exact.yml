name: PATCH-TREE-001 T3A exact cross-path contracts

# Synthetic mechanics only: never download frozen corpus or access holdout.
on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/scripts/patch_tree_001_t3_exact.py'
      - 'benchmarks/scripts/test_patch_tree_001_t3_exact.py'
      - 'docs/benchmarks/PATCH-TREE-001-T3A-EXACT-CROSS-PATH-PROTOCOL.md'
      - '.github/workflows/patch-tree-001-t3a-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t3a-exact:
    name: Synthetic T3A contracts (${{ matrix.os })
    runs-on: ${{ matrix.os }
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Exact mapping, independent decode and reconstruction oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/scripts/patch_tree_001_t3_exact.py benchmarks/scripts/test_patch_tree_001_t3_exact.py
          python -m unittest discover -s benchmarks/scripts -p 'test_patch_tree_001_t3_exact.py' -v
          echo 'T3A SYNTHETIC_CONTRACT_PASS / NO_REAL_CORPUS / NO_PRODUCT_ADOPT' >> "$GITHUB_STEP_SUMMARY"
