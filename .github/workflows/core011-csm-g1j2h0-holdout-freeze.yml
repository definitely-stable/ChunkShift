name: CORE011 CSM G1-J2H0 independent NuGet SHA prefreeze

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core011-csm-g1j2h0-holdout-freeze.yml"
      - "benchmarks/scripts/core011_csm_g1j2h0_holdout_freeze.py"
      - "benchmarks/scripts/test_core011_csm_g1j2h0_holdout_freeze.py"
      - "docs/benchmarks/CORE011-CSM-001-G1J2H0-HOLDOUT-FREEZE-PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core011-g1j2h0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-managed-nuget-prefreeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout exact frozen revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Negative controls and J1 decision lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v benchmarks/scripts/test_core011_csm_g1j2h0_holdout_freeze.py
          python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json
          if python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json \
            --decision-ready; then
            echo "H0 cannot promote a product decision" >&2
            exit 1
          fi
      - name: Download fixed NuGet releases and record only SHA identities
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/core011_csm_g1j2h0_holdout_freeze.py \
            --output-dir "$RUNNER_TEMP/core011-g1j2h0-data" \
            --run-id "CORE011-CSM-001/G1J2H0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:8}-linux-x64"
          python3 - "$RUNNER_TEMP/core011-g1j2h0-data" <<'PY'
          import json,sys
          from pathlib import Path
          directory=Path(sys.argv[1])
          assert sorted(x.name for x in directory.iterdir())==["prefreeze.json"]
          d=json.loads((directory/"prefreeze.json").read_text())
          assert d["stage"]=="CORPUS_PREFREEZE_ONLY"
          assert d["noChunkingOrPatchMeasurements"] is True
          assert d["decisionRunsAllowed"] is False
          assert d["budgetsLocked"] is False
          assert d["verdict"]=="NO_VERDICT_EXPLORATORY"
          assert d["base"]["dllSha256"] != d["target"]["dllSha256"]
          assert [d[r]["nugetVersion"] for r in ("base","target")] == ["13.0.2","13.0.3"]
          print("J2H0 prefreeze only: SHA identifiers + original CLR eligibility PASS")
          PY
      - name: Archive only non-content evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core011-csm-g1j2h0-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core011-g1j2h0-data/prefreeze.json
            ${{ runner.temp }}/core011-g1j2h0-data/failure.json
          if-no-files-found: warn
          retention-days: 90
