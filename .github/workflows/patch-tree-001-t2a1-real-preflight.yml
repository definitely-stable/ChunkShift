name: PATCH-TREE-001 T2A1 original full-tree CSM capacity

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeT2A1.cs'
      - '.github/workflows/patch-tree-001-t2a1-real-preflight.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: patch-tree-001-t2a1-original-preflight
  cancel-in-progress: false

jobs:
  original-csm-only:
    name: Original 4-pair CSM-only preflight, Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - name: Fail closed outside first GitHub-hosted main push
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_REPOSITORY" = definitely-stable/ChunkShift
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1

      - name: Checkout original first-main-sha source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache checksum-locked .NET release assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-tree-001-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Check original first-success pairs and T0 source workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]
          for runid, expected in (
            (38136336025, ".github/workflows/patch-tree-001-pairs-reference.yml"),
            (38142160679, ".github/workflows/patch-tree-001-t0-t1-calibration.yml"),
          ):
            obj=json.loads(subprocess.check_output(
              ["gh","api",f"repos/{repo}/actions/runs/{runid}"],text=True))
            if not (obj.get("id")==runid and obj.get("event")=="workflow_dispatch" and
                    obj.get("run_attempt")==1 and obj.get("head_branch")=="main" and
                    obj.get("status")=="completed" and obj.get("conclusion")=="success" and
                    obj.get("repository",{}).get("full_name")==repo and
                    obj.get("path","").split("@")[0]==expected):
              raise SystemExit("T2A1 original parent source provenance rejected")
          PY
          mkdir -p "$RUNNER_TEMP/t2a1-ref" "$RUNNER_TEMP/t2a1-prior"
          gh run download 38136336025 -R "$GITHUB_REPOSITORY" \
            -n patch-tree-001-original-pairs -D "$RUNNER_TEMP/t2a1-ref"
          gh run download 38142160679 -R "$GITHUB_REPOSITORY" \
            -n patch-tree-001-t0-t1-calibration -D "$RUNNER_TEMP/t2a1-prior"
          ( cd "$RUNNER_TEMP/t2a1-ref" && sha256sum --check SHA256SUMS )
          ( cd "$RUNNER_TEMP/t2a1-prior" && sha256sum --check SHA256SUMS )
          python3 - "$RUNNER_TEMP/t2a1-ref/pairs.json" <<'PY'
          import hashlib,json,pathlib,re,sys
          expected=json.loads(pathlib.Path(
              "docs/benchmarks/patch-corpus/corpus-lock.json").read_text())["pairsSha256"]
          if not isinstance(expected,str) or not re.fullmatch(r"[0-9a-f]{64}",expected):
              raise SystemExit("Invalid pinned original corpus SHA256 length/format")
          actual=hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("Source-locked pairs.json does not match authoritative corpus lock")
          print("Original pairs SHA256 verified:", actual)
          PY
          echo 'd0de7fb182cc15bd590b1335c92705d464764fab0cdfc021ad9f31928e2d5b5c  '"$RUNNER_TEMP/t2a1-prior/calibration.json" | sha256sum --check
          echo '6deb37fd4cb778fab1ad67a1da8d187ed0205ac2c89c4fa391e5507169da389a  '"$RUNNER_TEMP/t2a1-prior/layouts.json" | sha256sum --check

      - name: Materialize verified four-original-.NET-tree calibration only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t2a1-results"
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$RUNNER_TEMP/t2a1-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock --calibration-only \
            --pairs-reference "$RUNNER_TEMP/t2a1-ref/pairs.json"
          python3 benchmarks/scripts/patch_tree_001_inventory.py \
            --root "$RUNNER_TEMP/t2a1-corpus" \
            --output "$RUNNER_TEMP/t2a1-results/layouts.json" --calibration-only
          cmp "$RUNNER_TEMP/t2a1-results/layouts.json" "$RUNNER_TEMP/t2a1-prior/layouts.json"
          cp "$RUNNER_TEMP/t2a1-ref/pairs.json" "$RUNNER_TEMP/t2a1-results/original-pairs.json"
          cp "$RUNNER_TEMP/t2a1-prior/calibration.json" "$RUNNER_TEMP/t2a1-results/prior-t0-calibration.json"

      - name: Build SDK and run source-free preregistered contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
          dotnet test benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-build --no-restore \
            --filter FullyQualifiedName~PatchTreeT2A1

      - name: Execute genuine original old/new CSM-only resource census
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --project benchmarks/ChunkShift.Benchmarks -c Release -- \
            patch-lab tree-t2a1 \
            --corpus "$RUNNER_TEMP/t2a1-corpus" \
            --inventory "$RUNNER_TEMP/t2a1-results/layouts.json" \
            --baseline "$RUNNER_TEMP/t2a1-results/prior-t0-calibration.json" \
            --scratch "$RUNNER_TEMP/t2a1-temporary-csm" \
            --output "$RUNNER_TEMP/t2a1-results/t2a1-preflight.json"
          test ! -e "$RUNNER_TEMP/t2a1-temporary-csm"
          python3 - "$RUNNER_TEMP/t2a1-results" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          d=pathlib.Path(sys.argv[1])
          o=json.loads((d/'t2a1-preflight.json').read_text())
          assert o['schema']=='chunkshift.patch-tree-t2a1-csm-preflight.v1'
          assert o['status']=='ORIGINAL_CSM_CAPACITY_ONLY_NO_T2_CSP_NO_ADOPT'
          assert o['originalSourcesReverified'] is True
          assert o['originalBaseCsmIdentityMatches'] is True
          assert o['allFourPairsWithinLabCaps'] is True
          assert o['totalPriorT0WarmPhysicalBytes']==14758982
          assert len(o['pairs'])==4
          assert [p['base']['files'] for p in o['pairs']]==[339,339,193,193]
          assert all(0 < p['base']['chunkRecords'] <= 262144 and
                     0 < p['target']['chunkRecords'] <= 262144 and
                     0 < p['base']['distinctChunkIds'] <= p['base']['chunkRecords'] and
                     0 < p['target']['distinctChunkIds'] <= p['target']['chunkRecords'] and
                     p['base']['csmPhysicalBytes'] <= 8*1024*1024 and
                     p['target']['csmPhysicalBytes'] <= 8*1024*1024 for p in o['pairs'])
          provenance={
            'schema':'chunkshift.patch-tree-t2a1-original-provenance.v1',
            'status':'ORIGINAL_CSM_CAPACITY_ONLY_NO_T2_CSP_NO_ADOPT',
            'sourceSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'runId':os.environ['GITHUB_RUN_ID'],
            'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'gitRef':os.environ['GITHUB_REF'],
            'runnerEnvironment':os.environ['RUNNER_ENVIRONMENT'],
            'runnerOS':os.environ['RUNNER_OS'],
            'runnerArch':os.environ['RUNNER_ARCH'],
            'originalPairsRunId':38136336025,
            'originalT0RunId':38142160679,
            'sealedHoldoutOpened':False,'t2CspCreated':False,
          }
          assert provenance['sourceSha']==os.environ['GITHUB_SHA']
          (d/'provenance.json').write_text(json.dumps(provenance,indent=2,sort_keys=True)+'\n')
          names=('original-pairs.json','layouts.json','prior-t0-calibration.json',
                 't2a1-preflight.json','provenance.json')
          with (d/'SHA256SUMS').open('w') as out:
            for name in names:
              out.write(hashlib.sha256((d/name).read_bytes()).hexdigest()+'  '+name+'\n')
          PY
          ( cd "$RUNNER_TEMP/t2a1-results" && sha256sum --check SHA256SUMS )
          echo 'T2A1 original full-tree CSM only; NO CSP, NO_ADOPT' >> "$GITHUB_STEP_SUMMARY"

      - name: Mark failed/partial original evidence UNVERIFIED
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t2a1-results"
          printf 'UNVERIFIED_NOT_DECISION\nRun=%s\nSha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/t2a1-results/UNVERIFIED_NOT_DECISION.txt"
      - name: Archive failed diagnostics without acceptance
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-tree-t2a1-UNVERIFIED-NOT-DECISION
          path: ${{ runner.temp }}/t2a1-results/
          retention-days: 14
      - name: Archive original source-locked CSM-only preflight
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-tree-t2a1-original-CSM-only-NO-ADOPT
          path: ${{ runner.temp }}/t2a1-results/
          if-no-files-found: error
          retention-days: 90
