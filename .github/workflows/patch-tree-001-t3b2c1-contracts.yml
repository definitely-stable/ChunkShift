name: PATCH-TREE-001 T3B2C1 H2-H3 source-range contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeT3B2C1.cs'
      - 'benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeT3B2C1Tests.cs'
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/PatchLabRunner.cs'
      - 'docs/benchmarks/PATCH-TREE-001-T3B2C1-SOURCE-RANGE-PROTOCOL.md'
      - '.github/workflows/patch-tree-001-t3b2c1-contracts.yml'
      - '.github/workflows/patch-tree-001-t3b2c1-real-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  range-invariants:
    name: Exact H2/H3 real CSP source-range test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Run source-free two-pair base-range, H2/H3 exact apply and negative gates
        shell: bash
        run: |
          set -euo pipefail
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj -c Release \
            --filter FullyQualifiedName~PatchTreeT3B2C1
          echo 'T3B2C1 synthetic CSP H2-H3 contracts ONLY; NO_PRODUCTION_ADOPT' >> "$GITHUB_STEP_SUMMARY"
