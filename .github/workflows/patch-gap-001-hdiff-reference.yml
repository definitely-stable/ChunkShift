name: PATCH-GAP-001 HDiffPatch pinned real binary smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/scripts/patch_gap_hdiff_reference.py"
      - "benchmarks/scripts/test_patch_gap_hdiff_reference.py"
      - ".github/workflows/patch-gap-001-hdiff-reference.yml"
      - "docs/benchmarks/PATCH-GAP-001-HDIFF-REFERENCE-FOUNDATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-gap-hdiff-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-reference-positive:
    name: pinned-5.1.3-both-frozen-lanes-positive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact lab code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source-locked and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/scripts/patch_gap_hdiff_reference.py benchmarks/scripts/test_patch_gap_hdiff_reference.py
          python3 -m unittest benchmarks/scripts/test_patch_gap_hdiff_reference.py -v

      - name: Download upstream frozen Linux64 ZIP and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hdiff-original" "$RUNNER_TEMP/hdiff-tools"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/sisong/HDiffPatch/releases/download/v5.1.3/hdiffpatch_v5.1.3_bin_linux64.zip \
            --output "$RUNNER_TEMP/hdiff-original/hdiffpatch_v5.1.3_bin_linux64.zip"
          echo "628963bf2ee9108a97260fa5eef44acd9ec94369b76090a957c9182b3abbb558  $RUNNER_TEMP/hdiff-original/hdiffpatch_v5.1.3_bin_linux64.zip" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/hdiff-original/hdiffpatch_v5.1.3_bin_linux64.zip" \
            -d "$RUNNER_TEMP/hdiff-tools"
          find "$RUNNER_TEMP/hdiff-tools" -maxdepth 5 -type f -printf '%P\n'
          mapfile -t diff_candidates < <(find "$RUNNER_TEMP/hdiff-tools" -type f -name hdiffz)
          mapfile -t patch_candidates < <(find "$RUNNER_TEMP/hdiff-tools" -type f -name hpatchz)
          test "${#diff_candidates[@]}" -eq 1
          test "${#patch_candidates[@]}" -eq 1
          chmod +x "${diff_candidates[0]}" "${patch_candidates[0]}"
          printf 'HDIFFZ=%s\n' "${diff_candidates[0]}" >> "$GITHUB_ENV"
          printf 'HPATCHZ=%s\n' "${patch_candidates[0]}" >> "$GITHUB_ENV"
          echo 'PINNED_ORIGINAL_ARCHIVE_SHA256=628963bf2ee9108a97260fa5eef44acd9ec94369b76090a957c9182b3abbb558'

      - name: Run real v5.1.3 dual-mode positive differential and SHA oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hdiff-smoke" "$RUNNER_TEMP/hdiff-output"
          python3 benchmarks/scripts/patch_gap_hdiff_reference.py \
            --mode smoke \
            --hdiffz "$HDIFFZ" --hpatchz "$HPATCHZ" \
            --archive "$RUNNER_TEMP/hdiff-original/hdiffpatch_v5.1.3_bin_linux64.zip" \
            --work "$RUNNER_TEMP/hdiff-smoke" \
            --output "$RUNNER_TEMP/hdiff-output/hdiff-smoke.json" \
            --run-id "HDIFF-SMOKE-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 - "$RUNNER_TEMP/hdiff-output/hdiff-smoke.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding='utf-8'))
          assert obj['status']=='REAL_BINARY_SMOKE_ONLY' and obj['rfcSizeGate']=='NOT_APPLICABLE'
          assert set(obj['positiveFixture']['lanes'])=={'memory','stream'}
          assert all(x['exactReconstruction'] for x in obj['positiveFixture']['lanes'].values())
          print('HDIFF_REAL_PINNED_BINARY_POSITIVE_TWO_LANES_PASS')
          print(json.dumps(obj,indent=2,sort_keys=True))
          PY

      - name: Upload real tool/probe evidence (not a corpus result)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-gap-hdiff-pinned-smoke
          path: ${{ runner.temp }}/hdiff-output/
          if-no-files-found: warn
