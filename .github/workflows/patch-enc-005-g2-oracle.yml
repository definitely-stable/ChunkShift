name: PATCH-ENC-005 G2 oracle

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: UTC evidence date in YYYYMMDD form
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: patch-enc-005-g2-oracle-${{ github.sha }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  SAMPLE_PATH: docs/research/results/data/PATCH-ENC-005-G2-SAMPLE-20261003-001/sample.json
  LOCK_PATH: docs/research/results/data/PATCH-ENC-005-G2-SAMPLE-20261003-001/lock.json

jobs:
  oracle:
    name: exact-whole-base-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Validate decision-run provenance
        shell: bash
        env:
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "G2 oracle must run from merged main." >&2
            exit 2
          fi
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "G2 oracle rejects GitHub workflow re-runs; dispatch a new run instead." >&2
            exit 2
          fi
          if [[ ! "$RUN_DATE" =~ ^[0-9]{8}$ ]]; then
            echo "run_date must be YYYYMMDD." >&2
            exit 2
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Validate committed G2 sample lock
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/evaluate_patch_enc_005_g2.py             --sample "$SAMPLE_PATH"             --lock "$LOCK_PATH"             --validate-lock-only

      - name: Materialize frozen development corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_corpus.py             --root "$HOME/patch-corpus"             --sources "$HOME/patch-corpus/sources"             --download --lock

      - name: Build PatchLab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Bind RunId
        shell: bash
        env:
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          printf -v run_number "%03d" "$GITHUB_RUN_NUMBER"
          run_id="PATCH-ENC-005/RUN-${RUN_DATE}-${run_number}-${GITHUB_SHA}-linux-x64"
          echo "PATCH_ENC_005_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "$run_id"

      - name: Run exact sampled whole-base oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/patch-enc-005-g2
          dotnet run             --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj             -c Release --no-build --             patch-lab enc005-g2 oracle             --corpus "$HOME/patch-corpus"             --sample "$SAMPLE_PATH"             --output artifacts/patch-enc-005-g2/oracle.json             --source-commit "$GITHUB_SHA"             --run-id "$PATCH_ENC_005_RUN_ID"

      - name: Evaluate frozen G2 gate
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/evaluate_patch_enc_005_g2.py             --sample "$SAMPLE_PATH"             --lock "$LOCK_PATH"             --oracle artifacts/patch-enc-005-g2/oracle.json             --output-dir artifacts/patch-enc-005-g2

      - name: Record execution and document hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/patch-enc-005-g2")
          execution = {
              "schema": "chunkshift.patch-enc-005-g2-execution.v1",
              "experimentId": "PATCH-ENC-005",
              "runId": os.environ["PATCH_ENC_005_RUN_ID"],
              "githubRunId": int(os.environ["GITHUB_RUN_ID"]),
              "githubRunNumber": int(os.environ["GITHUB_RUN_NUMBER"]),
              "githubRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "sourceCommit": os.environ["GITHUB_SHA"],
              "platform": "linux-x64",
              "runner": "ubuntu-24.04",
              "oracleSampleSha256": "54061f4efe0969af0d772ddbc6d026fdf58bd4f2776514a9fb098753d062001d",
          }
          (root / "execution.json").write_text(
              json.dumps(execution, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          docs = []
          for path in sorted(root.iterdir()):
              if path.name == "documents.json" or not path.is_file():
                  continue
              raw = path.read_bytes()
              docs.append(
                  {
                      "name": path.name,
                      "size": len(raw),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                  }
              )
          manifest = {
              "schema": "chunkshift.patch-enc-005-g2-documents.v1",
              "documents": docs,
          }
          (root / "documents.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload G2 decision evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-enc-005-g2-${{ github.sha }}
          path: artifacts/patch-enc-005-g2/
          if-no-files-found: error
          retention-days: 90
