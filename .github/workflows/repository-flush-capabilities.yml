name: Repository flush capabilities

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-crash-lab/FlushProbe.cs'
      - 'tools/repository-crash-lab/flush_probe.py'
      - 'tools/repository-crash-lab/filesystem_provenance.py'
      - 'tools/repository-crash-lab/test_filesystem_provenance.py'
      - '.github/workflows/repository-flush-capabilities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Test handle-bound filesystem attribution
        run: python -B -m unittest discover -s tools/repository-crash-lab -p test_filesystem_provenance.py -v
      - name: Observe bounded persistence APIs and native negative controls
        shell: pwsh
        run: |
          python -B tools/repository-crash-lab/flush_probe.py --output "$env:RUNNER_TEMP/repository-flush"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $s = Get-Content "$env:RUNNER_TEMP/repository-flush/evidence/summary.json" -Raw | ConvertFrom-Json
          if ($s.decision -ne "CAPABILITY_ONLY" -or $s.production_default -ne "DEFER" -or $s.crash_ordering -ne "UNQUALIFIED" -or -not $s.fixture_empty) { throw "Unexpected capability verdict" }
          $expectedArch = if ("${{ matrix.os }}" -eq "ubuntu-24.04-arm") { "Arm64" } else { "X64" }
          if ($s.managed.arch -ne $expectedArch) { throw "Incorrect process architecture" }
          if ($s.provenance_status -ne "HANDLE_BOUND" -or $s.managed_attribution -ne "TRUSTED_FIXTURE_REOPEN_ONLY") { throw "Incomplete filesystem provenance" }
          $expectedMethod = if ("${{ matrix.os }}" -eq "windows-2025") { "windows-handle-volume" } else { "linux-fdinfo-mountinfo" }
          $attributed = @($s.observations | Where-Object { $_.provenance })
          if ($attributed.Count -ne 4 -or @($attributed | Where-Object { $_.provenance.method -ne $expectedMethod }).Count -ne 0) { throw "Incorrect handle provenance" }
      - name: Preserve original capability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repository-flush-capabilities-${{ matrix.os }}
          path: ${{ runner.temp }}/repository-flush/evidence/
          if-no-files-found: warn
          retention-days: 90
