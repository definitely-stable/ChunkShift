name: PATCH-GAP-001 HDiffPatch original calibration

# Only a permitted issue comment on #183 can start the full original corpus.
# PRs only run fixture/contract tests, not an expensive real-corpus experiment.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-gap-001-hdiff-calibration.yml"
      - "benchmarks/scripts/verify_patch_gap_hdiff_calibration.py"
      - "benchmarks/scripts/test_verify_patch_gap_hdiff_calibration.py"
      - "docs/benchmarks/PATCH-GAP-001-HDIFF-CALIBRATION-RUNBOOK.md"
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: patch-gap-001-hdiff-original-calibration
  cancel-in-progress: false

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fail-closed calibration contracts
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/scripts/patch_gap_hdiff_reference.py benchmarks/scripts/verify_patch_gap_hdiff_calibration.py benchmarks/scripts/test_verify_patch_gap_hdiff_calibration.py
          python3 -m unittest benchmarks/scripts/test_patch_gap_hdiff_reference.py benchmarks/scripts/test_verify_patch_gap_hdiff_calibration.py -v
          echo 'Fixture-only tests: no original corpus measured.' >> "$GITHUB_STEP_SUMMARY"

  calibration:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 183 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.id == 271974079 &&
      startsWith(github.event.comment.body, '/hdiff-calibration ')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATOR_COMMAND: ${{ github.event.comment.body }}
      PAIRS_SHA: 8b3b92a9d0fba4bee80602aeafbdd443e5c612ff94889621537b8fb910fd22dd
      HDIFF_ARCHIVE_SHA: 628963bf2ee9108a97260fa5eef44acd9ec94369b76090a957c9182b3abbb558
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Authorize exact comment, current main and one-shot calibration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          python3 - <<'PY'
          import datetime, json, os, re, subprocess
          cmd=os.environ["OPERATOR_COMMAND"]
          match=re.fullmatch(r"/hdiff-calibration (20[0-9]{6})", cmd)
          if not match:
              raise SystemExit("Only /hdiff-calibration YYYYMMDD accepted")
          date=match.group(1)
          datetime.datetime.strptime(date,"%Y%m%d")
          repo=os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return json.loads(subprocess.check_output(["gh","api","repos/"+repo+"/"+path],text=True))
          if api("branches/main")["commit"]["sha"]!=os.environ["GITHUB_SHA"]:
              raise SystemExit("main advanced; stale issue comment")
          doc=api("actions/workflows/patch-gap-001-hdiff-calibration.yml/runs?event=issue_comment&per_page=100")
          if doc.get("total_count",0)>100:
              raise SystemExit("Run history exceeds audited 100-run bound")
          for run in doc.get("workflow_runs",[]):
              if str(run["id"])==os.environ["GITHUB_RUN_ID"]:
                  continue
              if run.get("conclusion")=="success" or run.get("status")!="completed":
                  raise SystemExit("HDiffPatch calibration already succeeded or is active: "+str(run["id"]))
              # A prior run may have measured, audited and uploaded valid evidence
              # before an unrelated reporting/post-upload step failed. Never
              # repeat those scientific measurements merely to turn CI green.
              artifact_doc=api("actions/runs/"+str(run["id"])+"/artifacts?per_page=100")
              if artifact_doc.get("total_count",0)>100:
                  raise SystemExit("Artifact history exceeds audited bound")
              if any(a.get("name","").startswith("patch-gap-hdiff-original-calibration-")
                     and not a.get("expired",False) and a.get("size_in_bytes",0)>0
                     for a in artifact_doc.get("artifacts",[])):
                  raise SystemExit("Archived HDiff calibration exists despite run failure: "+str(run["id"]))
          if api("branches/main")["commit"]["sha"]!=os.environ["GITHUB_SHA"]:
              raise SystemExit("main advanced during authorization")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as output:
              output.write("RUN_ID=PATCH-GAP-001/RUN-"+date+"-"+os.environ["GITHUB_RUN_NUMBER"]+"-"+os.environ["GITHUB_SHA"][:7]+"-linux-x64-hdiff-calibration\n")
              output.write("CORPUS_ROOT="+os.environ["HOME"]+"/patch-corpus\n")
              output.write("OUT="+os.environ["RUNNER_TEMP"]+"/patch-gap-hdiff-calibration\n")
              output.write("HDIFF_WORK="+os.environ["RUNNER_TEMP"]+"/patch-gap-hdiff-work\n")
          PY

      - name: Validate original harness and report-audit negative contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/scripts/patch_gap_hdiff_reference.py benchmarks/scripts/verify_patch_gap_hdiff_calibration.py
          python3 -m unittest benchmarks/scripts/test_patch_gap_hdiff_reference.py benchmarks/scripts/test_verify_patch_gap_hdiff_calibration.py -v

      - name: Source-lock original HDiffPatch v5.1.3 binary tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/origin" "$OUT/bin" "$HDIFF_WORK"
          curl --fail --location --silent --show-error --retry 3             https://github.com/sisong/HDiffPatch/releases/download/v5.1.3/hdiffpatch_v5.1.3_bin_linux64.zip             --output "$OUT/origin/hdiffpatch_v5.1.3_bin_linux64.zip"
          echo "$HDIFF_ARCHIVE_SHA  $OUT/origin/hdiffpatch_v5.1.3_bin_linux64.zip" | sha256sum --check
          unzip -q "$OUT/origin/hdiffpatch_v5.1.3_bin_linux64.zip" -d "$OUT/bin"
          mapfile -t diffs < <(find "$OUT/bin" -type f -name hdiffz)
          mapfile -t patchers < <(find "$OUT/bin" -type f -name hpatchz)
          test "${#diffs[@]}" -eq 1
          test "${#patchers[@]}" -eq 1
          chmod +x "${diffs[0]}" "${patchers[0]}"
          echo "HDIFFZ=${diffs[0]}" >> "$GITHUB_ENV"
          echo "HPATCHZ=${patchers[0]}" >> "$GITHUB_ENV"

      - name: Restore frozen corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize complete original corpus with pre/post locks
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_corpus.py             --root "$CORPUS_ROOT" --sources "$HOME/patch-corpus/sources" --download --lock
          echo "$PAIRS_SHA  $CORPUS_ROOT/pairs.json" | sha256sum --check
          python3 - "$CORPUS_ROOT" <<'PY'
          import shutil,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          free=shutil.disk_usage(root).free
          if free<2*1024**3:
              raise SystemExit("HDiff calibration requires >=2 GiB free after materialization")
          print("HDIFF_CALIBRATION_FREE_BYTES",free)
          PY

      - name: Measure and reconstruct all 1049 original calibration files in both frozen lanes
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/patch_gap_hdiff_reference.py             --mode measure --role calibration --corpus "$CORPUS_ROOT"             --hdiffz "$HDIFFZ" --hpatchz "$HPATCHZ"             --archive "$OUT/origin/hdiffpatch_v5.1.3_bin_linux64.zip"             --work "$HDIFF_WORK" --output "$OUT/calibration-reference.json"             --run-id "$RUN_ID"
          echo "$PAIRS_SHA  $CORPUS_ROOT/pairs.json" | sha256sum --check

      - name: Independently recompute original calibration report identity and physical totals
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/verify_patch_gap_hdiff_calibration.py             --report "$OUT/calibration-reference.json" --pairs "$CORPUS_ROOT/pairs.json"             --output "$OUT/calibration-report-audit.json"             | tee "$OUT/calibration-report-audit.txt"
          python3 - "$OUT/calibration-report-audit.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["files"]==1049 and x["readyToCloseIssue183"] is False
          assert x["rfcSizeGate"]=="NOT_APPLICABLE"
          print("HDIFF_ORIGINAL_CALIBRATION_REPORT_AUDIT_PASS; evaluation not run.")
          PY
          cat "$OUT/calibration-report-audit.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source-pinned original calibration report (not final scientific verdict)
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-gap-hdiff-original-calibration-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/patch-gap-hdiff-calibration/calibration-reference.json
            ${{ runner.temp }}/patch-gap-hdiff-calibration/calibration-report-audit.json
            ${{ runner.temp }}/patch-gap-hdiff-calibration/calibration-report-audit.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Record provenance; do not imply evaluation or adoption
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          # actions/upload-artifact may expose a bare hex digest while the
          # REST artifact metadata exposes the same value as sha256:<hex>.
          [[ "$ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          ARTIFACT_DIGEST="sha256:${ARTIFACT_DIGEST#sha256:}"
          {
            echo "Calibration RunId: $RUN_ID"
            echo "Original source SHA: $GITHUB_SHA"
            echo "Artifact ID: $ARTIFACT_ID"
            echo "Artifact SHA-256: $ARTIFACT_DIGEST"
            echo 'Whole-file HDiffPatch reference only; fixed evaluation NOT executed.'
          } >> "$GITHUB_STEP_SUMMARY"
