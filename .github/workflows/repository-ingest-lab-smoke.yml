name: Repository ingest lab smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-ingest-lab/**'
      - '.github/workflows/repository-ingest-lab-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ingest-lab-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Driver validation tests
        run: python -B -m unittest discover -s tools/repository-ingest-lab -p "test_*.py"
      - name: Run 28 correctness smoke samples (not performance evidence)
        shell: pwsh
        run: |
          $commit = (git rev-parse --short=12 HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $lane = "${{ matrix.os }}"
          $sequence = "${{ github.run_id }}${{ github.run_attempt }}"
          $runId = "REPO-INGEST-001/RUN-$date-$sequence-$commit-$lane"
          python -B tools/repository-ingest-lab/run.py --output "$env:RUNNER_TEMP/ingest-smoke" --run-id $runId --mib 8 --target-mib 1 --rounds 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload smoke raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-ingest-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/ingest-smoke/
          if-no-files-found: warn
          retention-days: 14
