name: Repository ingest lab smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-ingest-lab/**'
      - '.github/workflows/repository-ingest-lab-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ingest-lab-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Driver validation tests
        run: python -B -m unittest discover -s tools/repository-ingest-lab -p "test_*.py"
      - name: Run 28 correctness smoke samples (not performance evidence)
        shell: pwsh
        run: |
          $commit = (git rev-parse --short=12 HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $lane = "${{ matrix.os }}".Replace(".", "-")
          $sequence = "${{ github.run_id }}${{ github.run_attempt }}"
          $runId = "REPO-INGEST-001/RUN-$date-$sequence-$commit-$lane"
          python -B tools/repository-ingest-lab/run.py --output "$env:RUNNER_TEMP/ingest-smoke" --run-id $runId --mib 8 --target-mib 1 --rounds 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(Get-Content "$env:RUNNER_TEMP/ingest-smoke/samples.jsonl" | ForEach-Object { $_ | ConvertFrom-Json })
          if ($rows.Count -ne 28 -or @($rows | Where-Object { $_.outcome -ne "pass" }).Count -ne 0) { throw "Smoke sample count/verdict mismatch" }
          "### Repository ingest smoke: 28/28 PASS (not performance evidence)" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload smoke raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-ingest-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/ingest-smoke/
          if-no-files-found: warn
          retention-days: 14
