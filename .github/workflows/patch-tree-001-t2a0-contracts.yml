name: PATCH-TREE-001 T2A0 whole-tree CSP v1 contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeT2A0.cs'
      - 'benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeT2A0Tests.cs'
      - 'docs/benchmarks/PATCH-TREE-001-T2A0-WHOLE-TREE-MECHANICS-PROTOCOL.md'
      - '.github/workflows/patch-tree-001-t2a0-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole-tree-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify whole-tree exact SDK CSP and complete physical T0 denominator
        shell: bash
        run: |
          set -euo pipefail
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj \
            -c Release --filter FullyQualifiedName~PatchTreeT2A0
          echo 'T2A0 SYNTHETIC MECHANICS ONLY / NO ORIGINAL VERDICT / NO_PRODUCTION_ADOPT' >> "$GITHUB_STEP_SUMMARY"
