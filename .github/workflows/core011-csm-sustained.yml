name: CORE011 CSM sustained metadata controls

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core011-csm-sustained.yml"
      - "benchmarks/scripts/core011_csm_sustained.py"
      - "benchmarks/scripts/test_core011_csm_sustained.py"
      - "docs/benchmarks/CORE011-CSM-001-SUSTAINED-PROTOCOL.md"
      - "benchmarks/ChunkShift.Benchmarks/CsmMultiblockMetadataHarness.cs"
      - "benchmarks/ChunkShift.Benchmarks/Core011CsmBaselineBenchmarks.cs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core011-csm-sustained-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sustained:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    name: frozen G1-E 12-cell public metadata reader controls
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and evaluator contract tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
          python3 -m unittest benchmarks/scripts/test_core011_csm_sustained.py
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj \
            -c Release --no-build --no-restore \
            --filter FullyQualifiedName~CsmMultiblockMetadataHarnessTests
      - name: Frozen process-isolated sustained controls
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/core011_csm_sustained.py \
            --output-dir "$RUNNER_TEMP/core011-csm-sustained" \
            --run-id "CORE011-CSM-001/G1E-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:8}-linux-x64"
          python3 - "$RUNNER_TEMP/core011-csm-sustained/summary.json" <<'PY'
          import json
          import os
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          assert data["caseCount"] == 12 and data["sampleCount"] == 60
          assert data["verdict"] == "NO_VERDICT_EXPLORATORY"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              print("## CORE011-CSM-001 G1-E sustained controls", file=out)
              print("RunId: " + data["runId"], file=out)
              print("**NO_VERDICT:** per-batch wall is not single-call latency.", file=out)
              print("| MiB | Operation | Workers | KiB alloc/call | Batch p50 ms | Ops/s | Gen2 |", file=out)
              print("|---:|---|---:|---:|---:|---:|---:|", file=out)
              for c in data["lanes"]:
                  print(f"| {c['sizeMiB']} | {c['operation']} | {c['workers']} | "
                        f"{c['allocPerOperationMedianBytes']/1024:.2f} | "
                        f"{c['batchWallMedianMs']:.3f} | "
                        f"{c['completedOperationsPerSecondMedian']:.1f} | "
                        f"{c['gen2Total']} |", file=out)
          PY
      - name: Archive original 12 JSON scenarios and independent evaluator
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core011-csm-sustained-${{ github.run_id }}
          path: ${{ runner.temp }}/core011-csm-sustained/
          retention-days: 90
          if-no-files-found: warn
