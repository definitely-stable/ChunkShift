name: PATCH-TREE-001 T4-B publication fault-state model

# PR-only logical model. No filesystem mutation, no source corpus or sealed input.
on:
  pull_request:
    paths:
      - "benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreePublicationModel.cs"
      - "benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreePublicationModelTests.cs"
      - "docs/benchmarks/PATCH-TREE-001-T4B-PUBLICATION-FAULT-MODEL.md"
      - ".github/workflows/patch-tree-001-t4b-state-faults.yml"

permissions:
  contents: read

jobs:
  fault-model:
    name: T4-B pure-state failpoint matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
      - name: Build Release
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Exercise crash boundaries, old/new pins and policy rejection
        run: dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~PatchTreePublicationModelTests
      - name: Record scope
        shell: bash
        run: |
          echo "Pure model only: OS pointer atomicity, real filesystem durability and trust signatures remain UNVERIFIED." >> "$GITHUB_STEP_SUMMARY"
