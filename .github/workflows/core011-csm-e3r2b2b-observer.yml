name: CORE011 CSM E3-R2B2B external observer calibration

on:
  pull_request:
    branches:
      - research/core011-csm-004-e3r2b2a-peak-evidence
      - main
    paths:
      - ".github/workflows/core011-csm-e3r2b2b-observer.yml"
      - "docs/benchmarks/CORE011-CSM-004-E3-R2B2B-OBSERVER.md"
      - "benchmarks/ChunkShift.Benchmarks/CsmE3R2bResidencyHarness.cs"
      - "benchmarks/ChunkShift.Benchmarks/CsmE3R2b2bExternalObserverHarness.cs"
      - "benchmarks/ChunkShift.Benchmarks/Program.cs"
      - "benchmarks/experiments/core011-csm-e3r2b2b-observer.v1.json"
      - "benchmarks/scripts/core011_csm_e3r2b2b.py"
      - "benchmarks/scripts/test_core011_csm_e3r2b2b.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-observer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-24.04
            platform: linux
            python: python3
            replica: 0
          - image: ubuntu-24.04
            platform: linux
            python: python3
            replica: 1
          - image: windows-2025
            platform: windows
            python: python
            replica: 0
          - image: windows-2025
            platform: windows
            python: python
            replica: 1
    name: B2B ${{ matrix.platform }} independent replica ${{ matrix.replica }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 28
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout experimental PR tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Enforce study-only changes; product reader unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/research/core011-csm-004-e3r2b2a-peak-evidence...HEAD > "$RUNNER_TEMP/e3r2b2b-scope.txt"
          cat "$RUNNER_TEMP/e3r2b2b-scope.txt"
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/core011-csm-e3r2b2b-observer.yml|docs/benchmarks/CORE011-CSM-004-E3-R2B2B-OBSERVER.md|benchmarks/ChunkShift.Benchmarks/CsmE3R2bResidencyHarness.cs|benchmarks/ChunkShift.Benchmarks/CsmE3R2b2bExternalObserverHarness.cs|benchmarks/ChunkShift.Benchmarks/Program.cs|benchmarks/experiments/core011-csm-e3r2b2b-observer.v1.json|benchmarks/scripts/core011_csm_e3r2b2b.py|benchmarks/scripts/test_core011_csm_e3r2b2b.py) ;;
              *) echo "R2B2B unrelated/production source changed: $f" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/e3r2b2b-scope.txt"
          test -z "$(git diff --name-only origin/research/core011-csm-004-e3r2b2a-peak-evidence...HEAD -- src/ tests/ Directory.Packages.props)"
      - name: Fail-closed original preregistration and negative tests
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python }} -m py_compile benchmarks/scripts/core011_csm_e3r2b2b.py benchmarks/scripts/test_core011_csm_e3r2b2b.py
          ${{ matrix.python }} -m unittest -v benchmarks/scripts/test_core011_csm_e3r2b2b.py
          ${{ matrix.python }} benchmarks/scripts/core011_csm_e3_guard.py
          if ${{ matrix.python }} benchmarks/scripts/core011_csm_e3_guard.py --decision-ready; then
            echo "ERROR: E3-R0 decision readiness unexpectedly granted" >&2
            exit 1
          fi
      - name: Compare target internal sampling OFF and ON via external OS observer
        shell: bash
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=8 HEAD)
          rid="CORE011-CSM-004/RUN-$(date -u +%Y%m%d)-$GITHUB_RUN_ID-$short-${{ matrix.platform }}-r${{ matrix.replica }}-x64"
          ${{ matrix.python }} benchmarks/scripts/core011_csm_e3r2b2b.py \
            --run-id "$rid" --platform ${{ matrix.platform }} --replica ${{ matrix.replica }} \
            --output-dir "$RUNNER_TEMP/e3r2b2b"
          ${{ matrix.python }} - "$RUNNER_TEMP/e3r2b2b/summary.json" <<'PY'
          import json,os,sys
          with open(sys.argv[1],encoding="utf-8") as f: j=json.load(f)
          assert j["decisionRunsAllowed"] is False and j["productVerdict"]=="NOT_QUALIFIED"
          assert j["consumerCount"]==4 and j["observerCount"]==4 and len(j["cells"])==4
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            print("## E3-R2B2B external OS observer, eager-only",file=f)
            print("RunId: "+j["runId"],file=f)
            print("| Internal sampler | Held readers | External native sampled max (MiB) | External samples |",file=f)
            print("|---|---:|---:|---:|",file=f)
            for cell in j["cells"]:
              mode,held=cell["case"].split("-")
              print("| "+mode+" | "+held+" | "+
                str(round(cell["externalSampledPrivateResidentPeakBytes"]/1048576,3))+
                " | "+str(cell["externalNativeSampleCount"])+" |",file=f)
            print("External sampling is not zero-cost; no candidate, threshold or product verdict.",file=f)
          PY
      - name: Preserve original complete observer/target JSON traces and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core011-e3r2b2b-${{ matrix.platform }}-r${{ matrix.replica }}
          path: ${{ runner.temp }}/e3r2b2b/
          if-no-files-found: warn
          retention-days: 90
