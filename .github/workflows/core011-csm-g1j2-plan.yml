name: CORE011 CSM G1-J2 isolated Plan pair smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core011-csm-g1j2-plan.yml"
      - "benchmarks/ChunkShift.Benchmarks/CsmG1j2PlanHarness.cs"
      - "benchmarks/ChunkShift.Benchmarks/Program.cs"
      - "benchmarks/scripts/core011_csm_g1j2_plan.py"
      - "benchmarks/scripts/test_core011_csm_g1j2_plan.py"
      - "docs/benchmarks/CORE011-CSM-001-G1J2-PLAN-PILOT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core011-g1j2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-plan-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Checkout complete Git history for pinned real version source files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pinned .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate J2 versioned provenance and decision lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            benchmarks/scripts/test_core011_csm_g1j_contract.py \
            benchmarks/scripts/test_core011_csm_g1j1_isolation.py \
            benchmarks/scripts/test_core011_csm_g1j2_plan.py
          python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json
          if python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json \
            --decision-ready; then
            echo "G1-J2 must reject every decision run before freeze" >&2
            exit 1
          fi
      - name: Run real Git history pair builder plus five fresh Plan consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/core011_csm_g1j2_plan.py \
            --output-dir "$RUNNER_TEMP/core011-g1j2-pair" \
            --worktree-root "$RUNNER_TEMP/core011-g1j2-worktrees" \
            --run-id "CORE011-CSM-001/G1J2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:8}-linux-x64"
          python3 - "$RUNNER_TEMP/core011-g1j2-pair/summary.json" <<'PY'
          import json,sys
          from pathlib import Path
          summary=json.loads(Path(sys.argv[1]).read_text())
          assert summary["caseCount"] == 5 and summary["roundCount"] == 10
          assert summary["verdict"] == "NO_VERDICT_EXPLORATORY"
          print("G1-J2 versioned provenance and isolated Plan smoke PASS; NO ADOPT")
          PY
      - name: Archive J2 non-decision provenance, CSMs and raw samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core011-csm-g1j2-${{ github.run_id }}
          path: ${{ runner.temp }}/core011-g1j2-pair/
          retention-days: 90
          if-no-files-found: warn
