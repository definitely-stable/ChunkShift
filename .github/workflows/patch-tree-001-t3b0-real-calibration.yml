name: PATCH-TREE-001 T3B0 original exact-only calibration

# Run only after reviewed B0 source reaches main. No holdout trees and no
# measurements from unreviewed PR code; do not make release/adoption claims.
on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/scripts/patch_tree_001_t3b0_census.py'
      - '.github/workflows/patch-tree-001-t3b0-real-calibration.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: patch-tree-001-t3b0-original
  cancel-in-progress: false

jobs:
  real-exact-calibration:
    name: Pinned .NET calibration only (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    steps:
      - name: Fail closed outside GitHub-hosted first main push
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'Linux'
          test "$RUNNER_ARCH" = 'X64'
          test "$GITHUB_REPOSITORY" = 'definitely-stable/ChunkShift'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_RUN_ATTEMPT" = '1'

      - name: Checkout the immutable original research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Cache checked original source releases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-tree-001-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }

      - name: Verify original completed main-run metadata provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38136336025" > "$RUNNER_TEMP/original-run.json"
          python3 - "$RUNNER_TEMP/original-run.json" <<'PY'
          import json, os, sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          if not (x.get('id') == 38136336025 and
                  x.get('event') == 'workflow_dispatch' and
                  x.get('head_branch') == 'main' and
                  x.get('run_attempt') == 1 and
                  x.get('status') == 'completed' and
                  x.get('conclusion') == 'success' and
                  x.get('repository',{}).get('full_name') == os.environ['GITHUB_REPOSITORY'] and
                  x.get('path','').split('@')[0] == '.github/workflows/patch-tree-001-pairs-reference.yml'):
              raise SystemExit('Untrusted original reference provenance')
          PY
          mkdir -p "$RUNNER_TEMP/original-pairs"
          gh run download 38136336025 -R "$GITHUB_REPOSITORY" \
            -n patch-tree-001-original-pairs -D "$RUNNER_TEMP/original-pairs"
          (
            cd "$RUNNER_TEMP/original-pairs"
            sha256sum --check SHA256SUMS
            echo "8b3b92a9d0fba4bee80602aeafbdd443e5c612ff94889621537b8fb910fd22dd  pairs.json" | sha256sum --check
          )

      - name: Materialize ONLY four original .NET calibration transitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t3b0-results"
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$RUNNER_TEMP/t3b0-corpus" --sources "$HOME/patch-corpus/sources" \
            --download --lock --calibration-only \
            --pairs-reference "$RUNNER_TEMP/original-pairs/pairs.json"
          python3 benchmarks/scripts/patch_tree_001_inventory.py \
            --root "$RUNNER_TEMP/t3b0-corpus" \
            --output "$RUNNER_TEMP/t3b0-results/layouts.json" --calibration-only
          cp "$RUNNER_TEMP/original-pairs/pairs.json" "$RUNNER_TEMP/t3b0-results/original-pairs.json"

      - name: Exact candidate census and rehash-based source verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s benchmarks/scripts -p 'test_patch_tree_001_t3b0_census.py' -v
          python3 benchmarks/scripts/patch_tree_001_t3b0_census.py \
            --root "$RUNNER_TEMP/t3b0-corpus" \
            --inventory "$RUNNER_TEMP/t3b0-results/layouts.json" \
            --output "$RUNNER_TEMP/t3b0-results/t3b0-census.json"
          python3 - "$RUNNER_TEMP/t3b0-results" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          d=pathlib.Path(sys.argv[1])
          result=json.loads((d/'t3b0-census.json').read_text(encoding='utf-8'))
          assert result['schema'] == 'chunkshift.patch-tree-t3b0-exact-calibration.v1'
          assert result['status'] == 'CALIBRATION_EXACT_CENSUS_MODEL_ONLY_NO_ADOPT'
          assert len(result['pairs']) == 4
          provenance={
            'schema':'chunkshift.patch-tree-t3b0-provenance.v1',
            'sourceSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'workflowRunId':os.environ['GITHUB_RUN_ID'],
            'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'gitRef':os.environ['GITHUB_REF'],
            'runnerEnvironment':os.environ['RUNNER_ENVIRONMENT'],
            'runnerOS':os.environ['RUNNER_OS'],
            'runnerArch':os.environ['RUNNER_ARCH'],
            'pythonVersion':sys.version,
            'originalPairsReferenceRunId':38136336025,
            'originalT0RunId':38142160679,
            'originalF1RunId':38773779715,
            'sealedHoldoutOpened':False,
          }
          assert provenance['sourceSha']==os.environ['GITHUB_SHA']
          (d/'provenance.json').write_text(json.dumps(provenance,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          with (d/'SHA256SUMS').open('w',encoding='ascii') as checks:
            for name in ('original-pairs.json','layouts.json','t3b0-census.json','provenance.json'):
              checks.write(hashlib.sha256((d/name).read_bytes()).hexdigest()+'  '+name+'\n')
          print('T3B0 source-locked REAL CALIBRATION census, NOT product verdict:')
          print(json.dumps(result['totals'],indent=2,sort_keys=True))
          print('original T0 warm bytes:',result['baselineT0WarmPhysicalBytes'])
          print('modelled T3 warm bytes:',result['modelledT3WarmCostBytes'])
          PY
          ( cd "$RUNNER_TEMP/t3b0-results" && sha256sum --check SHA256SUMS )
          echo 'T3B0 original .NET calibration only; no holdout, no new CSP, NO_ADOPT' >> "$GITHUB_STEP_SUMMARY"

      - name: Mark failed artifacts UNVERIFIED
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t3b0-results"
          printf 'UNVERIFIED_NOT_DECISION\nRun=%s\nSHA=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/t3b0-results/UNVERIFIED-NOT-DECISION.txt"

      - name: Archive failed diagnostics, not evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-tree-t3b0-UNVERIFIED-diagnostics
          path: ${{ runner.temp }/t3b0-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Archive locked calibration results
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-tree-t3b0-original-calibration-NO-ADOPT
          path: ${{ runner.temp }/t3b0-results/
          if-no-files-found: error
          retention-days: 90
