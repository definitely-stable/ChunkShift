name: PATCH-TREE-001 T3B1 physical CSP contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeT3B1.cs'
      - 'benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeT3B1Tests.cs'
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/PatchLabRunner.cs'
      - 'benchmarks/scripts/patch_tree_001_t3b1_select.py'
      - '.github/workflows/patch-tree-001-t3b1-contracts.yml'
      - '.github/workflows/patch-tree-001-t3b1-real-calibration.yml'
      - 'docs/benchmarks/PATCH-TREE-001-T3B1-RENAMED-CSP-PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-csp:
    name: Physical CSP create/apply (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Compile real patching SDK and run B1 xUnit fixtures (no corpus)
        shell: bash
        run: |
          set -euo pipefail
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj -c Release --filter FullyQualifiedName~PatchTreeT3B1
          echo 'B1 synthetic physical CSP contracts only; NO real original verdict' >> "$GITHUB_STEP_SUMMARY"
