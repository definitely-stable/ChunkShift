name: PATCH-TREE-001 T3B2B independent original create CPU budget replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/research/results/PATCH-TREE-001-T3B2B-ORIGINAL-REPEAT-CREATE-EVIDENCE-20261024-001.md'
      - 'docs/research/results/data/PATCH-TREE-001-T3B2B-EVIDENCE-20261024-001/recompute.py'
      - '.github/workflows/patch-tree-001-t3b2b-original-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-original:
    name: Original ZIP SHA and independent five-round median/admission audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Fetch immutable original ZIP, verify its SHA and replay independently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12553937250/zip" \
            -o "$RUNNER_TEMP/original-t3b2b.zip"
          echo "9b0562b888952958b1e90ab1d2808f2c12e40d722628095b0127a54870375568  $RUNNER_TEMP/original-t3b2b.zip" | sha256sum --check
          python3 docs/research/results/data/PATCH-TREE-001-T3B2B-EVIDENCE-20261024-001/recompute.py \
            "$RUNNER_TEMP/original-t3b2b.zip"
          echo 'T3B2B ORIGINAL SOURCE-LOCKED 5-ROUND REPLAY PASS / CREATE_BUDGET_REJECT / NO_PRODUCTION_ADOPT' >> "$GITHUB_STEP_SUMMARY"
