name: CLI140-A2 parser comparison

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ChunkShift.Cli/**"
      - "tests/ChunkShift.Cli.Tests/**"
      - "tools/cli-parser-a2/**"
      - ".github/workflows/cli-parser-a2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore isolated prototype
        run: dotnet restore tools/cli-parser-a2/CliParserA2.csproj
      - name: Build isolated prototype
        run: dotnet build tools/cli-parser-a2/CliParserA2.csproj -c Release --no-restore
      - name: Exercise syntax and collect parsing evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cli-parser-a2
          probe=tools/cli-parser-a2/bin/Release/net10.0/CliParserA2.dll
          dotnet "$probe" --probe | tee artifacts/cli-parser-a2/parse.txt
          dotnet "$probe" manifest create input.bin -o out.csm | grep -q '^parsed=manifest.create$'
          dotnet "$probe" patch plan --base-manifest a.csm --target-manifest b.csm | grep -q '^parsed=patch.plan$'
          dotnet "$probe" --help > artifacts/cli-parser-a2/help.txt
          grep -q 'manifest' artifacts/cli-parser-a2/help.txt
      - name: NativeAOT + trimming probe (Linux x64)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tools/cli-parser-a2/CliParserA2.csproj -c Release \
            -r linux-x64 --self-contained true -p:PublishAot=true \
            -p:PublishTrimmed=true -o artifacts/cli-parser-a2/aot
          artifacts/cli-parser-a2/aot/CliParserA2 manifest create input.bin -o out.csm \
            | grep -q '^parsed=manifest.create$'
          artifacts/cli-parser-a2/aot/CliParserA2 --probe \
            | tee artifacts/cli-parser-a2/aot-parse.txt
      - name: Archive source-bound prototype outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli140-a2-parser-probe
          path: |
            artifacts/cli-parser-a2/parse.txt
            artifacts/cli-parser-a2/aot-parse.txt
            artifacts/cli-parser-a2/help.txt
          retention-days: 30
