name: Repository holdout evaluator qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-ingest-lab/holdout_run.py'
      - 'tools/repository-ingest-lab/holdout_evaluate.py'
      - 'tools/repository-ingest-lab/test_holdout_evaluate.py'
      - 'tools/repository-ingest-lab/holdout-qualification-lock.json'
      - '.github/workflows/repository-holdout-evaluator-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Qualify schedule and decision on synthetic records only
        run: python -B -m unittest discover -s tools/repository-ingest-lab -p "test_*.py"
      - name: Check driver and evaluator CLI (no execution)
        shell: pwsh
        run: |
          python -B tools/repository-ingest-lab/holdout_run.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/repository-ingest-lab/holdout_evaluate.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
