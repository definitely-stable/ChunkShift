name: PATCH-TREE-001 F2 preflight contracts

# Synthetic-only correctness checks; no original F1 artifacts downloaded in PR CI.
on:
  pull_request:
    paths:
      - "benchmarks/scripts/patch_tree_001_f2_preflight.py"
      - "benchmarks/scripts/test_patch_tree_001_f2_preflight.py"
      - "docs/benchmarks/PATCH-TREE-001-F2-PREFLIGHT.md"
      - ".github/workflows/patch-tree-001-f2-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f2-preflight-unit:
    name: F2 candidate-contract synthetic test (no physical evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run synthetic-only preflight contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/scripts/patch_tree_001_f2_preflight.py benchmarks/scripts/test_patch_tree_001_f2_preflight.py
          python -m unittest benchmarks/scripts/test_patch_tree_001_f2_preflight.py -v
          echo "Only synthetic F2-P0 contracts passed; no physical CSP evidence." >> "$GITHUB_STEP_SUMMARY"
