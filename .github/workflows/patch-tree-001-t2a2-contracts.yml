name: PATCH-TREE-001 T2A2 real whole-tree CSP contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeT2A2.cs'
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/PatchLabRunner.cs'
      - 'benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeT2A2Tests.cs'
      - '.github/workflows/patch-tree-001-t2a2-*.yml'
      - 'docs/benchmarks/PATCH-TREE-001-T2A2-ORIGINAL-ADMISSION-PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: T2-A2 bounded whole-tree CSP v1 contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Exact CSP v1 whole-tree Apply, source lock and negative tests (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj \
            -c Release --filter FullyQualifiedName~PatchTreeT2A2
          echo 'T2A2 synthetic SDK integrity contracts only; original first main run required, no production adoption' >> "$GITHUB_STEP_SUMMARY"
