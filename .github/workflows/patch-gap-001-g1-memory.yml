name: PATCH-GAP-001 G1 apply memory

on:
  workflow_dispatch:
    inputs:
      run-date:
        description: "Frozen RunId UTC date (YYYYMMDD)"
        required: true
        type: string
      calibration-run-id:
        description: "GitHub Actions run id that produced the G1 calibration artifact"
        required: true
        type: string
      calibration-artifact-name:
        description: "Exact G1 calibration artifact name"
        required: true
        type: string
      lane:
        description: "Calibration lane that already crossed the frozen 15% size gate"
        required: true
        type: choice
        options:
          - G1-B1-R64
          - G1-B4-R256
          - G1-B8-R512
          - G1-B32-R2048

permissions:
  actions: read
  contents: read

concurrency:
  group: patch-gap-001-g1-memory
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  PROTOCOL_COMMIT: 5372678ae8451a71cc95eb24f30855cbbd7e0633
  PAIRS_SHA256: 8b3b92a9d0fba4bee80602aeafbdd443e5c612ff94889621537b8fb910fd22dd

jobs:
  memory:
    name: g1-memory-${{ inputs.lane }}-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    steps:
      - name: Validate decision identity
        shell: bash
        env:
          RUN_DATE: ${{ inputs.run-date }}
          CALIBRATION_RUN_ID: ${{ inputs.calibration-run-id }}
          CALIBRATION_ARTIFACT_NAME: ${{ inputs.calibration-artifact-name }}
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "PATCH-GAP-001 G1 memory evidence rejects workflow re-runs." >&2
            exit 2
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "PATCH-GAP-001 G1 memory must run from main." >&2
            exit 2
          fi
          if [[ ! "$CALIBRATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "calibration-run-id must be a positive integer." >&2
            exit 2
          fi
          if [[ -z "$CALIBRATION_ARTIFACT_NAME" ]]; then
            echo "calibration-artifact-name is required." >&2
            exit 2
          fi
          case "$LANE" in
            G1-B1-R64|G1-B4-R256|G1-B8-R512|G1-B32-R2048) ;;
            *) echo "Unknown frozen G1 lane '$LANE'." >&2; exit 2 ;;
          esac
          python - "$RUN_DATE" <<'PY'
          import datetime as dt
          import re
          import sys
          value = sys.argv[1]
          if not re.fullmatch(r"\d{8}", value):
              raise SystemExit("run-date must be YYYYMMDD")
          dt.datetime.strptime(value, "%Y%m%d")
          PY
          sequence="$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          short_commit="${GITHUB_SHA:0:7}"
          {
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "RUN_ID=PATCH-GAP-001/RUN-${RUN_DATE}-${sequence}-${short_commit}-${{ matrix.platform }}-g1-memory"
            echo "CORPUS_ROOT=$HOME/patch-corpus"
            echo "CALIBRATION=$RUNNER_TEMP/g1-calibration"
            echo "OUT=$RUNNER_TEMP/g1-memory"
          } >> "$GITHUB_ENV"

      - name: Checkout tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # chunkshift-source is materialized from historical repository commits.
          fetch-depth: 0

      - name: Verify clean tested checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download exact calibration artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.calibration-artifact-name }}
          path: ${{ runner.temp }}/g1-calibration
          github-token: ${{ github.token }}
          run-id: ${{ inputs.calibration-run-id }}

      - name: Require selected lane to have crossed calibration size gate
        shell: bash
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          python - "$CALIBRATION/g1-index.json" "$SOURCE_COMMIT" "$LANE" "$PROTOCOL_COMMIT" "$PAIRS_SHA256" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source, lane, protocol, pairs = sys.argv[2:]
          root = json.loads(path.read_text(encoding="utf-8"))
          checks = {
              "schema": root.get("schema") == "chunkshift.patch-gap-g1-byte-study.v1",
              "source": root.get("sourceCommit") == source,
              "protocol": root.get("protocolCommit") == protocol,
              "dataset": root.get("datasetSha256") == pairs,
              "role": root.get("datasetRole") == "calibration",
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("foreign calibration artifact: " + ", ".join(failed))

          match = next((item for item in root.get("lanes", []) if item.get("lane") == lane), None)
          if match is None:
              raise SystemExit(f"calibration artifact has no lane {lane}")
          if not bool(match.get("meetsRfcSizeGate")):
              raise SystemExit(
                  f"{lane} did not cross the frozen calibration 15% size gate; "
                  "three-platform apply memory is not authorized for this lane"
              )
          PY

      - name: Restore frozen patch-corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize and lock frozen patch corpus
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$CORPUS_ROOT" \
            --sources "$HOME/patch-corpus/sources" \
            --download \
            --lock
          "$python" - "$CORPUS_ROOT/pairs.json" "$PAIRS_SHA256" <<'PY'
          import hashlib
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"pairs SHA-256 {actual} != frozen {expected}")
          PY

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Measure G1 apply memory
        shell: bash
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          dotnet "$dll" patch-lab gap g1-memory \
            --corpus "$CORPUS_ROOT" \
            --index "$CALIBRATION/g1-index.json" \
            --detail-dir "$CALIBRATION/detail" \
            --lane "$LANE" \
            --output "$OUT/memory-${{ matrix.platform }}.json" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID" \
            --platform "${{ matrix.platform }}"

      - name: Summarize measured memory gate
        shell: bash
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          python - "$OUT/memory-${{ matrix.platform }}.json" "$SOURCE_COMMIT" "$LANE" "${{ matrix.platform }}" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          source, lane, platform = sys.argv[2:]
          root = json.loads(path.read_text(encoding="utf-8"))
          if root.get("schema") != "chunkshift.patch-gap-g1-apply-memory.v1":
              raise SystemExit("unexpected G1 memory schema")
          if root.get("provenance", {}).get("sourceCommit") != source:
              raise SystemExit("G1 memory source commit mismatch")
          if root.get("lane") != lane or root.get("platform") != platform:
              raise SystemExit("G1 memory lane/platform mismatch")
          if not root.get("files"):
              raise SystemExit("G1 memory result has no >=1 MiB files")
          summary = [
              f"### PATCH-GAP-001 {lane} apply memory / {platform}",
              "",
              f"- files: {len(root['files'])}",
              f"- idle baseline: {int(root['idleBaselineBytes']):,} B",
              f"- maximum peak over idle: {int(root['maximumPeakOverIdleBytes']):,} B",
              f"- frozen limit over idle: {int(root['limitOverIdleBytes']):,} B",
              f"- within limit: {root['withinLimit']}",
          ]
          pathlib.Path(path.parent / "summary.md").write_text(
              "\n".join(summary) + "\n", encoding="utf-8", newline="\n")
          PY
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload platform memory evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-gap-001-g1-memory-${{ inputs.lane }}-${{ matrix.platform }}-${{ github.run_number }}-${{ github.sha }}
          path: ${{ env.OUT }}/memory-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

  compare:
    name: g1-memory-cross-platform
    needs: memory
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download platform memory evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-gap-001-g1-memory-${{ inputs.lane }}-*-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/g1-memory
          merge-multiple: true

      - name: Enforce cross-platform plan identity and report gate
        shell: bash
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/g1-memory" "$LANE" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          lane = sys.argv[2]
          docs = [json.loads(path.read_text(encoding="utf-8"))
                  for path in sorted(root.glob("memory-*.json"))]
          expected_platforms = {"linux-x64", "linux-arm64", "win-x64"}
          if {doc["platform"] for doc in docs} != expected_platforms:
              raise SystemExit("G1 memory evidence is missing a required runtime platform")

          first = docs[0]
          first_files = {
              (row["family"], row["baseVersion"], row["targetVersion"], row["path"]):
              row["planSha256"]
              for row in first["files"]
          }
          for doc in docs:
              if doc["lane"] != lane:
                  raise SystemExit("cross-platform G1 lane mismatch")
              if doc["protocolCommit"] != first["protocolCommit"]:
                  raise SystemExit("cross-platform G1 protocol mismatch")
              if doc["provenance"]["sourceCommit"] != first["provenance"]["sourceCommit"]:
                  raise SystemExit("cross-platform G1 source mismatch")
              if doc["datasetSha256"] != first["datasetSha256"]:
                  raise SystemExit("cross-platform G1 dataset mismatch")
              current = {
                  (row["family"], row["baseVersion"], row["targetVersion"], row["path"]):
                  row["planSha256"]
                  for row in doc["files"]
              }
              if current != first_files:
                  raise SystemExit(
                      f"G1 selected encoding/frame plan diverged on {doc['platform']}")

          result = {
              "schema": "chunkshift.patch-gap-g1-memory-cross-platform.v1",
              "lane": lane,
              "sourceCommit": first["provenance"]["sourceCommit"],
              "protocolCommit": first["protocolCommit"],
              "datasetSha256": first["datasetSha256"],
              "platforms": {
                  doc["platform"]: {
                      "idleBaselineBytes": doc["idleBaselineBytes"],
                      "maximumPeakOverIdleBytes": doc["maximumPeakOverIdleBytes"],
                      "limitOverIdleBytes": doc["limitOverIdleBytes"],
                      "withinLimit": doc["withinLimit"],
                  }
                  for doc in docs
              },
              "allWithinLimit": all(doc["withinLimit"] for doc in docs),
              "filePlans": len(first_files),
          }
          out = root / "cross-platform.json"
          out.write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")),
              encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload cross-platform memory evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-gap-001-g1-memory-cross-platform-${{ inputs.lane }}-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/g1-memory/cross-platform.json
          if-no-files-found: error
          retention-days: 90
