name: Repository holdout geometry

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-ingest-lab/holdout-lock.json'
      - 'tools/repository-ingest-lab/holdout_geometry.py'
      - 'tools/repository-ingest-lab/HoldoutGeometry.cs'
      - '.github/workflows/repository-holdout-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Test acquisition and existing validators
        run: python -B -m unittest discover -s tools/repository-ingest-lab -p "test_*.py"
      - name: Regenerate sealed sources and audit CDC geometry without timing
        shell: pwsh
        run: |
          python -B tools/repository-ingest-lab/holdout_geometry.py --output "$env:RUNNER_TEMP/holdout-geometry"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original geometry and provenance (no binaries)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: holdout-geometry-${{ matrix.os }}
          path: ${{ runner.temp }}/holdout-geometry/evidence/
          if-no-files-found: warn
          retention-days: 90
