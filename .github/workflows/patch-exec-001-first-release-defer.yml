name: PATCH-EXEC-001 source-bound first-release DEFER verification

on:
  pull_request:
    paths:
      - 'benchmarks/scripts/verify_patch_exec_001_first_release_defer.py'
      - 'benchmarks/experiments/patch-exec-001-first-release-defer-20261117.json'
      - 'benchmarks/experiments/research-registry.v1.json'
      - 'docs/research/EXPERIMENT-INDEX.md'
      - 'docs/research/results/PATCH-EXEC-001-FIRST-RELEASE-DEFER-20261117-001.md'
      - 'docs/research/results/PATCH-EXEC-001-G2A-EVIDENCE-20261015-001.md'
      - 'docs/research/results/data/PATCH-EXEC-001-G2A-20261015-001/**'
      - '.github/workflows/patch-exec-001-first-release-defer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-defer:
    name: retained G2-A decision replay
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify checkout and clean tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Replay source tables and seven mutations
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/scripts/verify_patch_exec_001_first_release_defer.py --repo-root . --self-test
