name: Repository native ENOSPC

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-crash-lab/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/repository-native-enospc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-enospc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Test independent ENOSPC oracle
        run: python -B -m unittest discover -s tools/repository-crash-lab -p test_native_enospc_oracle.py -v
      - name: Exercise real ENOSPC in bounded isolated filesystem
        shell: bash
        run: |
          set -euo pipefail
          mount_dir="$(mktemp -d "$RUNNER_TEMP/repository-enospc-mount.XXXXXXXX")"
          mounted=0
          cleanup() {
            if [ "$mounted" -eq 1 ]; then
              sudo umount -- "$mount_dir" || return 1
            fi
            rmdir -- "$mount_dir"
          }
          trap cleanup EXIT
          # Never fill the runner root or a shared filesystem.
          sudo mount -t tmpfs -o "size=1m,mode=0700,uid=$(id -u),gid=$(id -g),nodev,nosuid,noexec" tmpfs "$mount_dir"
          mounted=1
          python -B tools/repository-crash-lab/run_native_enospc.py --mount "$mount_dir" --output "$RUNNER_TEMP/repository-native-enospc"
          python -B -c 'import json,sys; rows=[json.loads(x) for x in open(sys.argv[1],encoding="utf-8")]; assert len(rows)==4 and {(x["suite"],x["phase"]) for x in rows}=={(s,p) for s in ("sha256","blake3") for p in ("write","flush")} and all(x["native_errno"]==28 and x["outcome"]==x["fresh"]=="pass" for x in rows)' "$RUNNER_TEMP/repository-native-enospc/evidence/cases.jsonl"
      - name: Preserve native error and original byte evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-native-enospc-${{ matrix.os }}
          path: ${{ runner.temp }}/repository-native-enospc/evidence/
          if-no-files-found: warn
          retention-days: 90
