name: PATCH-TREE-001 T3B2C0 original passive base-read topology

# Post-reviewed-main first-run-only; never use unreviewed PR code on source releases.
on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeT3B2C0.cs'
      - '.github/workflows/patch-tree-001-t3b2c0-real-calibration.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: patch-tree-001-t3b2c0-original
  cancel-in-progress: false

jobs:
  repeated-real-csp:
    name: Original two renamed DLLs, stream trace (ubuntu-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    steps:
      - name: Restrict original to first GitHub-hosted main push
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'definitely-stable/ChunkShift'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'Linux'
          test "$RUNNER_ARCH" = 'X64'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-tree-001-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}
      - name: Pin original input provenance independently before source download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t3b2b-original" "$RUNNER_TEMP/t3b2b-b1" "$RUNNER_TEMP/t3b2b-b2a"
          for id in 38136336025 39967460136 39977481690; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$RUNNER_TEMP/$id.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json,os,pathlib,sys
          t=pathlib.Path(sys.argv[1])
          runs=[
             (38136336025,'workflow_dispatch','.github/workflows/patch-tree-001-pairs-reference.yml',None),
             (39967460136,'push','.github/workflows/patch-tree-001-t3b1-real-calibration.yml','a64fc8cedb651d9c7f14f886709cfdf65c693f10'),
             (39977481690,'push','.github/workflows/patch-tree-001-t3b2a-real-calibration.yml','1282fd6f1d01384f2858acf1192ab0f3600ec4f8')
          ]
          for id,event,workflow,sha in runs:
            x=json.loads((t/f'{id}.json').read_text(encoding='utf-8'))
            assert x['id']==id and x['event']==event and x['head_branch']=='main'
            assert x['run_attempt']==1 and x['status']=='completed' and x['conclusion']=='success'
            assert x['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
            assert x['path'].split('@')[0]==workflow
            if sha: assert x['head_sha']==sha
          PY
          gh run download 38136336025 -R "$GITHUB_REPOSITORY" \
            -n patch-tree-001-original-pairs -D "$RUNNER_TEMP/t3b2b-original"
          gh run download 39967460136 -R "$GITHUB_REPOSITORY" \
            -n patch-tree-t3b1-original-two-DLL-NO-ADOPT -D "$RUNNER_TEMP/t3b2b-b1"
          gh run download 39977481690 -R "$GITHUB_REPOSITORY" \
            -n patch-tree-t3b2a-original-structural-NO-ADOPT -D "$RUNNER_TEMP/t3b2b-b2a"
          ( cd "$RUNNER_TEMP/t3b2b-original" && sha256sum --check SHA256SUMS &&
            echo "8b3b92a9d0fba4bee80602aeafbdd443e5c612ff94889621537b8fb910fd22dd  pairs.json" | sha256sum --check )
          ( cd "$RUNNER_TEMP/t3b2b-b1" && sha256sum --check SHA256SUMS &&
            echo "2627067691b3fb2cd6515d8eaf5107b331080c4603599b5ae276e522d08dfdad  t3b1-selection.json" | sha256sum --check )
          ( cd "$RUNNER_TEMP/t3b2b-b2a" && sha256sum --check SHA256SUMS &&
            echo "1798536b998c9078fda8dca5fb2af457909753c7b7f811e89402f63e9ad8242b  t3b2a-selected.json" | sha256sum --check )
      - name: Materialize and hash original calibration trees (no holdout)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t3b2c0-results"
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$RUNNER_TEMP/t3b2c0-corpus" --sources "$HOME/patch-corpus/sources" \
            --download --lock --calibration-only \
            --pairs-reference "$RUNNER_TEMP/t3b2b-original/pairs.json"
          python3 benchmarks/scripts/patch_tree_001_inventory.py \
            --root "$RUNNER_TEMP/t3b2c0-corpus" \
            --output "$RUNNER_TEMP/t3b2c0-results/layouts.json" --calibration-only
          cp "$RUNNER_TEMP/t3b2b-original/pairs.json" "$RUNNER_TEMP/t3b2c0-results/original-pairs.json"
          cp "$RUNNER_TEMP/t3b2b-b1/t3b1-selection.json" "$RUNNER_TEMP/t3b2c0-results/original-b1-selection.json"
          cp "$RUNNER_TEMP/t3b2b-b2a/t3b2a-selected.json" "$RUNNER_TEMP/t3b2c0-results/original-b2a-selected.json"
          python3 benchmarks/scripts/patch_tree_001_t3b1_select.py \
            --corpus "$RUNNER_TEMP/t3b2c0-corpus" \
            --inventory "$RUNNER_TEMP/t3b2c0-results/layouts.json" \
            --output "$RUNNER_TEMP/t3b2c0-results/rehash-selection.json"
      - name: Require independently pinned B1 and B2A old/new source identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/t3b2c0-results" <<'PY'
          import json,pathlib,sys
          t=pathlib.Path(sys.argv[1])
          b1=json.loads((t/'original-b1-selection.json').read_text())
          verified=json.loads((t/'rehash-selection.json').read_text())
          b2=json.loads((t/'original-b2a-selected.json').read_text())
          assert verified==b1 and b1['schema']=='chunkshift.patch-tree-t3b1-fixed-two.v1'
          picked=[x for p in b2['pairs'] for x in p['candidates']]
          assert len(picked)==2 and len(b1['candidates'])==2 and b2['totals']['fallBackCount']==0
          for expected,found in zip(b1['candidates'],picked):
            for k in ('sourcePath','targetPath','sourceSha256','targetSha256',
                      'sourceLength','targetLength'):
              assert expected[k]==found[k]
          PY
      - name: Build exact CSP SDK and preflight read-topology contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
          dotnet test benchmarks/ChunkShift.Benchmarks.slnx -c Release \
            --no-build --no-restore --filter FullyQualifiedName~PatchTreeT3B2C0

      - name: Trace actual original T3 CSP base file Stream access, counterbalance observer
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/t3b2b-b1/t3b1-physical.json" "$RUNNER_TEMP/t3b2c0-results/original-b1-physical.json"
          dotnet run --no-build --project benchmarks/ChunkShift.Benchmarks -c Release -- \
            patch-lab tree-t3b2c0 --corpus "$RUNNER_TEMP/t3b2c0-corpus" \
            --selection "$RUNNER_TEMP/t3b2c0-results/original-b1-selection.json" \
            --scratch "$RUNNER_TEMP/t3b2c0-temporary-csp" \
            --output "$RUNNER_TEMP/t3b2c0-results/topology.json"
          python3 - "$RUNNER_TEMP/t3b2c0-results" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          root=pathlib.Path(sys.argv[1])
          x=json.loads((root/'topology.json').read_text(encoding='utf-8'))
          prior=json.loads((root/'original-b1-physical.json').read_text(encoding='utf-8'))
          assert x['schema']=='chunkshift.patch-tree-t3b2c0-read-topology.v1'
          assert x['status']=='PASSIVE_BASE_STREAM_ATTRIBUTION_ONLY_NO_ADOPT'
          assert x['warmupsPerMode']==1 and x['measuredRoundsPerMode']==3
          assert len(x['pairs'])==len(prior['rows'])==2
          for pair,ref in zip(x['pairs'],prior['rows']):
            assert pair['sourcePath']==ref['sourcePath'] and pair['targetPath']==ref['targetPath']
            assert pair['sourceSha256']==ref['sourceSha256']
            assert pair['targetSha256']==ref['targetSha256']
            assert pair['physicalCspBytes']==ref['t3CspPhysicalBytes']
            assert pair['physicalCspSha256']==ref['t3CspSha256']
            samples=pair['samples']
            assert len(samples)==8
            expect=[('counter-only',0,True),('trace',0,True)]
            for n in range(3):
              expect += [(a,n,False) for a in (('counter-only','trace')
                                             if n%2==0 else ('trace','counter-only'))]
            assert [(s['mode'],s['round'],s['warmup']) for s in samples]==expect
            assert all(s['exactApply'] and s['cspSha256']==ref['t3CspSha256']
                       and s['cspBytes']==ref['t3CspPhysicalBytes'] for s in samples)
            observed=[s['readTopology'] for s in samples if s['mode']=='trace']
            counted=[s['readTopology'] for s in samples if s['mode']=='counter-only']
            assert all(c['complete'] and c['uniqueReadBytes']<=pair['oldSourceLength']
                       and c['uniqueReadBytes']+c['repeatedReadBytes']==c['logicalReadBytes']
                       and c['observedReadEventCount']<=250000 for c in observed)
            assert all(not c['complete'] for c in counted)
            assert len({c['logicalReadBytes'] for c in counted+observed})==1
            print('T3B2C0 original',pair['baseVersion'],'->',pair['targetVersion'],
                  'source',pair['oldSourceLength'],
                  'logical',observed[0]['logicalReadBytes'],
                  'unique',observed[0]['uniqueReadBytes'],
                  'repeated',observed[0]['repeatedReadBytes'],
                  'seek assignments',observed[0]['positionAssignments'],
                  'backward',observed[0]['backwardReadTransitions'],
                  'noncontiguous',observed[0]['noncontiguousReadTransitions'],
                  'trace observer wall ratio',pair['traceToCounterWallRatio'])
          assert not pathlib.Path(os.environ['RUNNER_TEMP'],'t3b2c0-temporary-csp').exists()
          provenance={
            'schema':'chunkshift.patch-tree-t3b2c0-original-provenance.v1',
            'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'sourceSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'ref':os.environ['GITHUB_REF'],'runnerEnvironment':os.environ['RUNNER_ENVIRONMENT'],
            'runnerOS':os.environ['RUNNER_OS'],'runnerArch':os.environ['RUNNER_ARCH'],
            'originalPairsRunId':38136336025,'originalB1RunId':39967460136,
            'originalB2aRunId':39977481690,'sealedHoldoutOpened':False,
            'sourceContentArchived':False,'rawCspArchived':False,
          }
          assert provenance['sourceSha']==os.environ['GITHUB_SHA']
          (root/'provenance.json').write_text(json.dumps(provenance,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          with (root/'SHA256SUMS').open('w',encoding='ascii') as h:
            for name in ('original-pairs.json','original-b1-selection.json',
                         'original-b2a-selected.json','original-b1-physical.json',
                         'rehash-selection.json','layouts.json','topology.json','provenance.json'):
              h.write(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n')
          PY
          ( cd "$RUNNER_TEMP/t3b2c0-results" && sha256sum --check SHA256SUMS )
          echo 'T3B2C0 ORIGINAL PASSIVE STREAM TOPOLOGY; NO PRODUCTION ADOPT' >> "$GITHUB_STEP_SUMMARY"
      - name: Mark failures UNVERIFIED
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t3b2c0-results"
          printf 'UNVERIFIED_NOT_DECISION\nRun=%s\nSHA=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/t3b2c0-results/UNVERIFIED.txt"
      - name: Archive failed diagnostic, not evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-tree-t3b2c0-UNVERIFIED-diagnostics
          path: ${{ runner.temp }}/t3b2c0-results/
          retention-days: 14
      - name: Archive original paired measurements only
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-tree-t3b2c0-original-topology-NO-ADOPT
          path: ${{ runner.temp }}/t3b2c0-results/
          if-no-files-found: error
          retention-days: 90
