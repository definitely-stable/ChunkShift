name: Repository selective ext4 read EIO

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-crash-lab/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/repository-ext4-read-eio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ext4-read-eio:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Test independent geometry and EIO oracle
        run: python -B -m unittest discover -s tools/repository-crash-lab -p test_ext4_read_eio_oracle.py -v
      - name: Fault one allocated Pack data block on a disposable mapping
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/repository-crash-lab/run_ext4_read_eio.py
          python -B -c 'import json,sys; rows=[json.loads(x) for x in open(sys.argv[1],encoding="utf-8")]; assert len(rows)==2 and {x["suite"] for x in rows}=={"sha256","blake3"} and all(x["native_errno"]==x["reader"]["hresult"]==5 and x["reader"]["accepted"] is False and x["cleanup"]=="confirmed" and x["outcome"]=="pass" and x["linear"]==x["restored_table"] and x["source_sha256"]==x["reader"]["expected_sha256"] for x in rows)' "$RUNNER_TEMP/repository-ext4-read-eio-evidence/cases.jsonl"
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-ext4-read-eio-${{ matrix.os }}
          path: ${{ runner.temp }}/repository-ext4-read-eio-evidence/
          if-no-files-found: warn
          retention-days: 90
