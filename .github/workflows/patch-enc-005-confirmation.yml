name: PATCH-ENC-005 confirmation lock

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/benchmarks/patch-enc-005-confirmation/**"
      - "benchmarks/scripts/materialize_patch_enc_005_confirmation.py"
      - "benchmarks/scripts/run_patch_enc_005_paired.py"
      - "benchmarks/scripts/test_patch_enc_005_paired.py"
      - "benchmarks/scripts/check_patch_enc_005_cross_platform.py"
      - "benchmarks/scripts/test_check_patch_enc_005_cross_platform.py"

permissions:
  contents: read

concurrency:
  group: patch-enc-005-confirmation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: confirmation-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test PATCH-ENC-005 evidence infrastructure
        run: |
          python3 -m unittest \
            benchmarks/scripts/test_patch_enc_005_paired.py \
            benchmarks/scripts/test_check_patch_enc_005_cross_platform.py

      - name: Materialize frozen confirmation pair list
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_enc_005_confirmation.py \
            --root artifacts/patch-enc-005-confirmation \
            --download \
            --lock docs/benchmarks/patch-enc-005-confirmation/pair-list.lock.json

      - name: Upload pair list
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-enc-005-confirmation-pair-list
          path: artifacts/patch-enc-005-confirmation/pairs.json
          if-no-files-found: error
          retention-days: 30
