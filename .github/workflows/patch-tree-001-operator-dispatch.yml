name: PATCH-TREE-001 calibration operator dispatch

# Authorization matches the existing audited G4 operator bridge.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

concurrency:
  group: patch-tree-001-operator-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 184 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.id == 271974079 &&
      startsWith(github.event.comment.body, '/tree-calibration ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATOR_COMMAND: ${{ github.event.comment.body }}
    steps:
      - name: Authorize exact operator command and single source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import subprocess

          match = re.fullmatch(r"/tree-calibration (20[0-9]{6})",
                               os.environ["OPERATOR_COMMAND"])
          if match is None:
              raise SystemExit("Unexpected PATCH-TREE operator command")
          date = match.group(1)
          dt.datetime.strptime(date, "%Y%m%d")
          repository = os.environ["GITHUB_REPOSITORY"]
          source = os.environ["GITHUB_SHA"]
          if repository != "definitely-stable/ChunkShift":
              raise SystemExit("Unexpected repository identity")

          def api(path):
              return json.loads(subprocess.check_output(
                  ["gh", "api", "repos/" + repository + "/" + path],
                  text=True))

          def main_head():
              return api("branches/main")["commit"]["sha"]

          if source != main_head():
              raise SystemExit("Main changed since comment; refusing source drift")

          workflow = "patch-tree-001-t0-t1-calibration.yml"
          previous = api(
              "actions/workflows/" + workflow +
              "/runs?event=workflow_dispatch&per_page=100")
          if int(previous.get("total_count", 0)) > 100:
              raise SystemExit("Run history exceeds audited enumeration limit")
          runs = previous.get("workflow_runs", [])
          if any(r.get("status") != "completed" or
                 r.get("conclusion") == "success" for r in runs):
              raise SystemExit("A successful or active calibration already exists")

          if source != main_head():
              raise SystemExit("Main advanced before dispatch")

          subprocess.run(
              ["gh", "api", "--method", "POST",
               "repos/" + repository + "/actions/workflows/" + workflow +
               "/dispatches", "-f", "ref=main",
               "-f", "inputs[run-date]=" + date],
              check=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as log:
              log.write("PATCH-TREE-001 calibration dispatch submitted\n"
                        "Source: " + source + "\n"
                        "Date: " + date + "\n"
                        "Submission is not a size verdict.\n")
          PY
