name: PATCH-TREE-001 T3B2A structural candidate contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/scripts/patch_tree_001_t3b2a_candidates.py'
      - 'benchmarks/scripts/test_patch_tree_001_t3b2a_candidates.py'
      - 'docs/benchmarks/PATCH-TREE-001-T3B2A-STRUCTURAL-RENAME-PROTOCOL.md'
      - '.github/workflows/patch-tree-001-t3b2a-contracts.yml'
      - '.github/workflows/patch-tree-001-t3b2a-real-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-fallback:
    name: Structural rename fallback (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Source-free structural matching negative oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile benchmarks/scripts/patch_tree_001_t3b2a_candidates.py benchmarks/scripts/test_patch_tree_001_t3b2a_candidates.py
          python -m unittest discover -s benchmarks/scripts \
            -p 'test_patch_tree_001_t3b2a_candidates.py' -v
          echo 'T3B2A PRESELECTION CONTRACTS ONLY; no original/holdout patch verdict' >> "$GITHUB_STEP_SUMMARY"
