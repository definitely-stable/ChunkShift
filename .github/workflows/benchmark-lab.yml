name: Benchmark lab

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "docs/benchmarks/**"
      - "src/ChunkShift/Hashing/**"
      - "src/ChunkShift/Chunking/**"
      - "src/ChunkShift/Profiles/**"
      - "src/ChunkShift/Primitives/Hash256.cs"
      - "docs/architecture/PROFILE-FINGERPRINT-V1.md"
      - "tools/reference/fastcdc_reference.py"
      - "tools/reference/fastcdc-rs-probe/**"
      - "Directory.Packages.props"
      - ".github/workflows/benchmark-lab.yml"
      - ".github/workflows/heavy-validation.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "docs/benchmarks/**"
      - "src/ChunkShift/Hashing/**"
      - "src/ChunkShift/Chunking/**"
      - "src/ChunkShift/Primitives/Hash256.cs"
      - "tools/reference/fastcdc_reference.py"
      - "tools/reference/fastcdc-rs-probe/**"
      - "Directory.Packages.props"
      - ".github/workflows/benchmark-lab.yml"
      - ".github/workflows/heavy-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  smoke:
    name: benchmark-lab-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Test
        run: dotnet test benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-build --no-restore

      - name: Validate benchmark evidence scripts
        run: python3 -m py_compile benchmarks/scripts/summarize_scanner_phase2.py benchmarks/scripts/summarize_scanner_freeze.py benchmarks/scripts/summarize_boundary_scan_f08.py benchmarks/scripts/run_cdc_runtime_guardrail.py

      - name: 'Validate #8 runtime guardrail plan'
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/run_cdc_runtime_guardrail.py self-test
          python3 benchmarks/scripts/run_cdc_runtime_guardrail.py validate \
            --corpus benchmarks/corpus/cdc-0.1-runtime.v1.json \
            --experiments benchmarks/experiments/cdc-0.1-runtime.v1.json

      - name: Verify independent Python FastCDC vector
        shell: bash
        run: python3 tools/reference/fastcdc_reference.py --verify

      - name: Verify pinned fastcdc-rs v2016/v2020 oracle
        shell: bash
        run: |
          set -euo pipefail
          cd tools/reference/fastcdc-rs-probe
          cargo run --locked --release

      - name: Verify frozen real-corpus materialization recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_cdc_real_corpus.py \
            --manifest docs/benchmarks/cdc-0.1-corpus/real-corpus.json \
            --source-checksums docs/benchmarks/cdc-0.1-corpus/source-assets.sha256 \
            --output "$RUNNER_TEMP/chunkshift-cdc-real-corpus" \
            --check-only

      - name: Run deterministic lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            lab \
            --corpus benchmarks/corpus/corpus.v1.json \
            --experiments benchmarks/experiments/experiments.v2.json \
            --output artifacts/benchmarks/lab-smoke.json

      # One child process per experiment: the isolated run must reproduce the
      # in-process evidence exactly and record its isolation mode.
      - name: Run isolated lab and compare with the in-process run
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            lab \
            --corpus benchmarks/corpus/corpus.v1.json \
            --experiments benchmarks/experiments/experiments.v2.json \
            --output artifacts/benchmarks/lab-smoke-isolated.json \
            --isolate
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            compare \
            --left artifacts/benchmarks/lab-smoke.json \
            --right artifacts/benchmarks/lab-smoke-isolated.json
          python3 - <<'PY'
          import json
          inprocess = json.load(open("artifacts/benchmarks/lab-smoke.json"))
          isolated = json.load(open("artifacts/benchmarks/lab-smoke-isolated.json"))
          assert inprocess["measurement"]["processIsolation"] == "none"
          assert isolated["measurement"]["processIsolation"] == "per-experiment"
          assert [r["experimentId"] for r in isolated["results"]] == [r["experimentId"] for r in inprocess["results"]]
          assert all(r["metrics"]["processPeakRssBytes"] > 0 for r in isolated["results"])
          PY

      - name: Upload result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-lab-smoke
          path: |
            artifacts/benchmarks/lab-smoke.json
            artifacts/benchmarks/lab-smoke-isolated.json
          if-no-files-found: error
          retention-days: 14


  architecture-evidence:
    name: architecture-evidence
    if: github.event_name != 'push'
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Run focused architecture benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/benchmarks/architecture-evidence
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            micro \
            --job short \
            --memory \
            --exporters GitHub FullJSON \
            --artifacts artifacts/benchmarks/architecture-evidence \
            --filter '*FastCdcPipelineBenchmarks*' '*HashUpdateStrategyBenchmarks*' '*CsmTopologyBenchmarks*' \
            --join \
            | tee artifacts/benchmarks/architecture-evidence.log

      - name: Upload architecture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-evidence
          path: artifacts/benchmarks/architecture-evidence
          if-no-files-found: error
          retention-days: 30


  scanner-api-phase1:
    name: scanner-api-phase1
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/20-scanner-api-phase1'))
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Run scanner API phase-one benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/benchmarks/scanner-api-phase1
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            micro \
            --job short \
            --memory \
            --exporters GitHub FullJSON \
            --artifacts artifacts/benchmarks/scanner-api-phase1 \
            --filter '*ScannerApiPhase1Benchmarks*' '*ScannerApiAsyncConsumerBenchmarks*' '*ScannerApiSlowConsumerBenchmarks*' '*ScannerApiFirstChunkBenchmarks*' \
            --join \
            | tee artifacts/benchmarks/scanner-api-phase1.log

      - name: Validate scanner API evidence
        shell: bash
        run: |
          set -euo pipefail
          report_count="$(find artifacts/benchmarks/scanner-api-phase1/results -type f -name '*-report-full.json' | wc -l)"
          if [ "$report_count" -lt 1 ]; then
            echo "Expected a joined scanner API FullJSON report, found $report_count." >&2
            exit 1
          fi

          for benchmark_type in             ScannerApiPhase1Benchmarks             ScannerApiAsyncConsumerBenchmarks             ScannerApiSlowConsumerBenchmarks             ScannerApiFirstChunkBenchmarks
          do
            if ! grep -q "$benchmark_type" artifacts/benchmarks/scanner-api-phase1.log; then
              echo "Missing benchmark evidence for $benchmark_type." >&2
              exit 1
            fi
          done

      - name: Upload scanner API evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-api-phase1
          path: artifacts/benchmarks/scanner-api-phase1
          if-no-files-found: error
          retention-days: 30


  scanner-api-freeze:
    name: scanner-api-freeze (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/20-scanner-api-phase2'))
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Run final scanner API freeze benchmarks
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/benchmarks/scanner-api-freeze-${{ matrix.arch }}"
          mkdir -p "$out"
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            micro \
            --memory \
            --exporters GitHub FullJSON \
            --artifacts "$out" \
            --filter '*ScannerApiFreezeProfileBenchmarks*' '*ScannerApiFreezeCorpusBenchmarks*' '*ScannerApiFreezeShortReadBenchmarks*' '*ScannerApiFreezeAsyncBenchmarks*' '*ScannerApiFreezeFileBenchmarks*' \
            --join \
            | tee "$out.log"

      - name: Validate and compact final freeze evidence
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/benchmarks/scanner-api-freeze-${{ matrix.arch }}"
          full_json="$(find "$out/results" -type f -name '*-report-full.json' -print -quit)"

          if [ -z "$full_json" ]; then
            echo "Expected final scanner freeze FullJSON evidence." >&2
            exit 1
          fi

          python3 benchmarks/scripts/summarize_scanner_freeze.py \
            "$full_json" \
            --commit "$GITHUB_SHA" \
            --arch "${{ matrix.arch }}" \
            --json "$out/freeze-compact-evidence.json" \
            --markdown "$out/freeze-compact-evidence.md"

          test -s "$out/freeze-compact-evidence.json"
          test -s "$out/freeze-compact-evidence.md"

      - name: Upload final scanner freeze evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-api-freeze-${{ matrix.arch }}
          path: |
            artifacts/benchmarks/scanner-api-freeze-${{ matrix.arch }}
            artifacts/benchmarks/scanner-api-freeze-${{ matrix.arch }}.log
          if-no-files-found: error
          retention-days: 30


  # A1-F08: is the boundary loop bound by the latency of its gear-hash chain?
  # BoundaryScanBenchmarks (BDN, two rounds in opposite method order; every
  # method and case is its own process anyway, so the order only spreads
  # machine drift) and the f08 harness under perf stat (alternating variant
  # order per round). The PMU probe is fail-closed: without countable cycles:u
  # the job reports timings only, never counter values or derived cycles.
  boundary-scan-f08:
    name: boundary-scan-f08 (${{ matrix.arch }})
    # Also on #99 branches: the pre-freeze decision needs post-#98 x64/arm64 F08 evidence.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'perf/f08') || contains(github.head_ref, 'issue-99')))
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ROUNDS: "3"
      OUT: artifacts/benchmarks/boundary-scan-f08-${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Probe PMU
        id: pmu
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          status=unavailable
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends linux-tools-common "linux-tools-$(uname -r)" ||
              sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-azure
          } > "$OUT/perf-install.log" 2>&1
          if command -v perf > /dev/null && sudo sysctl -w kernel.perf_event_paranoid=1; then
            perf stat -x, -o "$OUT/pmu-probe.csv" -e cycles:u,instructions:u,branches:u,branch-misses:u -- true
            counted=$(grep -cE '^[0-9]+,[^,]*,(cycles|instructions|branches|branch-misses):u,' "$OUT/pmu-probe.csv" 2> /dev/null || true)
            if [ "${counted:-0}" -eq 4 ]; then
              status=available
            fi
          fi
          echo "PMU: $status (kernel $(uname -r))" | tee "$OUT/pmu.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Run BoundaryScanBenchmarks (two rounds, opposite order)
        shell: bash
        run: |
          set -euo pipefail
          methods=(Scan ScanLocals ScalarLocals ChainFloor NoChain)
          for round in 1 2
          do
            order=("${methods[@]}")
            if [ "$round" -eq 2 ]; then
              order=(NoChain ChainFloor ScalarLocals ScanLocals Scan)
            fi
            for method in "${order[@]}"
            do
              dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
                micro \
                --exporters GitHub FullJSON \
                --artifacts "$OUT/bdn-round$round/$method" \
                --filter "ChunkShift.Benchmarks.BoundaryScanBenchmarks.$method" \
                | tee -a "$OUT/bdn.log"
            done
          done

      # Round-to-round BDN differences are diagnosed from the generated code:
      # print both rounds' disassembly of the methods that moved most.
      - name: Print BDN disassembly per round
        shell: bash
        run: |
          set -euo pipefail
          for method in ChainFloor ScanLocals
          do
            for round in 1 2
            do
              echo "===== $method, BDN round $round ====="
              find "$OUT/bdn-round$round/$method" -name '*-asm.md' -print -exec cat {} \;
            done
          done

      - name: Run f08 harness rounds
        shell: bash
        env:
          PMU: ${{ steps.pmu.outputs.status }}
        run: |
          set -euo pipefail
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          variants=(Scan ScanLocals ScalarLocals ChainFloor NoChain Calibrate)
          mkdir -p "$OUT/harness"
          for round in $(seq "$ROUNDS")
          do
            order=("${variants[@]}")
            if [ $((round % 2)) -eq 0 ]; then
              order=(Calibrate NoChain ChainFloor ScalarLocals ScanLocals Scan)
            fi
            for variant in "${order[@]}"
            do
              for target in 65536 262144
              do
                stem="$OUT/harness/round$round-$variant-$target"
                if [ "$PMU" = available ]; then
                  rm -f ctl.fifo ack.fifo
                  mkfifo ctl.fifo ack.fifo
                  # A hung control handshake fails the run instead of the job timeout.
                  timeout 600 perf stat -x, -o "$stem.perf.csv" \
                    -e cycles:u,instructions:u,branches:u,branch-misses:u \
                    -D -1 --control fifo:ctl.fifo,ack.fifo -- \
                    dotnet "$dll" f08 --variant "$variant" --target "$target" \
                      --perf-ctl ctl.fifo --perf-ack ack.fifo \
                    > "$stem.txt"
                else
                  timeout 600 dotnet "$dll" f08 --variant "$variant" --target "$target" > "$stem.txt"
                fi
                cat "$stem.txt"
              done
            done
          done

      - name: Capture JIT disassembly
        shell: bash
        run: |
          set -euo pipefail
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          for variant in Scan ScanLocals ScalarLocals ChainFloor NoChain Calibrate
          do
            DOTNET_JitDisasm='Scan FindCut ChainFloor NoChain CalibrationChain' \
            DOTNET_JitDisasmSummary=1 \
            DOTNET_JitStdOutFile="$OUT/jit-disasm-$variant.txt" \
              dotnet "$dll" f08 --variant "$variant" --target 65536 --seconds 1 --warmup-seconds 2
          done
          # Which tiers the measured methods reached (Tier0, OSR, Tier1).
          grep -hE 'JIT compiled .*(CalibrationChain|ChainFloor|NoChain|FindCut|BoundaryScanKernels:Scan|ChunkBoundaryState:Scan|LocalsBoundaryState:Scan)' \
            "$OUT"/jit-disasm-*.txt | sort | uniq -c | tee "$OUT/jit-tiers.txt"
          # The calibration chain's generated code, every tier, for the
          # calibration-premise check.
          awk '/Assembly listing for method .*CalibrationChain/ { p = 1 } p { print } /Total bytes of code/ { p = 0 }' \
            "$OUT/jit-disasm-Calibrate.txt"

      - name: Summarize F08 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/summarize_boundary_scan_f08.py \
            --harness "$OUT/harness" \
            --bdn "$OUT/bdn-round1" \
            --bdn "$OUT/bdn-round2" \
            --pmu "${{ steps.pmu.outputs.status }}" \
            --rounds "$ROUNDS" \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --arch "${{ matrix.arch }}" \
            --json "$OUT/f08-summary.json" \
            --markdown "$OUT/f08-summary.md"
          cat "$OUT/f08-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload F08 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boundary-scan-f08-${{ matrix.arch }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30


  # #99: pre-freeze CDC evidence. amdahl decomposes the canonical streaming
  # path; prefreeze scores the current Gear candidate against the lab-only
  # warmed-prefix candidate and the fixed control. Quality results are
  # deterministic and compared across architectures below.
  cdc-prefreeze:
    name: cdc-prefreeze (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.head_ref, 'issue-99'))
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      OUT: artifacts/benchmarks/cdc-prefreeze-${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Amdahl decomposition of the streaming path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          timeout 1200 dotnet "$dll" amdahl --rounds 3 | tee "$OUT/amdahl.txt"
          {
            echo "### amdahl (${{ matrix.arch }})"
            echo '```text'
            grep -E '^(#|summary)' "$OUT/amdahl.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-freeze semantic scorecard
        shell: bash
        run: |
          set -euo pipefail
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          for lane in fine coarse
          do
            dotnet "$dll" prefreeze \
              --plan benchmarks/experiments/prefreeze.v1.json \
              --lane "$lane" \
              --output "$OUT/prefreeze-$lane.json" \
              --markdown "$OUT/prefreeze-$lane.md"
          done

      - name: Upload pre-freeze evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdc-prefreeze-${{ matrix.arch }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

  cdc-prefreeze-compare:
    name: cdc-prefreeze-compare
    needs: cdc-prefreeze
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download pre-freeze evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cdc-prefreeze-*
          path: evidence

      - name: Compare chunk sequences across architectures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for lane in ("fine", "coarse"):
              x64 = json.load(open(f"evidence/cdc-prefreeze-x64/prefreeze-{lane}.json"))
              arm = json.load(open(f"evidence/cdc-prefreeze-arm64/prefreeze-{lane}.json"))
              key = lambda r: (r["corpusId"], r["nominalTarget"], r["candidate"], r["mutationId"])
              left = {key(r): r["targetChunkSequenceDigest"] for r in x64["rows"]}
              right = {key(r): r["targetChunkSequenceDigest"] for r in arm["rows"]}
              assert left == right, f"{lane}: x64 and arm64 chunk sequences differ"
              assert [d["currentChunkSequenceDigest"] for d in x64["divergence"]] == [d["currentChunkSequenceDigest"] for d in arm["divergence"]]
              assert [d["warmedChunkSequenceDigest"] for d in x64["divergence"]] == [d["warmedChunkSequenceDigest"] for d in arm["divergence"]]
              print(f"{lane}: {len(left)} rows identical on x64 and arm64")
          PY

  # #8: deterministic scorecard over the frozen real multi-version corpus.
  # The corpus is reconstructed from upstream release assets and verified
  # against the committed source checksums, manifest and corpus lock before
  # any candidate is instantiated. Quality runs are real-only; synthetic #99
  # evidence remains in cdc-prefreeze above.
  cdc-real-prefreeze:
    name: cdc-real-prefreeze (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'chore/8-real-corpus-bakeoff'))
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      OUT: artifacts/benchmarks/cdc-real-prefreeze-${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Materialize and verify frozen real corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 benchmarks/scripts/materialize_cdc_real_corpus.py \
            --manifest docs/benchmarks/cdc-0.1-corpus/real-corpus.json \
            --source-checksums docs/benchmarks/cdc-0.1-corpus/source-assets.sha256 \
            --output "$RUNNER_TEMP/chunkshift-cdc-real-corpus" \
            | tee "$OUT/materialize.log"

      - name: Revalidate frozen lock before measurement
        shell: bash
        run: |
          set -euo pipefail
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          dotnet "$dll" prefreeze validate-real \
            --real "$RUNNER_TEMP/chunkshift-cdc-real-corpus/real-corpus.json" \
            --plan benchmarks/experiments/prefreeze.v1.json \
            --lock-output "$OUT/corpus-lock.json" \
            > "$OUT/validation.json"
          cmp docs/benchmarks/cdc-0.1-corpus/corpus-lock.json "$OUT/corpus-lock.json"
          python3 - <<'PY'
          import json
          validation = json.load(open("artifacts/benchmarks/cdc-real-prefreeze-${{ matrix.arch }}/validation.json"))
          assert validation["selectionPossible"] is True
          assert validation["eligibleCalibrationFamilies"] == 3
          assert validation["eligibleHoldoutFamilies"] == 3
          assert validation["warnings"] == []
          print("frozen lock and eligibility verified")
          PY

      - name: Run deterministic real-corpus scorecard
        shell: bash
        run: |
          set -euo pipefail
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          for lane in fine coarse
          do
            timeout 10800 dotnet "$dll" prefreeze \
              --plan benchmarks/experiments/prefreeze.v1.json \
              --lane "$lane" \
              --real "$RUNNER_TEMP/chunkshift-cdc-real-corpus/real-corpus.json" \
              --no-synthetic \
              --output "$OUT/prefreeze-real-$lane.json" \
              --markdown "$OUT/prefreeze-real-$lane.md"
          done
          {
            echo "### #8 real-corpus scorecard (${{ matrix.arch }})"
            echo
            sed -n '1,24p' "$OUT/prefreeze-real-fine.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic real-corpus evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdc-real-prefreeze-${{ matrix.arch }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

  cdc-real-prefreeze-compare:
    name: cdc-real-prefreeze-compare
    needs: cdc-real-prefreeze
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download deterministic real-corpus evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cdc-real-prefreeze-*
          path: evidence

      - name: Compare deterministic evidence across architectures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def keyed_rows(run):
              return {
                  (r["corpusId"], r["nominalTarget"], r["candidate"], r["mutationId"]):
                  r["targetChunkSequenceDigest"]
                  for r in run["rows"]
              }

          def keyed_divergence(run, field):
              return {
                  (r["corpusId"], r["target"]): r[field]
                  for r in run["divergence"]
              }

          lines = []
          for lane in ("fine", "coarse"):
              x64 = json.load(open(f"evidence/cdc-real-prefreeze-x64/prefreeze-real-{lane}.json"))
              arm = json.load(open(f"evidence/cdc-real-prefreeze-arm64/prefreeze-real-{lane}.json"))

              assert x64["scope"] == arm["scope"] == "real"
              assert x64["realCorpus"] == arm["realCorpus"]
              assert keyed_rows(x64) == keyed_rows(arm), f"{lane}: x64/arm64 target chunk sequences differ"
              assert keyed_divergence(x64, "currentChunkSequenceDigest") == keyed_divergence(
                  arm, "currentChunkSequenceDigest"
              ), f"{lane}: current divergence digests differ"
              assert keyed_divergence(x64, "warmedChunkSequenceDigest") == keyed_divergence(
                  arm, "warmedChunkSequenceDigest"
              ), f"{lane}: warmed divergence digests differ"
              assert x64["families"] == arm["families"], f"{lane}: family aggregates differ"
              assert x64["familyComparison"] == arm["familyComparison"], f"{lane}: family comparisons differ"

              count = len(x64["rows"])
              lines.append(f"- {lane}: {count} real transition rows are deterministic on x64/arm64")

          summary = "### #8 cross-architecture determinism\n\n" + "\n".join(lines) + "\n"
          print(summary)
          Path("cross-arch-summary.md").write_text(summary, encoding="utf-8")
          PY
          cat cross-arch-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cross-architecture verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdc-real-prefreeze-cross-arch
          path: cross-arch-summary.md
          if-no-files-found: error
          retention-days: 30

  # #8: final runtime veto/guardrail after deterministic real-corpus quality
  # evidence. This does not select a profile and does not run experimental CDC
  # candidates. Ten process-isolated batches use the pre-registered schedule in
  # CDC-0.1-RUNTIME-GUARDRAIL-PLAN.md.
  cdc-runtime-guardrail:
    name: cdc-runtime-guardrail (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/8-runtime-guardrail'))
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      OUT: artifacts/benchmarks/cdc-runtime-guardrail-${{ matrix.arch }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Run ten process-isolated runtime batches
        shell: bash
        run: |
          set -euo pipefail
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          mkdir -p "$OUT"
          timeout 6600 python3 benchmarks/scripts/run_cdc_runtime_guardrail.py run \
            --dll "$dll" \
            --corpus benchmarks/corpus/cdc-0.1-runtime.v1.json \
            --experiments benchmarks/experiments/cdc-0.1-runtime.v1.json \
            --output-dir "$OUT" \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --arch "${{ matrix.arch }}"
          cat "$OUT/runtime-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime guardrail evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdc-runtime-guardrail-${{ matrix.arch }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

  cdc-runtime-guardrail-compare:
    name: cdc-runtime-guardrail-compare
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'perf/8-runtime-guardrail'))
    needs: cdc-runtime-guardrail
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download runtime guardrail evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cdc-runtime-guardrail-*
          path: evidence

      - name: Verify cross-architecture provenance and deterministic output
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/run_cdc_runtime_guardrail.py compare \
            --x64-dir evidence/cdc-runtime-guardrail-x64 \
            --arm64-dir evidence/cdc-runtime-guardrail-arm64 \
            --output runtime-cross-arch.md
          cat runtime-cross-arch.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cross-architecture runtime verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdc-runtime-guardrail-cross-arch
          path: runtime-cross-arch.md
          if-no-files-found: error
          retention-days: 30
