name: Benchmark lab

on:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "docs/benchmarks/**"
      - "src/ChunkShift/Hashing/**"
      - "src/ChunkShift/Profiles/**"
      - "src/ChunkShift/Primitives/Hash256.cs"
      - "docs/architecture/PROFILE-FINGERPRINT-V1.md"
      - "Directory.Packages.props"
      - ".github/workflows/benchmark-lab.yml"
      - ".github/workflows/heavy-validation.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "docs/benchmarks/**"
      - "src/ChunkShift/Hashing/**"
      - "src/ChunkShift/Primitives/Hash256.cs"
      - "Directory.Packages.props"
      - ".github/workflows/benchmark-lab.yml"
      - ".github/workflows/heavy-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  smoke:
    name: benchmark-lab-smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Test
        run: dotnet test benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-build --no-restore

      - name: Run deterministic lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            lab \
            --corpus benchmarks/corpus/corpus.v1.json \
            --experiments benchmarks/experiments/experiments.v2.json \
            --output artifacts/benchmarks/lab-smoke.json

      - name: Upload result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-lab-smoke
          path: artifacts/benchmarks/lab-smoke.json
          if-no-files-found: error
          retention-days: 14
