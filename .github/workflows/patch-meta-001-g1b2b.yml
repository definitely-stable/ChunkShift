name: PATCH-META-001 G1B2B consumed codec and dictionary cost

# Original source-locked Roslyn, real CSP/apply, no metadata caching.
on:
  pull_request:
    branches: [main, research/patch-meta-001-g1b2a-consumed-cost-probe]
    paths:
      - "src/ChunkShift.Patching/Creation/CspMetaResearchProbe.cs"
      - "src/ChunkShift.Patching/Creation/CspPatchBuilder.cs"
      - "benchmarks/ChunkShift.Benchmarks/PatchLab/PatchMetaG1AAttribution.cs"
      - "benchmarks/scripts/*patch_meta_001_g1b2b.py"
      - "docs/benchmarks/PATCH-META-001-G1B2B-PROTOCOL.md"
      - ".github/workflows/patch-meta-001-g1b2b.yml"

permissions:
  contents: read

jobs:
  actual-consumed-codec:
    name: original-roslyn-codec-cost-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-2025, platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Fail-closed provenance / paired-stage mutation tests
        env:
          PYTHONPATH: benchmarks/scripts
        run: >-
          python -m unittest -v
          benchmarks/scripts/test_run_patch_meta_001_g1b2b.py
          benchmarks/scripts/test_run_patch_meta_001_g1b2a.py
          benchmarks/scripts/test_run_patch_meta_001_g1b1.py
          benchmarks/scripts/test_run_patch_meta_001_g1a.py
      - name: Build original policy and optional research probe (Release)
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release
      - name: Measure real paired zstd/dictionary operations with exact CSP and target SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python benchmarks/scripts/run_patch_meta_001_g1b2b.py
          --dll benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          --corpus "${{ runner.temp }}/patch-meta-g1b2b-original-roslyn"
          --work "${{ runner.temp }}/patch-meta-g1b2b-csm-work"
          --output artifacts/patch-meta-g1b2b
          --rounds 5
      - name: Retain real per-run source-bound observations, no original binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-meta-g1b2b-${{ matrix.platform }}
          path: artifacts/patch-meta-g1b2b/
          if-no-files-found: warn
          retention-days: 30
