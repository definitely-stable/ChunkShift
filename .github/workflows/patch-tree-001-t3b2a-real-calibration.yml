name: PATCH-TREE-001 T3B2A original structural preselection

# Original calibration only. A metadata preselection, NOT a CSP size test.
on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/scripts/patch_tree_001_t3b2a_candidates.py'
      - '.github/workflows/patch-tree-001-t3b2a-real-calibration.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: patch-tree-001-t3b2a-original
  cancel-in-progress: false

jobs:
  original-preselection:
    name: Locked original four-pair source preselection (ubuntu-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Require first GitHub-hosted main push
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "definitely-stable/ChunkShift"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-tree-001-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}
      - name: Verify provenance and SHA of original pairs AND independent earlier B1 selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b2a-pairs" "$RUNNER_TEMP/b2a-b1"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38136336025" > "$RUNNER_TEMP/pairs-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39967460136" > "$RUNNER_TEMP/b1-run.json"
          python3 - "$RUNNER_TEMP/pairs-run.json" "$RUNNER_TEMP/b1-run.json" <<'PY'
          import json,os,sys
          a,b=(json.load(open(p,encoding='utf-8')) for p in sys.argv[1:])
          assert a['id']==38136336025 and a['event']=='workflow_dispatch' and a['head_branch']=='main'
          assert a['status']==a['conclusion']=='completed' or (a['status']=='completed' and a['conclusion']=='success')
          assert a['run_attempt']==1 and a['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert a['path'].split('@')[0]=='.github/workflows/patch-tree-001-pairs-reference.yml'
          assert b['id']==39967460136 and b['event']=='push' and b['head_branch']=='main'
          assert b['run_attempt']==1 and b['status']=='completed' and b['conclusion']=='success'
          assert b['head_sha']=='a64fc8cedb651d9c7f14f886709cfdf65c693f10'
          assert b['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          PY
          gh run download 38136336025 -R "$GITHUB_REPOSITORY" \
            -n patch-tree-001-original-pairs -D "$RUNNER_TEMP/b2a-pairs"
          (
            cd "$RUNNER_TEMP/b2a-pairs"
            sha256sum --check SHA256SUMS
            echo "8b3b92a9d0fba4bee80602aeafbdd443e5c612ff94889621537b8fb910fd22dd  pairs.json" | sha256sum --check
          )
          gh run download 39967460136 -R "$GITHUB_REPOSITORY" \
            -n patch-tree-t3b1-original-two-DLL-NO-ADOPT -D "$RUNNER_TEMP/b2a-b1"
          (
            cd "$RUNNER_TEMP/b2a-b1"
            sha256sum --check SHA256SUMS
            echo "2627067691b3fb2cd6515d8eaf5107b331080c4603599b5ae276e522d08dfdad  t3b1-selection.json" | sha256sum --check
          )
      - name: Materialize and fully rehash original four .NET calibration pairs only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t3b2a-results"
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$RUNNER_TEMP/t3b2a-corpus" --sources "$HOME/patch-corpus/sources" \
            --download --lock --calibration-only \
            --pairs-reference "$RUNNER_TEMP/b2a-pairs/pairs.json"
          python3 benchmarks/scripts/patch_tree_001_inventory.py \
            --root "$RUNNER_TEMP/t3b2a-corpus" \
            --output "$RUNNER_TEMP/t3b2a-results/layouts.json" --calibration-only
          cp "$RUNNER_TEMP/b2a-pairs/pairs.json" "$RUNNER_TEMP/t3b2a-results/original-pairs.json"
          cp "$RUNNER_TEMP/b2a-b1/t3b1-selection.json" "$RUNNER_TEMP/t3b2a-results/original-b1-selection.json"
      - name: Run unchanged preregistered structural candidate selector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s benchmarks/scripts -p 'test_patch_tree_001_t3b2a_candidates.py' -v
          python3 benchmarks/scripts/patch_tree_001_t3b2a_candidates.py \
            --corpus "$RUNNER_TEMP/t3b2a-corpus" \
            --inventory "$RUNNER_TEMP/t3b2a-results/layouts.json" \
            --output "$RUNNER_TEMP/t3b2a-results/t3b2a-selected.json"
      - name: Compare unbiased selected candidates against original pinned B1 identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/t3b2a-results" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          out=pathlib.Path(sys.argv[1])
          b2=json.loads((out/'t3b2a-selected.json').read_text(encoding='utf-8'))
          b1=json.loads((out/'original-b1-selection.json').read_text(encoding='utf-8'))
          assert b2['schema']=='chunkshift.patch-tree-t3b2a-original-calibration.v1'
          assert b2['status']=='ORIGINAL_CALIBRATION_CANDIDATE_PRESELECTION_ONLY_NO_ADOPT'
          assert b1['schema']=='chunkshift.patch-tree-t3b1-fixed-two.v1'
          assert len(b2['pairs'])==4 and b2['totals']['selectedCount']==2
          actual=[x for row in b2['pairs'] for x in row['candidates']]
          assert len(actual)==len(b1['candidates'])==2
          props=('sourcePath','targetPath','sourceSha256','targetSha256',
                 'sourceLength','targetLength')
          assert [{k:c[k] for k in props} for c in actual]==[
                 {k:c[k] for k in props} for c in b1['candidates']]
          assert sum(row['fallBackCount'] for row in b2['pairs'])==0
          provenance={
            'schema':'chunkshift.patch-tree-t3b2a-original-provenance.v1',
            'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'sourceSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'gitRef':os.environ['GITHUB_REF'],
            'runnerEnvironment':os.environ['RUNNER_ENVIRONMENT'],
            'runnerOS':os.environ['RUNNER_OS'],'runnerArch':os.environ['RUNNER_ARCH'],
            'originalPairsRunId':38136336025,'originalB1RunId':39967460136,
            'sealedHoldoutOpened':False,'cspCreated':False
          }
          assert provenance['sourceSha']==os.environ['GITHUB_SHA']
          (out/'provenance.json').write_text(json.dumps(provenance,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          with (out/'SHA256SUMS').open('w',encoding='ascii') as h:
            for name in ('original-pairs.json','original-b1-selection.json',
                         'layouts.json','t3b2a-selected.json','provenance.json'):
              h.write(hashlib.sha256((out/name).read_bytes()).hexdigest()+'  '+name+'\n')
          print('T3B2A original structural preselection:',b2['totals'])
          print('Original B1 identity cross-check: exact match, no CSP produced')
          PY
          ( cd "$RUNNER_TEMP/t3b2a-results" && sha256sum --check SHA256SUMS )
          echo 'T3B2A original structural candidate preselection PASS / NO_PRODUCTION_ADOPT' >> "$GITHUB_STEP_SUMMARY"
      - name: Mark failed output non-evidence
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t3b2a-results"
          printf 'UNVERIFIED_NOT_DECISION\nRun=%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/t3b2a-results/UNVERIFIED.txt"
      - name: Archive failure diagnostics, not evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-tree-t3b2a-UNVERIFIED-diagnostics
          path: ${{ runner.temp }}/t3b2a-results/
          retention-days: 14
      - name: Archive original locked candidate selection only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-tree-t3b2a-original-structural-NO-ADOPT
          path: ${{ runner.temp }}/t3b2a-results/
          if-no-files-found: error
          retention-days: 90
