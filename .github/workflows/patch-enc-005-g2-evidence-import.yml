name: TEMP PATCH-ENC-005 G2 evidence import

on:
  push:
    branches:
      - research/181-g2-evidence
    paths:
      - .github/workflows/patch-enc-005-g2-evidence-import.yml

permissions:
  actions: read
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download immutable G2 artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/g2-evidence/raw
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/11284200988/zip" \
            -o /tmp/g2-evidence/artifact.zip
          unzip -q /tmp/g2-evidence/artifact.zip -d /tmp/g2-evidence/raw

      - name: Validate artifact identity, document hashes and frozen verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/g2-evidence/raw")
          documents = json.loads((root / "documents.json").read_text(encoding="utf-8"))
          assert documents["schema"] == "chunkshift.patch-enc-005-g2-documents.v1"
          expected_names = {"execution.json", "oracle.json", "summary.md", "verdict.json"}
          assert {d["name"] for d in documents["documents"]} == expected_names
          for item in documents["documents"]:
              raw = (root / item["name"]).read_bytes()
              assert len(raw) == item["size"]
              assert hashlib.sha256(raw).hexdigest() == item["sha256"]

          execution = json.loads((root / "execution.json").read_text(encoding="utf-8"))
          assert execution["schema"] == "chunkshift.patch-enc-005-g2-execution.v1"
          assert execution["experimentId"] == "PATCH-ENC-005"
          assert execution["githubRunId"] == 37150436770
          assert execution["githubRunNumber"] == 2
          assert execution["githubRunAttempt"] == 1
          assert execution["sourceCommit"] == "489d3f2fe2582cc6251ee2fa87cd23bad1793b01"
          assert execution["platform"] == "linux-x64"
          assert execution["oracleSampleSha256"] == "54061f4efe0969af0d772ddbc6d026fdf58bd4f2776514a9fb098753d062001d"

          verdict = json.loads((root / "verdict.json").read_text(encoding="utf-8"))
          assert verdict["status"] == "MISS"
          assert verdict["nextAction"] == "H6_O_GUARD_ONLY"
          assert verdict["h0SampleCostBytes"] == 974223
          assert verdict["g2SampleCostBytes"] == 974049
          assert verdict["savedBytes"] == 174
          assert verdict["pairPassCount"] == 0
          assert verdict["rowCount"] == 256
          assert verdict["improvedRows"] == 11
          assert verdict["outsideRadiusWinners"] == 11
          PY

          mkdir -p /tmp/g2-evidence/recomputed
          python3 benchmarks/scripts/evaluate_patch_enc_005_g2.py \
            --sample docs/research/results/data/PATCH-ENC-005-G2-SAMPLE-20261003-001/sample.json \
            --lock docs/research/results/data/PATCH-ENC-005-G2-SAMPLE-20261003-001/lock.json \
            --oracle /tmp/g2-evidence/raw/oracle.json \
            --output-dir /tmp/g2-evidence/recomputed
          cmp /tmp/g2-evidence/raw/verdict.json /tmp/g2-evidence/recomputed/verdict.json
          cmp /tmp/g2-evidence/raw/summary.md /tmp/g2-evidence/recomputed/summary.md

      - name: Commit durable G2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dest=docs/research/results/data/PATCH-ENC-005-G2-EVIDENCE-20261003-001
          mkdir -p "$dest"
          cp /tmp/g2-evidence/raw/oracle.json "$dest/oracle.json"
          cp /tmp/g2-evidence/raw/verdict.json "$dest/verdict.json"
          cp /tmp/g2-evidence/raw/summary.md "$dest/summary.md"
          cp /tmp/g2-evidence/raw/execution.json "$dest/execution.json"
          cp /tmp/g2-evidence/raw/documents.json "$dest/documents.json"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          zip_path = Path("/tmp/g2-evidence/artifact.zip")
          raw = zip_path.read_bytes()
          meta = json.loads(subprocess.check_output(
              ["gh", "api", "repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/artifacts/11284200988"],
              text=True,
          ))
          manifest = {
              "schema": "chunkshift.patch-enc-005-g2-artifacts.v1",
              "experimentId": "PATCH-ENC-005",
              "githubRunId": 37150436770,
              "sourceCommit": "489d3f2fe2582cc6251ee2fa87cd23bad1793b01",
              "artifacts": [
                  {
                      "id": 11284200988,
                      "name": "patch-enc-005-g2-489d3f2fe2582cc6251ee2fa87cd23bad1793b01",
                      "sizeInBytes": meta["size_in_bytes"],
                      "expiresAt": meta["expires_at"],
                      "zipSha256": hashlib.sha256(raw).hexdigest(),
                  }
              ],
          }
          out = Path("docs/research/results/data/PATCH-ENC-005-G2-EVIDENCE-20261003-001/artifacts.json")
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "docs(research): import PATCH-ENC-005 G2 evidence"
          git push origin HEAD:research/181-g2-evidence
