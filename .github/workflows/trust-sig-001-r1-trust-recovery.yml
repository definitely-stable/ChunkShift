name: TRUST-SIG-001 R1 trust recovery model

# Separate, PR-only logical root/cursor gate. NO real trust persistence or updater.
on:
  pull_request:
    paths:
      - "benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeTrustR1Model.cs"
      - "benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeTrustR1ModelTests.cs"
      - "docs/benchmarks/TRUST-SIG-001-R1-TRUST-RECOVERY-PROTOCOL.md"
      - ".github/workflows/trust-sig-001-r1-trust-recovery.yml"

permissions:
  contents: read

jobs:
  logical-recovery:
    name: R1 root continuity and recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore benchmark solution
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
      - name: Build benchmark solution Release
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Exercise root threshold, rollback and crash-boundary cases
        run: dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~PatchTreeTrustR1ModelTests
      - name: Explicit limits
        shell: bash
        run: |
          echo "R1 is a pure model. No cryptographic root-signature verification, trusted persistent cursor, TUF implementation or crash-durable filesystem publisher." >> "$GITHUB_STEP_SUMMARY"
