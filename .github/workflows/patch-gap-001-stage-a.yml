name: PATCH-GAP-001 Stage A inventory

on:
  workflow_run:
    workflows:
      - PATCH-GAP-001 Puffin toolchain
    types:
      - completed
  workflow_dispatch:
    inputs:
      run-date:
        description: "Frozen RunId UTC date (YYYYMMDD)"
        required: true
        type: string
      puffin-producer-run-id:
        description: "Successful PATCH-GAP-001 Puffin toolchain workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: patch-gap-001-stage-a-main
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  PUFFIN_COMMIT: 343e23db1b4d81045e91a10244244893f5acd73b
  PUFFIN_TAG: android-17.0.0_r1
  PUFFIN_ADAPTER: benchmarks/tools/patch_gap_puffin_locator.cc
  PUFFIN_PRODUCER_WORKFLOW: .github/workflows/patch-gap-001-puffin-toolchain.yml
  PUFFIN_ARTIFACT_NAME: patch-gap-001-puffin-toolchain
  PROTOCOL_COMMIT: 5372678ae8451a71cc95eb24f30855cbbd7e0633

jobs:
  inventory:
    name: inventory-only
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DISPATCH_RUN_DATE: ${{ inputs.run-date }}
      DISPATCH_PRODUCER_RUN_ID: ${{ inputs.puffin-producer-run-id }}
      AUTO_PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      AUTO_PRODUCER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      AUTO_PRODUCER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
      AUTO_PRODUCER_EVENT: ${{ github.event.workflow_run.event }}
      AUTO_PRODUCER_BRANCH: ${{ github.event.workflow_run.head_branch }}
      AUTO_PRODUCER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      AUTO_PRODUCER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - name: Validate Stage-A evidence identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "PATCH-GAP-001 Stage A evidence rejects GitHub workflow re-runs." >&2
            exit 2
          fi
          if (( GITHUB_RUN_NUMBER > 999 )); then
            echo "RunId NNN supports workflow run numbers 001..999." >&2
            exit 2
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual PATCH-GAP-001 Stage A evidence must run from main." >&2
              exit 2
            fi
            source_commit="$GITHUB_SHA"
            run_date="$DISPATCH_RUN_DATE"
            producer_run_id="$DISPATCH_PRODUCER_RUN_ID"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$AUTO_PRODUCER_EVENT" != "push" ||
                  "$AUTO_PRODUCER_BRANCH" != "main" ||
                  "$AUTO_PRODUCER_CONCLUSION" != "success" ||
                  "$AUTO_PRODUCER_ATTEMPT" != "1" ]]; then
              echo "Automatic Stage-A requires a successful first-attempt producer push run on main." >&2
              exit 2
            fi
            source_commit="$AUTO_PRODUCER_HEAD_SHA"
            producer_run_id="$AUTO_PRODUCER_RUN_ID"
            run_date="$(
              python3 - "$AUTO_PRODUCER_CREATED_AT" <<'PY'
          import datetime as dt
          import sys

          value = sys.argv[1].replace("Z", "+00:00")
          timestamp = dt.datetime.fromisoformat(value).astimezone(dt.timezone.utc)
          print(timestamp.strftime("%Y%m%d"))
          PY
            )"
          else
            echo "Unsupported Stage-A event: $GITHUB_EVENT_NAME" >&2
            exit 2
          fi

          python3 - "$run_date" "$producer_run_id" "$source_commit" <<'PY'
          import datetime as dt
          import re
          import sys

          run_date, producer_run_id, source_commit = sys.argv[1:]
          if not re.fullmatch(r"\d{8}", run_date):
              raise SystemExit("run-date must be YYYYMMDD")
          dt.datetime.strptime(run_date, "%Y%m%d")
          if not re.fullmatch(r"[1-9]\d*", producer_run_id):
              raise SystemExit("puffin-producer-run-id must be a positive integer")
          if not re.fullmatch(r"[0-9a-f]{40}", source_commit.lower()):
              raise SystemExit("source commit must be a 40-character SHA-1")
          PY

          sequence="$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          short_commit="${source_commit:0:7}"
          run_id="PATCH-GAP-001/RUN-${run_date}-${sequence}-${short_commit}-linux-x64"
          {
            echo "SOURCE_COMMIT=$source_commit"
            echo "RUN_DATE=$run_date"
            echo "PUFFIN_PRODUCER_RUN_ID=$producer_run_id"
            echo "RUN_ID=$run_id"
            echo "CORPUS_ROOT=$HOME/patch-corpus"
            echo "OUT=$RUNNER_TEMP/patch-gap-001-stage-a"
          } >> "$GITHUB_ENV"
          echo "PATCH-GAP Stage-A RunId: $run_id"

      - name: Checkout tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify clean tested checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"


      - name: Resolve and verify pinned Puffin producer artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for command in gh curl python3 sha256sum unzip git; do
            command -v "$command" >/dev/null || {
              echo "Required command is unavailable: $command" >&2
              exit 2
            }
          done

          run_json="$RUNNER_TEMP/puffin-producer-run.json"
          artifacts_json="$RUNNER_TEMP/puffin-producer-artifacts.json"
          tool_dir="$RUNNER_TEMP/puffin-toolchain"
          archive="$RUNNER_TEMP/puffin-toolchain.zip"
          mkdir -p "$tool_dir" "$OUT"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$PUFFIN_PRODUCER_RUN_ID" \
            > "$run_json"

          producer_head_sha="$(
            python3 - "$run_json" "$GITHUB_REPOSITORY" "$PUFFIN_PRODUCER_RUN_ID" "$PUFFIN_PRODUCER_WORKFLOW" <<'PY'
          import json
          import re
          import sys

          path, repository, run_id, workflow_path = sys.argv[1:]
          document = json.load(open(path, encoding="utf-8"))
          expected_id = int(run_id)

          checks = {
              "id": document.get("id") == expected_id,
              "repository": document.get("repository", {}).get("full_name") == repository,
              "event": document.get("event") in ("workflow_dispatch", "push"),
              "status": document.get("status") == "completed",
              "conclusion": document.get("conclusion") == "success",
              "attempt": document.get("run_attempt") == 1,
              "branch": document.get("head_branch") == "main",
              "workflow": document.get("path") == workflow_path,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("producer run contract mismatch: " + ", ".join(failed))

          head_sha = str(document.get("head_sha") or "").lower()
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("producer run has malformed head_sha")
          print(head_sha)
          PY
          )"

          producer_event="$(
            python3 - "$run_json" <<'PY'
          import json
          import sys
          document = json.load(open(sys.argv[1], encoding="utf-8"))
          print(document.get("event") or "")
          PY
          )"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$producer_event" != "push" || "$producer_head_sha" != "$SOURCE_COMMIT" ]]; then
              echo "Automatic Stage-A producer identity does not match the triggering main push." >&2
              exit 2
            fi
          elif [[ "$producer_event" != "workflow_dispatch" ]]; then
            echo "Manual Stage-A requires a workflow_dispatch Puffin producer." >&2
            exit 2
          fi

          if ! git merge-base --is-ancestor "$producer_head_sha" "$SOURCE_COMMIT"; then
            echo "Puffin producer head is not an ancestor of the Stage-A source commit." >&2
            exit 2
          fi

          producer_workflow_blob="$(git rev-parse "$producer_head_sha:$PUFFIN_PRODUCER_WORKFLOW")"
          consumer_workflow_blob="$(git rev-parse "$SOURCE_COMMIT:$PUFFIN_PRODUCER_WORKFLOW")"
          if [[ "$producer_workflow_blob" != "$consumer_workflow_blob" ]]; then
            echo "Puffin producer workflow changed after the selected producer run." >&2
            exit 2
          fi

          producer_adapter_blob="$(git rev-parse "$producer_head_sha:$PUFFIN_ADAPTER")"
          consumer_adapter_blob="$(git rev-parse "$SOURCE_COMMIT:$PUFFIN_ADAPTER")"
          if [[ "$producer_adapter_blob" != "$consumer_adapter_blob" ]]; then
            echo "Puffin locator adapter changed after the selected producer run." >&2
            exit 2
          fi

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$PUFFIN_PRODUCER_RUN_ID/artifacts?per_page=100" \
            > "$artifacts_json"

          mapfile -t artifact_meta < <(
            python3 - "$artifacts_json" "$PUFFIN_ARTIFACT_NAME" <<'PY'
          import json
          import re
          import sys

          path, expected_name = sys.argv[1:]
          document = json.load(open(path, encoding="utf-8"))
          matches = [
              item for item in document.get("artifacts", [])
              if item.get("name") == expected_name
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one {expected_name!r} artifact, found {len(matches)}"
              )
          artifact = matches[0]
          if artifact.get("expired") is not False:
              raise SystemExit("selected Puffin artifact is expired")
          artifact_id = artifact.get("id")
          size = artifact.get("size_in_bytes")
          digest = str(artifact.get("digest") or "").lower()
          if not isinstance(artifact_id, int) or artifact_id <= 0:
              raise SystemExit("Puffin artifact has invalid id")
          if not isinstance(size, int) or size <= 0 or size > 1024 * 1024 * 1024:
              raise SystemExit("Puffin artifact size is invalid or exceeds 1 GiB")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Puffin artifact is missing a valid GitHub SHA-256 digest")
          print(artifact_id)
          print(digest)
          print(size)
          PY
          )

          artifact_id="${artifact_meta[0]}"
          artifact_digest="${artifact_meta[1]}"
          artifact_size="${artifact_meta[2]}"

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o "$archive"

          actual_artifact_digest="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          if [[ "$actual_artifact_digest" != "$artifact_digest" ]]; then
            echo "Downloaded Puffin artifact digest mismatch." >&2
            exit 2
          fi

          python3 - "$archive" "$tool_dir" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          seen = set()
          total = 0

          with zipfile.ZipFile(archive) as bundle:
              for info in bundle.infolist():
                  raw = info.filename
                  if "\\" in raw or "\x00" in raw:
                      raise SystemExit(f"unsafe artifact member name: {raw!r}")
                  path = pathlib.PurePosixPath(raw)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe artifact member path: {raw!r}")
                  normalized = path.as_posix().rstrip("/")
                  if normalized:
                      if normalized in seen:
                          raise SystemExit(f"duplicate artifact member: {normalized}")
                      seen.add(normalized)
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"symlink artifact member is forbidden: {raw!r}")
                  total += info.file_size
                  if total > 1024 * 1024 * 1024:
                      raise SystemExit("expanded Puffin artifact exceeds 1 GiB")
              bundle.extractall(destination)
          PY

          required=(
            "$tool_dir/SHA256SUMS"
            "$tool_dir/bin/puffin"
            "$tool_dir/build-provenance.json"
            "$tool_dir/build-command.txt"
            "$tool_dir/adapter-source.cc"
            "$tool_dir/puffin-source-identity.txt"
            "$tool_dir/puffin-help.txt"
            "$tool_dir/ldd-packaged.txt"
            "$tool_dir/package-versions.txt"
            "$tool_dir/compiler-version.txt"
            "$tool_dir/host-environment.txt"
          )
          for path in "${required[@]}"; do
            test -s "$path"
          done

          (
            cd "$tool_dir"
            sha256sum -c SHA256SUMS
          )

          cmp "$tool_dir/adapter-source.cc" "$GITHUB_WORKSPACE/$PUFFIN_ADAPTER"

          mapfile -t producer_meta < <(
            python3 - \
              "$tool_dir" \
              "$producer_head_sha" \
              "$PUFFIN_PRODUCER_RUN_ID" \
              "$PUFFIN_TAG" \
              "$PUFFIN_COMMIT" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root_text, producer_head_sha, producer_run_id, puffin_tag, puffin_commit = sys.argv[1:]
          root = pathlib.Path(root_text)
          document = json.loads(
              (root / "build-provenance.json").read_text(encoding="utf-8")
          )

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source_identity = {}
          for line in (root / "puffin-source-identity.txt").read_text(encoding="utf-8").splitlines():
              key, sep, value = line.partition("=")
              if not sep or not key or not value:
                  raise SystemExit("malformed puffin-source-identity.txt")
              source_identity[key] = value

          source_archive_sha = source_identity.get("archiveSha256", "").lower()
          if source_identity.get("tag") != puffin_tag:
              raise SystemExit("Puffin source identity has the wrong tag")
          if source_identity.get("commit", "").lower() != puffin_commit.lower():
              raise SystemExit("Puffin source identity has the wrong commit")
          if not re.fullmatch(r"[0-9a-f]{64}", source_archive_sha):
              raise SystemExit("Puffin source identity has malformed archive SHA-256")

          expected = {
              "schema": "chunkshift.patch-gap-puffin-toolchain.v2",
              "chunkShiftSourceCommit": producer_head_sha.lower(),
              "producerRunId": int(producer_run_id),
              "runnerImage": "ubuntu-24.04",
              "puffinTag": puffin_tag,
              "puffinCommit": puffin_commit.lower(),
              "sourceArchiveSha256": source_archive_sha,
              "adapterSha256": sha(root / "adapter-source.cc"),
              "binarySha256": sha(root / "bin/puffin"),
              "buildCommandSha256": sha(root / "build-command.txt"),
              "helpOutputSha256": sha(root / "puffin-help.txt"),
              "lddSha256": sha(root / "ldd-packaged.txt"),
              "packageVersionsSha256": sha(root / "package-versions.txt"),
              "compilerVersionSha256": sha(root / "compiler-version.txt"),
              "hostEnvironmentSha256": sha(root / "host-environment.txt"),
          }
          mismatches = [
              key for key, value in expected.items()
              if document.get(key) != value
          ]
          if mismatches:
              raise SystemExit(
                  "Puffin build provenance mismatch: " + ", ".join(mismatches)
              )

          print(source_archive_sha)
          print(expected["adapterSha256"])
          PY
          )

          source_archive_sha="${producer_meta[0]}"
          adapter_sha="${producer_meta[1]}"

          chmod 0755 "$tool_dir/bin/puffin"
          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin" \
            LD_LIBRARY_PATH="$tool_dir/lib64" \
            "$tool_dir/bin/puffin" --help \
            > "$RUNNER_TEMP/puffin-consumer-help.txt" 2>&1
          cmp "$tool_dir/puffin-help.txt" "$RUNNER_TEMP/puffin-consumer-help.txt"

          binary_sha="$(sha256sum "$tool_dir/bin/puffin" | cut -d' ' -f1)"
          provenance_sha="$(sha256sum "$tool_dir/build-provenance.json" | cut -d' ' -f1)"

          python3 - \
            "$OUT/toolchain-producer.json" \
            "$GITHUB_REPOSITORY" \
            "$SOURCE_COMMIT" \
            "$PUFFIN_PRODUCER_WORKFLOW" \
            "$producer_workflow_blob" \
            "$producer_adapter_blob" \
            "$PUFFIN_PRODUCER_RUN_ID" \
            "$producer_head_sha" \
            "$PUFFIN_ARTIFACT_NAME" \
            "$artifact_id" \
            "$artifact_digest" \
            "$artifact_size" \
            "$binary_sha" \
            "$provenance_sha" \
            "$PUFFIN_TAG" \
            "$PUFFIN_COMMIT" \
            "$source_archive_sha" \
            "$adapter_sha" <<'PY'
          import json
          import pathlib
          import sys

          (
              output,
              repository,
              consumer_source_commit,
              workflow_path,
              workflow_blob_sha,
              adapter_blob_sha,
              producer_run_id,
              producer_head_sha,
              artifact_name,
              artifact_id,
              artifact_digest,
              artifact_size,
              binary_sha,
              provenance_sha,
              puffin_tag,
              puffin_commit,
              source_archive_sha,
              adapter_sha,
          ) = sys.argv[1:]

          document = {
              "schema": "chunkshift.patch-gap-puffin-producer-lineage.v2",
              "repository": repository,
              "consumerSourceCommit": consumer_source_commit.lower(),
              "producerWorkflow": workflow_path,
              "producerWorkflowBlobSha": workflow_blob_sha,
              "producerAdapterBlobSha": adapter_blob_sha,
              "producerRunId": int(producer_run_id),
              "producerHeadSha": producer_head_sha.lower(),
              "artifactName": artifact_name,
              "artifactId": int(artifact_id),
              "artifactDigest": artifact_digest,
              "artifactSizeBytes": int(artifact_size),
              "binarySha256": binary_sha,
              "buildProvenanceSha256": provenance_sha,
              "runnerImage": "ubuntu-24.04",
              "puffinTag": puffin_tag,
              "puffinCommit": puffin_commit.lower(),
              "sourceArchiveSha256": source_archive_sha,
              "adapterSha256": adapter_sha,
          }
          pathlib.Path(output).write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

          {
            echo "PUFFIN_BIN=$tool_dir/bin/puffin"
            echo "PUFFIN_BUILD_PROVENANCE=$tool_dir/build-provenance.json"
            echo "PUFFIN_BUILD_COMMAND_FILE=$tool_dir/build-command.txt"
            echo "PUFFIN_PRODUCER_HEAD_SHA=$producer_head_sha"
            echo "PUFFIN_ARTIFACT_ID=$artifact_id"
            echo "PUFFIN_ARTIFACT_DIGEST=$artifact_digest"
            echo "PUFFIN_BINARY_SHA256=$binary_sha"
            echo "PUFFIN_BUILD_PROVENANCE_SHA256=$provenance_sha"
            echo "PUFFIN_SOURCE_ARCHIVE_SHA256=$source_archive_sha"
            echo "PUFFIN_ADAPTER_SHA256=$adapter_sha"
            echo "PUFFIN_LIB_DIR=$tool_dir/lib64"
          } >> "$GITHUB_ENV"

      - name: Restore frozen patch-corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize and lock frozen patch corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$CORPUS_ROOT" \
            --sources "$HOME/patch-corpus/sources" \
            --download \
            --lock

      - name: Restore benchmark lab
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build benchmark lab
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Run structural inventory prepass
        shell: bash
        run: |
          set -euo pipefail
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          prepass="$OUT/prepass"
          mkdir -p "$prepass"
          dotnet "$dll" patch-lab gap inventory \
            --corpus "$CORPUS_ROOT" \
            --g4-output "$prepass/g4.json" \
            --g5-structural-output "$prepass/g5-structural.json" \
            --run-output "$prepass/inventory-run.json" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID"

      - name: Materialize frozen Puffin source identity
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/puffin-source"
          git clone \
            --depth=1 \
            --branch "$PUFFIN_TAG" \
            --single-branch \
            https://android.googlesource.com/platform/external/puffin \
            "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$PUFFIN_COMMIT"
          test -z "$(git -C "$source_dir" status --porcelain=v1 --untracked-files=normal)"

          actual_source_archive_sha="$(
            git -C "$source_dir" archive --format=tar HEAD \
              | sha256sum | cut -d' ' -f1
          )"
          if [[ "$actual_source_archive_sha" != "$PUFFIN_SOURCE_ARCHIVE_SHA256" ]]; then
            echo "Pinned Puffin source archive SHA-256 differs from producer provenance." >&2
            exit 2
          fi

          actual_adapter_sha="$(sha256sum "$GITHUB_WORKSPACE/$PUFFIN_ADAPTER" | cut -d' ' -f1)"
          if [[ "$actual_adapter_sha" != "$PUFFIN_ADAPTER_SHA256" ]]; then
            echo "Pinned Puffin adapter SHA-256 differs from producer provenance." >&2
            exit 2
          fi

          echo "PUFFIN_SOURCE=$source_dir" >> "$GITHUB_ENV"

      - name: Collect Puffin structural locator evidence
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ env.PUFFIN_LIB_DIR }}
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/collect_patch_gap_puffin_locator.py \
            --corpus "$CORPUS_ROOT" \
            --structural "$OUT/prepass/g5-structural.json" \
            --puffin "$PUFFIN_BIN" \
            --output "$OUT/prepass/puffin-locator.json" \
            --source-commit "$SOURCE_COMMIT" \
            --puffin-source "$PUFFIN_SOURCE" \
            --build-provenance "$PUFFIN_BUILD_PROVENANCE" \
            --build-command "$(cat "$PUFFIN_BUILD_COMMAND_FILE")" \
            --logical-artifact "tools/puffin/android-17.0.0_r1/puffin"

      - name: Finalize fail-closed Stage-A inventory
        shell: bash
        run: |
          set -euo pipefail
          dll=benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          dotnet "$dll" patch-lab gap finalize-inventory \
            --corpus "$CORPUS_ROOT" \
            --g4 "$OUT/prepass/g4.json" \
            --g5-structural "$OUT/prepass/g5-structural.json" \
            --puffin-locator "$OUT/prepass/puffin-locator.json" \
            --evidence-dir "$OUT/evidence" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID"

      - name: Verify complete inventory-only evidence bundle
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "$OUT/prepass/g4.json"
            "$OUT/prepass/g5-structural.json"
            "$OUT/prepass/puffin-locator.json"
            "$OUT/prepass/inventory-run.json"
            "$OUT/toolchain-producer.json"
            "$OUT/evidence/subsets/g4.json"
            "$OUT/evidence/subsets/g5.json"
            "$OUT/evidence/evidence-input/g4.json"
            "$OUT/evidence/evidence-input/g5-structural.json"
            "$OUT/evidence/evidence-input/puffin-locator.json"
            "$OUT/evidence/tool-provenance/puffin-build-provenance.bin"
            "$OUT/evidence/inputs.json"
            "$OUT/evidence/tools.json"
            "$OUT/evidence/inventory-lock-run.json"
          )
          for path in "${required[@]}"; do
            test -s "$path"
          done

          cmp "$OUT/prepass/g4.json" "$OUT/evidence/evidence-input/g4.json"
          cmp "$OUT/prepass/g5-structural.json" "$OUT/evidence/evidence-input/g5-structural.json"
          cmp "$OUT/prepass/puffin-locator.json" "$OUT/evidence/evidence-input/puffin-locator.json"
          cmp "$PUFFIN_BUILD_PROVENANCE" "$OUT/evidence/tool-provenance/puffin-build-provenance.bin"
          cmp "$OUT/prepass/g4.json" "$OUT/evidence/subsets/g4.json"

          python3 - "$OUT" "$PROTOCOL_COMMIT" "$SOURCE_COMMIT" "$RUN_ID" "$PUFFIN_PRODUCER_RUN_ID" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          protocol_commit = sys.argv[2]
          source_commit = sys.argv[3].lower()
          run_id = sys.argv[4]
          producer_run_id = int(sys.argv[5])

          def load(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          g4_path = out / "evidence/subsets/g4.json"
          g5_path = out / "evidence/subsets/g5.json"
          run_path = out / "evidence/inventory-lock-run.json"
          g4 = load(g4_path)
          g5 = load(g5_path)
          run = load(run_path)
          producer = load(out / "toolchain-producer.json")
          if producer.get("producerRunId") != producer_run_id:
              raise SystemExit("toolchain-producer.json has the wrong producerRunId")
          if producer.get("consumerSourceCommit") != source_commit:
              raise SystemExit("toolchain-producer.json has the wrong consumer source commit")

          for name, document in (("G4", g4), ("G5", g5)):
              if document["protocolCommit"] != protocol_commit:
                  raise SystemExit(f"{name}: wrong protocolCommit")
              if document["sourceCommit"].lower() != source_commit:
                  raise SystemExit(f"{name}: wrong sourceCommit")
              for field in ("calibrationSha256", "evaluationSha256"):
                  value = document[field]
                  if len(value) != 64:
                      raise SystemExit(f"{name}: malformed {field}")

          provenance = run.get("provenance", {})
          if provenance.get("runId") != run_id:
              raise SystemExit("inventory-lock-run.json has the wrong RunId")

          summary = {
              "schema": "chunkshift.patch-gap-stage-a-summary.v1",
              "experimentId": "PATCH-GAP-001",
              "runId": run_id,
              "protocolCommit": protocol_commit,
              "sourceCommit": source_commit,
              "puffinProducer": producer,
              "g4": {
                  "rows": len(g4["rows"]),
                  "calibrationSha256": g4["calibrationSha256"],
                  "evaluationSha256": g4["evaluationSha256"],
                  "fileSha256": sha256(g4_path),
              },
              "g5": {
                  "rows": len(g5["rows"]),
                  "puffinSupportedRows": sum(
                      1 for row in g5["rows"] if row.get("puffinSupported") is True
                  ),
                  "calibrationSha256": g5["calibrationSha256"],
                  "evaluationSha256": g5["evaluationSha256"],
                  "fileSha256": sha256(g5_path),
              },
          }
          summary_path = out / "stage-a-summary.json"
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          md = [
              "### PATCH-GAP-001 Stage-A inventory",
              "",
              f"- RunId: `{run_id}`",
              f"- sourceCommit: `{source_commit}`",
              f"- Puffin producer run: `{producer['producerRunId']}`",
              f"- Puffin producer head: `{producer['producerHeadSha']}`",
              f"- Puffin artifact digest: `{producer['artifactDigest']}`",
              f"- Puffin binary SHA-256: `{producer['binarySha256']}`",
              f"- G4 rows: {summary['g4']['rows']}",
              f"- G4 calibration SHA-256: `{summary['g4']['calibrationSha256']}`",
              f"- G4 evaluation SHA-256: `{summary['g4']['evaluationSha256']}`",
              f"- G5 rows: {summary['g5']['rows']}",
              f"- G5 Puffin-supported rows: {summary['g5']['puffinSupportedRows']}",
              f"- G5 calibration SHA-256: `{summary['g5']['calibrationSha256']}`",
              f"- G5 evaluation SHA-256: `{summary['g5']['evaluationSha256']}`",
              "",
              "Inventory only: no G1/G2/G3/G4/G5 size codec or external reference patch lane ran.",
          ]
          with Path(sys.argv[1]).joinpath("stage-a-summary.md").open(
              "w", encoding="utf-8", newline="\n"
          ) as stream:
              stream.write("\n".join(md) + "\n")
          PY

          cat "$OUT/stage-a-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage-A inventory evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-gap-001-stage-a-${{ github.run_number }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90

      - name: Record raw artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo
            echo "- Actions artifact id: \`$ARTIFACT_ID\`"
            echo "- Actions artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Retention: 90 days"
            echo
            echo "The follow-up evidence PR must commit the reviewed compact G4/G5 manifests and durable artifact lineage before any G4/G5 size run."
          } >> "$GITHUB_STEP_SUMMARY"
