name: Verify lab dataset

# One-off: copies the compact CORE-VERIFY-001 dataset of run 36515572552 into
# docs/research/results/data/ on this branch. Removed again before merge.
on:
  push:
    branches: [perf/186-verify-runs]
    paths: [.github/workflows/verify-lab-dataset.yml]

permissions:
  contents: write
  actions: read

jobs:
  dataset:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/186-verify-runs

      - name: Download evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verify-lab-*
          path: evidence
          run-id: 36515572552
          github-token: ${{ github.token }}

      - name: Write the compact dataset
        shell: bash
        run: |
          set -euo pipefail
          out=docs/research/results/data/CORE-VERIFY-001-20260929
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          import csv, glob, json, os, shutil, sys
          out = sys.argv[1]
          shutil.copy("evidence/verify-lab-decision/decision.md", f"{out}/decision.md")
          decision = json.load(open("evidence/verify-lab-decision/decision.json"))
          json.dump(decision, open(f"{out}/decision.json", "w"), indent=1, sort_keys=True)
          runs, rows = [], []
          for path in sorted(glob.glob("evidence/verify-lab-*-*/run-*.json")):
              run = json.load(open(path))
              meta = {k: v for k, v in run.items() if k not in ("samples", "aggregates")}
              meta["file"] = os.path.basename(path)
              meta["sampleCount"] = len(run["samples"])
              runs.append(meta)
              for s in run["samples"]:
                  m = s.get("measurement") or {}
                  rows.append([run["platform"], run["runId"], s["workload"], s["suite"], s["mode"], s["lane"],
                               s["concurrency"], s["repetition"], s["order"], m.get("bytes"), m.get("files"),
                               m.get("wallSeconds"), m.get("cpuSeconds"), m.get("allocatedBytes"),
                               m.get("peakWorkingSetBytes"), m.get("valid"), s.get("error") or ""])
          json.dump(runs, open(f"{out}/runs.json", "w"), indent=1, sort_keys=True)
          with open(f"{out}/samples.csv", "w", newline="") as f:
              w = csv.writer(f, lineterminator="\n")
              w.writerow(["platform", "runId", "workload", "suite", "mode", "lane", "concurrency", "repetition",
                          "order", "bytes", "files", "wallSeconds", "cpuSeconds", "allocatedBytes",
                          "peakWorkingSetBytes", "valid", "error"])
              w.writerows(rows)
          for path in sorted(glob.glob("evidence/verify-lab-*-*/*-oracle-*.json")):
              shutil.copy(path, f"{out}/{os.path.basename(path)}")
          print(len(runs), "runs,", len(rows), "samples")
          PY
          ls -la "$out"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MrFr3di
          git config user.email ynagi-wm@mail.ru
          git add docs/research/results/data/CORE-VERIFY-001-20260929
          git commit -m "perf(bench): add the CORE-VERIFY-001 dataset of run 36515572552"
          git push origin HEAD:perf/186-verify-runs
