name: PATCH-META-001 G0 mechanics

# Standalone cache mechanics only; not production create or an adoption gate.
on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/scripts/patch_meta_001_g0.py'
      - 'benchmarks/scripts/test_patch_meta_001_g0.py'
      - 'docs/benchmarks/PATCH-META-001-G0-PROTOCOL.md'
      - '.github/workflows/patch-meta-001-g0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g0-mechanics:
    name: g0-unit-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-2025, platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Determinism, corruption, invalidation and bounds
        env:
          PYTHONPATH: benchmarks/scripts
        run: python -m unittest -v benchmarks/scripts/test_patch_meta_001_g0.py
