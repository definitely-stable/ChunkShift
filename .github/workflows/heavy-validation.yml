name: Heavy validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Every input that can change the built package, its NativeAOT behavior or
    # the independent vectors must reach the AOT/ARM64/cross-arch lanes.
    # Keep this list coarse: a narrow per-directory list silently skipped
    # Primitives/**, project files and SDK/build configuration.
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "tools/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".editorconfig"
      - "*.slnx"
      - "docs/benchmarks/**"
      - "docs/architecture/CSM-*.md"
      - "docs/architecture/PROFILE-FINGERPRINT-V1.md"
      - "docs/architecture/FASTCDC-*.md"
      - "docs/architecture/FASTCDC-*.txt"
      - ".github/workflows/heavy-validation.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: heavy-validation
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  native:
    name: native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PACKAGE_VERSION: 0.0.0-heavy.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ChunkShift.slnx
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet build ChunkShift.slnx -c Release --no-restore
          dotnet test ChunkShift.slnx -c Release --no-build --no-restore

      - name: Verify independent FastCDC vector
        shell: bash
        run: python3 tools/reference/fastcdc_reference.py --verify

      - name: Verify CSM vectors with the independent generator and decoder
        shell: bash
        run: python3 tools/csm-fixtures/generate.py --verify tests/ChunkShift.Tests/Fixtures/CsmV1

      - name: Extended CSM reader fuzz with differential decoder check
        shell: bash
        env:
          CHUNKSHIFT_FUZZ_ITERATIONS: 5000
          CHUNKSHIFT_FUZZ_DUMP: ${{ runner.temp }}/csm-fuzz
        run: |
          set -euo pipefail
          # Fresh seeds per run explore new inputs; any failure prints its seed
          # and iteration, so it replays with CHUNKSHIFT_FUZZ_SEEDS.
          base=$(( ${{ github.run_number }} * 16 ))
          export CHUNKSHIFT_FUZZ_SEEDS="$base,$((base + 1)),$((base + 2)),$((base + 3))"
          echo "fuzz seeds: $CHUNKSHIFT_FUZZ_SEEDS"
          dotnet test tests/ChunkShift.Tests -c Release --no-build --no-restore -f net10.0 \
            --filter "FullyQualifiedName~ChunkShift.Tests.Fuzzing"
          python3 tools/csm-fixtures/decode.py --compare "$CHUNKSHIFT_FUZZ_DUMP"

      - name: Verify external fastcdc-rs 5.0.0 vector
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: cargo run --locked --manifest-path tools/reference/fastcdc-rs-probe/Cargo.toml --release

      - name: Pack
        run: dotnet pack src/ChunkShift/ChunkShift.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion=${PACKAGE_VERSION}

      - name: Package smoke (JIT)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/package-smoke
          dotnet run --project tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -- --evidence "artifacts/package-smoke/jit-${{ matrix.rid }}.txt"

      - name: NativeAOT package-consumer publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tests/ChunkShift.PackageSmoke/ChunkShift.PackageSmoke.csproj -c Release \
            -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:PublishTrimmed=true \
            -p:ChunkShiftPackageVersion="${PACKAGE_VERSION}" \
            -p:RestoreAdditionalProjectSources="${GITHUB_WORKSPACE}/artifacts/packages" \
            -o artifacts/aot-publish

      - name: Run NativeAOT smoke and compare with JIT
        shell: bash
        run: |
          set -euo pipefail
          ./artifacts/aot-publish/ChunkShift.PackageSmoke \
            --evidence "artifacts/package-smoke/aot-${{ matrix.rid }}.txt"
          diff -u \
            "artifacts/package-smoke/jit-${{ matrix.rid }}.txt" \
            "artifacts/package-smoke/aot-${{ matrix.rid }}.txt"

      - name: Larger-than-memory source in an isolated, memory-limited process
        shell: bash
        run: |
          set -euo pipefail
          smoke="${GITHUB_WORKSPACE}/artifacts/aot-publish/ChunkShift.PackageSmoke"
          source="${RUNNER_TEMP}/large-source.bin"

          # 4 GiB file, 128 MiB cgroup limit, no swap: materializing the source
          # (or anything proportional to it) gets the process OOM-killed.
          "$smoke" --generate "$source" 4294967296
          sudo systemd-run --scope --quiet \
            -p MemoryMax=128M -p MemorySwapMax=0 \
            --uid="$(id -u)" --gid="$(id -g)" \
            "$smoke" --large-source "$source" --manifest "${RUNNER_TEMP}/large-source.csm" \
            --evidence "${GITHUB_WORKSPACE}/artifacts/package-smoke/large-${{ matrix.rid }}.txt"
          rm -f "$source"

      - name: Upload package-smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-smoke-${{ matrix.rid }}
          path: artifacts/package-smoke/
          if-no-files-found: error
          retention-days: 30

      - name: Build and test benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
          dotnet test benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-build --no-restore

      - name: Run deterministic lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            lab \
            --corpus benchmarks/corpus/corpus.v1.json \
            --experiments benchmarks/experiments/experiments.v2.json \
            --output "artifacts/benchmarks/lab-${{ matrix.rid }}.json"

      - name: Upload lab result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-lab-${{ matrix.rid }}
          path: artifacts/benchmarks/lab-${{ matrix.rid }}.json
          if-no-files-found: error
          retention-days: 30

  determinism:
    name: cross-arch-determinism
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore benchmark lab
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build benchmark lab
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Download x64 evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: benchmark-lab-linux-x64
          path: artifacts/compare/x64

      - name: Download arm64 evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: benchmark-lab-linux-arm64
          path: artifacts/compare/arm64

      - name: Download package-smoke evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: package-smoke-*
          path: artifacts/package-smoke
          merge-multiple: true

      - name: Compare public-API evidence (CSM identities, chunk ids)
        shell: bash
        run: |
          set -euo pipefail
          # NativeAOT x64 vs NativeAOT ARM64; JIT vs AOT was compared per architecture.
          diff -u \
            artifacts/package-smoke/aot-linux-x64.txt \
            artifacts/package-smoke/aot-linux-arm64.txt
          diff -u \
            artifacts/package-smoke/large-linux-x64.txt \
            artifacts/package-smoke/large-linux-arm64.txt
          cat artifacts/package-smoke/aot-linux-x64.txt artifacts/package-smoke/large-linux-x64.txt

      - name: Compare deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            compare \
            --left artifacts/compare/x64/lab-linux-x64.json \
            --right artifacts/compare/arm64/lab-linux-arm64.json
