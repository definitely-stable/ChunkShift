name: Heavy validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "docs/benchmarks/**"
      - "src/ChunkShift/*.cs"
      - "src/ChunkShift/Hashing/**"
      - "src/ChunkShift/Chunking/**"
      - "src/ChunkShift/Profiles/**"
      - "docs/architecture/PROFILE-FINGERPRINT-V1.md"
      - "docs/architecture/FASTCDC-*.md"
      - "docs/architecture/FASTCDC-*.txt"
      - "tools/reference/fastcdc_reference.py"
      - "tools/reference/fastcdc-rs-probe/**"
      - ".github/workflows/heavy-validation.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: heavy-validation
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  native:
    name: native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_VERSION: 0.0.0-heavy.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ChunkShift.slnx
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet build ChunkShift.slnx -c Release --no-restore
          dotnet test ChunkShift.slnx -c Release --no-build --no-restore

      - name: Verify independent FastCDC vector
        shell: bash
        run: python3 tools/reference/fastcdc_reference.py --verify

      - name: Verify external fastcdc-rs 5.0.0 vector
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: cargo run --locked --manifest-path tools/reference/fastcdc-rs-probe/Cargo.toml --release

      - name: Pack
        run: dotnet pack src/ChunkShift/ChunkShift.csproj -c Release --no-build --no-restore -o artifacts/packages -p:PackageVersion=${PACKAGE_VERSION}

      - name: NativeAOT package-consumer smoke
        shell: bash
        run: |
          set -euo pipefail
          dotnet new console --name AotConsumer --output artifacts/aot-consumer --framework net10.0 --no-restore
          dotnet add artifacts/aot-consumer/AotConsumer.csproj package ChunkShift --version "${PACKAGE_VERSION}" --source "${GITHUB_WORKSPACE}/artifacts/packages"
          cat > artifacts/aot-consumer/Program.cs <<'CS'
          using ChunkShift;
          using ChunkShift.Primitives;
          
          var bytes = new byte[768 * 1024];
          uint state = 0xC0FFEE42u;
          for (int index = 0; index < bytes.Length; index++)
          {
              state ^= state << 13;
              state ^= state >> 17;
              state ^= state << 5;
              bytes[index] = (byte)state;
          }
          
          foreach (HashSuiteId suite in new[] { HashSuiteIds.Blake3256V1, HashSuiteIds.Sha256V1 })
          {
              using var source = new MemoryStream(bytes, writable: false);
              long covered = 0;
              long count = 0;
          
              await ChunkScanner.ScanAsync(
                  source,
                  (chunk, content, _) =>
                  {
                      if (chunk.Index != count ||
                          chunk.Offset != covered ||
                          chunk.Length != content.Length ||
                          chunk.Length <= 0)
                      {
                          throw new InvalidOperationException("ChunkShift scanner package smoke invariant failed.");
                      }
          
                      covered += chunk.Length;
                      count++;
                      return ValueTask.CompletedTask;
                  },
                  new ChunkScanOptions { HashSuite = suite });
          
              if (covered != bytes.LongLength || count == 0)
              {
                  throw new InvalidOperationException("ChunkShift scanner did not cover the complete source.");
              }
          
              Console.WriteLine($"{suite}: {count} chunks, {covered} bytes");
          }
          
          CS
          dotnet publish artifacts/aot-consumer/AotConsumer.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishAot=true -p:PublishTrimmed=true -o artifacts/aot-publish

      - name: Run NativeAOT smoke
        shell: bash
        run: ./artifacts/aot-publish/AotConsumer

      - name: Build and test benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
          dotnet test benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-build --no-restore

      - name: Run deterministic lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            lab \
            --corpus benchmarks/corpus/corpus.v1.json \
            --experiments benchmarks/experiments/experiments.v2.json \
            --output "artifacts/benchmarks/lab-${{ matrix.rid }}.json"

      - name: Upload lab result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-lab-${{ matrix.rid }}
          path: artifacts/benchmarks/lab-${{ matrix.rid }}.json
          if-no-files-found: error
          retention-days: 30

  determinism:
    name: cross-arch-determinism
    needs: native
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore benchmark lab
        run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx

      - name: Build benchmark lab
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Download x64 evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: benchmark-lab-linux-x64
          path: artifacts/compare/x64

      - name: Download arm64 evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: benchmark-lab-linux-arm64
          path: artifacts/compare/arm64

      - name: Compare deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            compare \
            --left artifacts/compare/x64/lab-linux-x64.json \
            --right artifacts/compare/arm64/lab-linux-arm64.json
