name: Patch lab

# PATCH-PREFREEZE-001 / PATCH-ENC-002 / PATCH-APPLY-001 on the frozen corpus
# (docs/benchmarks/PATCH-PREFREEZE-PROTOCOL.md). Dispatch manually: the CSP
# lanes alone take tens of minutes, so this workflow never runs on a push.
# lanes=memory runs only the memory lane with the memory-lane policy and the
# memory-env variables (docs/benchmarks/PATCH-APPLY-001-A2-DIAGNOSIS.md), on
# Linux x64, Linux ARM64 and Windows x64. lanes=encoder creates the whole
# corpus with each encoder-lanes policy in turn, in one job per architecture,
# so their create times are compared within a job (PATCH-ENC-003).
# lanes=create-throughput creates the whole corpus once per create execution
# (h0, h1, h2-w{n}, h3-w{n}), one file at a time, on Linux x64, Linux ARM64
# and Windows x64; lanes=create-memory measures the create peak of each
# execution (PATCH-ENC-004, docs/benchmarks/PATCH-ENC-004-PROTOCOL.md).
# None of these groups is part of "all".
on:
  workflow_dispatch:
    inputs:
      lanes:
        description: "all, or a comma list of job groups: csp-lanes, sweep, references, memory, encoder, apply-check, create-throughput, create-memory"
        required: false
        default: all
        type: string
      memory-lane:
        description: "memory group only: the create policy (a patch-lab lane name)"
        required: false
        default: csp
        type: string
      memory-env:
        description: "memory group only: space-separated NAME=VALUE pairs, MALLOC_* or DOTNET_GC* only"
        required: false
        default: ""
        type: string
      encoder-lanes:
        description: "encoder group only: space-separated patch-lab lane names, created in this order"
        required: false
        default: ""
        type: string
      executions:
        description: "create-throughput and create-memory groups: space-separated create executions, run in this order (create-memory skips a repeated one)"
        required: false
        default: "h0 h1 h2-w1 h2-w2 h2-w4 h2-w8 h3-w1 h3-w2 h3-w4 h3-w8 h0"
        type: string
      experiment-id:
        description: "memory and encoder groups: the ExperimentId of the RunIds"
        required: false
        default: PATCH-APPLY-001
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  csp-lanes:
    name: patch-lab-csp-lanes (${{ matrix.arch }})
    if: inputs.lanes == 'all' || contains(inputs.lanes, 'csp-lanes')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The chunkshift-source family is rebuilt from old commits with
          # git ls-tree/cat-file, so the full history must be present.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install patch tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xdelta3 zstd
          python3 -m pip install bsdiff4

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      # csp, csp-zstd and csp-raw keep one worker: their apply wall time is
      # part of the end-to-end numbers the decision rules compare.
      - name: Run CSP lanes
        shell: bash
        run: |
          set -euo pipefail
          run_id="PATCH-PREFREEZE-001/RUN-$(date -u +%Y%m%d)-${{ github.run_number }}-${GITHUB_SHA::7}-linux-${{ matrix.arch }}"
          mkdir -p artifacts/patch-lab
          for lane in csp csp-zstd csp-raw
          do
            dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
              patch-lab run \
              --corpus "$HOME/patch-corpus" \
              --lane "$lane" \
              --output "artifacts/patch-lab/patch-lab-$lane-${{ matrix.arch }}.json" \
              --workers 1 --apply-repeats 3 --run-id "$run_id"
          done
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            patch-lab memory \
            --corpus "$HOME/patch-corpus" \
            --output "artifacts/patch-lab/patch-lab-memory-${{ matrix.arch }}.json" \
            --run-id "$run_id"

      - name: Upload CSP lane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-csp-lanes-${{ matrix.arch }}
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90

  sweep:
    name: patch-lab-sweep (${{ matrix.platform.arch }}, ${{ matrix.group }}, C${{ matrix.candidates }})
    if: inputs.lanes == 'all' || contains(inputs.lanes, 'sweep')
    strategy:
      fail-fast: false
      # Twelve settings over the whole corpus exceed one job's time limit,
      # so each job runs three of them.
      matrix:
        platform:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
        group:
          - L9-K1 L9-K2 L9-K4
          - L19-K1 L19-K2 L19-K4
        candidates: [8, 16]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The chunkshift-source family is rebuilt from old commits with
          # git ls-tree/cat-file, so the full history must be present.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install patch tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xdelta3 zstd
          python3 -m pip install bsdiff4

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      # The sweep measures create only and its time is compared between
      # settings, never in an end-to-end number, so every setting may create
      # its files in parallel with the same worker count.
      - name: Run sweep lanes
        shell: bash
        run: |
          set -euo pipefail
          run_id="PATCH-ENC-002/RUN-$(date -u +%Y%m%d)-${{ github.run_number }}-${GITHUB_SHA::7}-linux-${{ matrix.platform.arch }}"
          families=dotnet-aspnetcore-win-x64,dotnet-runtime-linux-arm64,node-win-x64,node-linux-x64,tzdata,chunkshift-source
          mkdir -p artifacts/patch-lab
          for setting in ${{ matrix.group }}
          do
            lane="sweep-${setting}-C${{ matrix.candidates }}"
            dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
              patch-lab run \
              --corpus "$HOME/patch-corpus" \
              --lane "$lane" \
              --output "artifacts/patch-lab/patch-lab-$lane-${{ matrix.platform.arch }}.json" \
              --families "$families" \
              --no-apply --workers "$(nproc)" --run-id "$run_id"
          done

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-sweep-${{ strategy.job-index }}-${{ matrix.platform.arch }}
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90

  references:
    name: patch-lab-references (${{ matrix.arch }})
    if: inputs.lanes == 'all' || contains(inputs.lanes, 'references')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The chunkshift-source family is rebuilt from old commits with
          # git ls-tree/cat-file, so the full history must be present.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install patch tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xdelta3 zstd
          python3 -m pip install bsdiff4

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      - name: Run reference lanes
        shell: bash
        run: |
          set -euo pipefail
          run_id="PATCH-PREFREEZE-001/RUN-$(date -u +%Y%m%d)-${{ github.run_number }}-${GITHUB_SHA::7}-linux-${{ matrix.arch }}"
          mkdir -p artifacts/patch-lab
          python3 benchmarks/scripts/patch_lab_references.py \
            --corpus "$HOME/patch-corpus" \
            --output "artifacts/patch-lab/patch-lab-references-${{ matrix.arch }}.json" \
            --workers 1 --decode-repeats 3 --run-id "$run_id"

      - name: Upload reference lane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-references-${{ matrix.arch }}
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90

  memory:
    name: patch-lab-memory (${{ matrix.platform }})
    if: contains(inputs.lanes, 'memory')
    strategy:
      fail-fast: false
      # arch names the artifact; the summary job merges the x64 and arm64
      # artifacts by suffix, so the Windows one must not end in -x64.
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            platform: linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux-arm64
          - os: windows-2025
            arch: windows
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The chunkshift-source family is rebuilt from old commits with
          # git ls-tree/cat-file, so the full history must be present.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      # setup-python provides python3 on Linux but only python on Windows.
      - name: Materialize corpus
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      # The inputs reach the script only through the environment, and each
      # pair is checked before it is exported, so an input cannot inject
      # shell code or set an unrelated variable.
      - name: Run memory lane
        shell: bash
        env:
          MEMORY_LANE: ${{ inputs.memory-lane }}
          MEMORY_ENV: ${{ inputs.memory-env }}
          EXPERIMENT_ID: ${{ inputs.experiment-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPERIMENT_ID" =~ ^[A-Z0-9-]+$ ]]
          then
            echo "experiment-id: rejected '$EXPERIMENT_ID'" >&2
            exit 2
          fi
          python=python3
          command -v python3 >/dev/null || python=python
          for pair in $MEMORY_ENV
          do
            if [[ ! "$pair" =~ ^(MALLOC_[A-Z_]+|DOTNET_GC[A-Za-z]+)=[A-Za-z0-9_.]+$ ]]
            then
              echo "memory-env: rejected '$pair'" >&2
              exit 2
            fi
            export "$pair"
          done
          run_id="$EXPERIMENT_ID/RUN-$(date -u +%Y%m%d)-${{ github.run_number }}-${GITHUB_SHA::7}-${{ matrix.platform }}"
          output="artifacts/patch-lab/patch-lab-memory-${{ matrix.arch }}.json"
          mkdir -p artifacts/patch-lab
          dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
            patch-lab memory \
            --corpus "$HOME/patch-corpus" \
            --output "$output" \
            --lane "$MEMORY_LANE" \
            --run-id "$run_id"
          "$python" benchmarks/scripts/print_patch_lab_memory.py "$output"

      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-memory-${{ matrix.arch }}
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90

  encoder:
    name: patch-lab-encoder (${{ matrix.arch }})
    if: contains(inputs.lanes, 'encoder')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The chunkshift-source family is rebuilt from old commits with
          # git ls-tree/cat-file, so the full history must be present.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      # Every lane creates the whole corpus with the same worker count in one
      # job, so create times are compared only within it; each patch is applied
      # once and checked against the target SHA-256.
      - name: Run encoder lanes
        shell: bash
        env:
          ENCODER_LANES: ${{ inputs.encoder-lanes }}
          EXPERIMENT_ID: ${{ inputs.experiment-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPERIMENT_ID" =~ ^[A-Z0-9-]+$ ]]
          then
            echo "experiment-id: rejected '$EXPERIMENT_ID'" >&2
            exit 2
          fi
          if [[ -z "$ENCODER_LANES" ]]
          then
            echo "encoder-lanes: empty" >&2
            exit 2
          fi
          run_id="$EXPERIMENT_ID/RUN-$(date -u +%Y%m%d)-${{ github.run_number }}-${GITHUB_SHA::7}-linux-${{ matrix.arch }}"
          mkdir -p artifacts/patch-lab
          outputs=()
          position=0
          for lane in $ENCODER_LANES
          do
            if [[ ! "$lane" =~ ^[A-Za-z0-9-]+$ ]]
            then
              echo "encoder-lanes: rejected '$lane'" >&2
              exit 2
            fi
            position=$((position + 1))
            output="artifacts/patch-lab/patch-lab-encoder-$position-$lane-${{ matrix.arch }}.json"
            dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
              patch-lab run \
              --corpus "$HOME/patch-corpus" \
              --lane "$lane" \
              --output "$output" \
              --workers "$(nproc)" --apply-repeats 1 --run-id "$run_id"
            outputs+=("$output")
          done
          python3 benchmarks/scripts/print_patch_lab_encoder.py "${outputs[@]}"

      # The name does not end in -x64/-arm64, so the summary job, which may
      # not see one lane twice, does not merge these runs.
      - name: Upload encoder evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-encoder-${{ matrix.arch }}-runs
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90

  create-throughput:
    name: patch-lab-create-throughput (${{ matrix.platform }})
    if: contains(inputs.lanes, 'create-throughput')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize corpus
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      # PATCH-ENC-004 section 5: one process per execution, one file at a
      # time, the default encoder policy. The first h0 lane applies every
      # patch once against the target SHA-256; the other lanes are checked
      # by the byte oracle (patch SHA-256 equal to the first h0's). The
      # inputs reach the script only through the environment and are
      # checked before use.
      - name: Run create executions
        shell: bash
        env:
          EXECUTIONS: ${{ inputs.executions }}
          EXPERIMENT_ID: ${{ inputs.experiment-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPERIMENT_ID" =~ ^[A-Z0-9-]+$ ]]
          then
            echo "experiment-id: rejected '$EXPERIMENT_ID'" >&2
            exit 2
          fi
          python=python3
          command -v python3 >/dev/null || python=python
          lab="benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll"
          run_id="$EXPERIMENT_ID/RUN-$(date -u +%Y%m%d)-${{ github.run_number }}-${GITHUB_SHA::7}-${{ matrix.platform }}"
          mkdir -p artifacts/patch-lab
          outputs=()
          position=0
          applied=0
          for execution in $EXECUTIONS
          do
            if [[ ! "$execution" =~ ^h[0-3](-w[1-8])?$ ]]
            then
              echo "executions: rejected '$execution'" >&2
              exit 2
            fi
            position=$((position + 1))
            apply=(--no-apply)
            if [[ "$execution" == "h0" && "$applied" == "0" ]]
            then
              apply=(--apply-repeats 1)
              applied=1
            fi
            output="artifacts/patch-lab/create-throughput-$position-$execution-${{ matrix.platform }}.json"
            dotnet "$lab" patch-lab run \
              --corpus "$HOME/patch-corpus" \
              --lane csp \
              --execution "$execution" \
              --workers 1 "${apply[@]}" \
              --output "$output" \
              --run-id "$run_id"
            outputs+=("$output")
          done
          "$python" benchmarks/scripts/summarize_create_throughput.py print "${outputs[@]}"

      # The name does not end in -x64/-arm64, so the pre-freeze summary does
      # not merge these runs.
      - name: Upload create-throughput evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-create-throughput-${{ matrix.platform }}-runs
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90

  create-memory:
    name: patch-lab-create-memory (${{ matrix.platform }})
    if: contains(inputs.lanes, 'create-memory')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize corpus
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      # Every file of at least 1 MiB is created in a child process of its
      # own, per execution, with the idle baseline (PATCH-ENC-004 section 5).
      - name: Run create memory lanes
        shell: bash
        env:
          EXECUTIONS: ${{ inputs.executions }}
          EXPERIMENT_ID: ${{ inputs.experiment-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPERIMENT_ID" =~ ^[A-Z0-9-]+$ ]]
          then
            echo "experiment-id: rejected '$EXPERIMENT_ID'" >&2
            exit 2
          fi
          python=python3
          command -v python3 >/dev/null || python=python
          lab="benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll"
          run_id="$EXPERIMENT_ID/RUN-$(date -u +%Y%m%d)-${{ github.run_number }}-${GITHUB_SHA::7}-${{ matrix.platform }}"
          mkdir -p artifacts/patch-lab
          done_list=" "
          for execution in $EXECUTIONS
          do
            if [[ ! "$execution" =~ ^h[0-3](-w[1-8])?$ ]]
            then
              echo "executions: rejected '$execution'" >&2
              exit 2
            fi
            if [[ "$done_list" == *" $execution "* ]]
            then
              continue
            fi
            done_list="$done_list$execution "
            output="artifacts/patch-lab/create-memory-$execution-${{ matrix.platform }}.json"
            dotnet "$lab" patch-lab memory \
              --corpus "$HOME/patch-corpus" \
              --lane csp \
              --execution "$execution" \
              --output "$output" \
              --run-id "$run_id"
            "$python" benchmarks/scripts/print_patch_lab_memory.py "$output"
          done

      - name: Upload create-memory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-create-memory-${{ matrix.platform }}-runs
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90

  apply-check:
    name: patch-lab-apply-check (${{ matrix.platform }})
    if: contains(inputs.lanes, 'apply-check')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            platform: linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux-arm64
          - os: windows-2025
            arch: x64
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}

      - name: Materialize corpus
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock

      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore

      # PATCH-APPLY-003: patches are created once and not timed; every
      # repetition is its own process; all three platforms belong to one
      # workflow dispatch and exact commit. The lanes are off, overlap and
      # boundary: rule 2 is evaluated again on the boundary-only check, and
      # rule 1 comes from the verdict of the rule-1 run (--prior-verdict).
      - name: Run apply-check lanes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]
          then
            echo "PATCH-APPLY-003 decision evidence must run from main; got $GITHUB_REF" >&2
            exit 2
          fi
          run_id="PATCH-APPLY-003/RUN-$(date -u +%Y%m%d)-${{ github.run_number }}-${GITHUB_SHA::7}-${{ matrix.platform }}"
          lab="benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll"
          out="artifacts/patch-lab"
          mkdir -p "$out"
          dotnet "$lab" patch-lab apply-check prepare --corpus "$HOME/patch-corpus" \
            --output "$out/apply-check-prepare-${{ matrix.platform }}.json" --run-id "$run_id"
          for repetition in $(seq 0 9)
          do
            dotnet "$lab" patch-lab apply-check time --corpus "$HOME/patch-corpus" --repetition "$repetition" \
              --output "$out/apply-check-time-$repetition-${{ matrix.platform }}.json" --run-id "$run_id"
          done
          for repetition in $(seq 0 9)
          do
            dotnet "$lab" patch-lab apply-check concurrent --corpus "$HOME/patch-corpus" --repetition "$repetition" \
              --output "$out/apply-check-concurrent-$repetition-${{ matrix.platform }}.json" --run-id "$run_id"
          done
          dotnet "$lab" patch-lab apply-check memory --corpus "$HOME/patch-corpus" \
            --output "$out/apply-check-memory-${{ matrix.platform }}.json" --run-id "$run_id"

      - name: Build per-platform compact evidence
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          compact="artifacts/patch-lab/compact"
          "$python" benchmarks/scripts/summarize_apply_check.py \
            artifacts/patch-lab \
            --corpus-lock docs/benchmarks/patch-corpus/corpus-lock.json \
            --output "artifacts/patch-lab/apply-check-verdict-${{ matrix.platform }}.json" \
            --markdown "artifacts/patch-lab/apply-check-summary-${{ matrix.platform }}.md" \
            --compact-dir "$compact" \
            --prior-verdict docs/research/results/data/PATCH-APPLY-003-20260929-001/apply-check-verdict.json
          cat "artifacts/patch-lab/apply-check-summary-${{ matrix.platform }}.md"
          compact_file="$compact/PATCH-APPLY-003-compact-${{ matrix.platform }}.json"
          "$python" - "$compact_file" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          print(f"compact-samples-sha256={hashlib.sha256(path.read_bytes()).hexdigest()} file={path}")
          PY

      - name: Upload apply-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-apply-check-${{ matrix.platform }}
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90


  summary:
    name: patch-lab-summary
    needs: [csp-lanes, sweep, references, memory, encoder, apply-check, create-throughput, create-memory]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download x64 evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-lab-*-x64
          path: platform-x64
          merge-multiple: true

      - name: Download arm64 evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-lab-*-arm64
          path: platform-arm64
          merge-multiple: true

      - name: Summarize patch lab evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform-x64 platform-arm64 artifacts/patch-lab
          python3 benchmarks/scripts/summarize_patch_lab.py \
            platform-x64 platform-arm64 \
            --corpus-lock docs/benchmarks/patch-corpus/corpus-lock.json \
            --output artifacts/patch-lab/verdict.json \
            --markdown artifacts/patch-lab/summary.md
          cat artifacts/patch-lab/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Download apply-check linux-x64 evidence
        if: always() && contains(inputs.lanes, 'apply-check')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-lab-apply-check-linux-x64
          path: apply-check-linux-x64

      - name: Download apply-check linux-arm64 evidence
        if: always() && contains(inputs.lanes, 'apply-check')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-lab-apply-check-linux-arm64
          path: apply-check-linux-arm64

      - name: Download apply-check win-x64 evidence
        if: always() && contains(inputs.lanes, 'apply-check')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-lab-apply-check-win-x64
          path: apply-check-win-x64

      - name: Summarize PATCH-APPLY-003 evidence
        if: always() && contains(inputs.lanes, 'apply-check')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/patch-lab/compact
          python3 benchmarks/scripts/summarize_apply_check.py \
            apply-check-linux-x64 apply-check-linux-arm64 apply-check-win-x64 \
            --corpus-lock docs/benchmarks/patch-corpus/corpus-lock.json \
            --output artifacts/patch-lab/apply-check-verdict.json \
            --markdown artifacts/patch-lab/apply-check-summary.md \
            --compact-dir artifacts/patch-lab/compact \
            --prior-verdict docs/research/results/data/PATCH-APPLY-003-20260929-001/apply-check-verdict.json \
            --require-all-platforms
          cat artifacts/patch-lab/apply-check-summary.md >> "$GITHUB_STEP_SUMMARY"
          sha256sum artifacts/patch-lab/compact/PATCH-APPLY-003-compact-*.json

      - name: Download PATCH-ENC-004 evidence
        if: always() && (contains(inputs.lanes, 'create-throughput') || contains(inputs.lanes, 'create-memory'))
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-lab-create-*-runs
          path: create-evidence

      # The evaluator applies the frozen rule of PATCH-ENC-004 section 7;
      # without all three platforms and the memory lanes it reports the
      # workers as INCOMPLETE rather than deciding them.
      - name: Summarize PATCH-ENC-004 evidence
        if: always() && (contains(inputs.lanes, 'create-throughput') || contains(inputs.lanes, 'create-memory'))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p create-evidence artifacts/patch-lab
          python3 benchmarks/scripts/summarize_create_throughput.py decide create-evidence \
            --corpus-lock docs/benchmarks/patch-corpus/corpus-lock.json \
            --output artifacts/patch-lab/create-throughput-verdict.json \
            --markdown artifacts/patch-lab/create-throughput-summary.md
          cat artifacts/patch-lab/create-throughput-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patch lab summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-lab-summary
          path: artifacts/patch-lab
          if-no-files-found: error
          retention-days: 90
