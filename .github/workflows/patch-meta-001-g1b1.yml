name: PATCH-META-001 G1B1 real Roslyn preflight

# Real binary source locked to independently archived exact SHA values.
# This does not measure cache-on/off or authorize ADOPT.
on:
  pull_request:
    branches: [main, research/patch-meta-001-g1a-stage-attribution]
    paths:
      - 'benchmarks/scripts/run_patch_meta_001_g1b1.py'
      - 'benchmarks/scripts/test_run_patch_meta_001_g1b1.py'
      - 'docs/benchmarks/PATCH-META-001-G1B1-PROTOCOL.md'
      - '.github/workflows/patch-meta-001-g1b1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-roslyn:
    name: original-roslyn-calibration-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-2025, platform: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout the actual measured commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: SHA/ZIP/source-lock/fail-closed driver tests
        env:
          PYTHONPATH: benchmarks/scripts
        run: python -m unittest -v benchmarks/scripts/test_run_patch_meta_001_g1b1.py benchmarks/scripts/test_run_patch_meta_001_g1a.py
      - name: Build genuine CSP lab in Release
        run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release
      - name: Five rounds on original pinned .NET DLLs and exact CSP apply
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python benchmarks/scripts/run_patch_meta_001_g1b1.py
          --dll benchmarks/ChunkShift.Benchmarks/bin/Release/net10.0/ChunkShift.Benchmarks.dll
          --corpus "${{ runner.temp }}/patch-meta-g1b1-roslyn"
          --work "${{ runner.temp }}/patch-meta-g1b1-csm-work"
          --output artifacts/patch-meta-g1b1
          --rounds 5
      - name: Preserve raw exact stage records without original binary payload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-meta-g1b1-${{ matrix.platform }}
          path: artifacts/patch-meta-g1b1/
          if-no-files-found: warn
          retention-days: 30
