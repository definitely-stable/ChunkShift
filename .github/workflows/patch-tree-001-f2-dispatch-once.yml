name: PATCH-TREE-001 F2 single-use real calibration dispatch

# Narrow push-only trigger. The PR itself never accesses the real corpus.
# Run exactly once when THIS workflow file is first introduced on main.
# All source/recovery/provenance gates remain in the original manual workflow.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-tree-001-f2-dispatch-once.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: patch-tree-001-f2-single-use-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'definitely-stable/ChunkShift' && github.ref == 'refs/heads/main'
    name: dispatch original four-pair F2 calibration once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact push commit and its first parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Fail closed unless this is the initial addition on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # A later modification to this trigger must NOT dispatch F2 again.
          path=".github/workflows/patch-tree-001-f2-dispatch-once.yml"
          delta="$(git diff --name-status "$GITHUB_SHA^1" "$GITHUB_SHA" -- "$path")"
          test "$delta" = "$(printf 'A\t%s' "$path")"
          # A source SHA must refer to the precise live main HEAD at dispatch.
          live="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$live" = "$GITHUB_SHA"
          # Keep the original one-success-only/one-active rule before dispatch.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/patch-tree-001-f2-real-calibration.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/f2-history.json"
          python3 - "$RUNNER_TEMP/f2-history.json" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if int(data.get("total_count", 0)) > 100:
              raise SystemExit("F2 history not exhaustively enumerated")
          for run in data.get("workflow_runs", []):
              if run.get("status") != "completed" or run.get("conclusion") == "success":
                  raise SystemExit("F2 calibration already active or successful")
          PY

      - name: Invoke the frozen main-only F2 workflow_dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_date="$(date -u +%Y%m%d)"
          gh workflow run patch-tree-001-f2-real-calibration.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main \
            -f "run-date=$run_date" \
            -f "pairs-run-id=38136336025" \
            -f "source-sha=$GITHUB_SHA"
          echo "F2 workflow_dispatch requested against main SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Original recovery run: 38136336025" >> "$GITHUB_STEP_SUMMARY"
          echo "The physical real-corpus results are not yet measured and are NOT_ADOPT." >> "$GITHUB_STEP_SUMMARY"
