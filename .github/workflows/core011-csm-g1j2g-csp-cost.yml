name: CORE011 CSM G1-J2G frozen Roslyn physical CSP cost

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core011-csm-g1j2g-csp-cost.yml"
      - "benchmarks/scripts/core011_csm_g1j2g_patch_cost.py"
      - "benchmarks/scripts/test_core011_csm_g1j2g_patch_cost.py"
      - "docs/benchmarks/CORE011-CSM-001-G1J2G-CSP-COST-PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core011-g1j2g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-physical-csp-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout exact hosted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup pinned .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: J2G metric negative controls and J1 decision lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v benchmarks/scripts/test_core011_csm_g1j2g_patch_cost.py
          python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json
          if python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json \
            --decision-ready; then
            echo "J2G cannot run a product decision" >&2
            exit 1
          fi
      - name: Original frozen DLLs via PUBLIC create plan patch create apply verify
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/core011_csm_g1j2g_patch_cost.py \
            --output-dir "$RUNNER_TEMP/core011-g1j2g-data" \
            --run-id "CORE011-CSM-001/G1J2G-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:8}-linux-x64"
          python3 - "$RUNNER_TEMP/core011-g1j2g-data/summary.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text())
          assert d["schema"]=="chunkshift.core011.g1j2g-physical-csp-cost.v1"
          assert d["verdict"]=="NO_VERDICT_EXPLORATORY"
          assert d["decisionRunsAllowed"] is False
          assert d["budgetsLocked"] is False
          assert d["publicPlan"]["reusedChunks"]==0
          assert d["publicPlan"]["missingChunks"]==81
          assert len(d["lanes"])==2
          assert all(x["exactReconstruction"] for x in d["lanes"].values())
          assert all(x["physicalPatchBytes"]>0 for x in d["lanes"].values())
          assert not (p.parent/"private").exists()
          print("J2G two physical CSP sizes and exact reconstructions PASS; NO_VERDICT.")
          PY
      - name: Archive source-free metrics only, including failure output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core011-csm-g1j2g-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core011-g1j2g-data/summary.json
            ${{ runner.temp }}/core011-g1j2g-data/failure.json
          retention-days: 90
          if-no-files-found: warn
