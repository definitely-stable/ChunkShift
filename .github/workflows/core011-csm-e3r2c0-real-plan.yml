name: CORE011 CSM E3-R2C0 real DLL public Plan pilot

on:
  pull_request:
    branches:
      - research/core011-csm-004-e3r2b2b-external-observer-evidence
      - main
    paths:
      - ".github/workflows/core011-csm-e3r2c0-real-plan.yml"
      - "docs/benchmarks/CORE011-CSM-004-E3-R2C0-REAL-PLAN.md"
      - "benchmarks/ChunkShift.Benchmarks/CsmE3R2c0RealPlanHarness.cs"
      - "benchmarks/ChunkShift.Benchmarks/Program.cs"
      - "benchmarks/experiments/core011-csm-e3r2c0-real-plan.v1.json"
      - "benchmarks/scripts/core011_csm_e3r2c0.py"
      - "benchmarks/scripts/test_core011_csm_e3r2c0.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-dll-public-plan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu-24.04
            platform: linux
            python: python3
          - image: windows-2025
            platform: windows
            python: python
    name: E3 R2-C0 real published DLL ${{ matrix.platform }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout exact prospective research PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned project SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Refuse production source or protocol mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/research/core011-csm-004-e3r2b2b-external-observer-evidence...HEAD > "$RUNNER_TEMP/core011-e3r2c0-scope.txt"
          cat "$RUNNER_TEMP/core011-e3r2c0-scope.txt"
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/core011-csm-e3r2c0-real-plan.yml|docs/benchmarks/CORE011-CSM-004-E3-R2C0-REAL-PLAN.md|benchmarks/ChunkShift.Benchmarks/CsmE3R2c0RealPlanHarness.cs|benchmarks/ChunkShift.Benchmarks/Program.cs|benchmarks/experiments/core011-csm-e3r2c0-real-plan.v1.json|benchmarks/scripts/core011_csm_e3r2c0.py|benchmarks/scripts/test_core011_csm_e3r2c0.py) ;;
              *) echo "R2C0 unexpected source: $p" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/core011-e3r2c0-scope.txt"
          test -z "$(git diff --name-only origin/research/core011-csm-004-e3r2b2b-external-observer-evidence...HEAD -- src/ tests/ Directory.Packages.props)"
      - name: Validate real DLL provenance guards and original decision gate
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.python }} -m py_compile benchmarks/scripts/core011_csm_e3r2c0.py benchmarks/scripts/test_core011_csm_e3r2c0.py
          ${{ matrix.python }} -m unittest -v benchmarks/scripts/test_core011_csm_e3r2c0.py
          ${{ matrix.python }} benchmarks/scripts/core011_csm_e3_guard.py
          if ${{ matrix.python }} benchmarks/scripts/core011_csm_e3_guard.py --decision-ready; then
            echo "ERROR: E3 R0 no-decision gate unexpectedly unlocked" >&2
            exit 1
          fi
      - name: Build actual NuGet DLL pair as physical CSM; measure public Plan with independent observer
        shell: bash
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=8 HEAD)
          rid="CORE011-CSM-004/RUN-$(date -u +%Y%m%d)-$GITHUB_RUN_ID-$short-${{ matrix.platform }}-x64"
          ${{ matrix.python }} benchmarks/scripts/core011_csm_e3r2c0.py \
            --run-id "$rid" --platform ${{ matrix.platform }} \
            --output-dir "$RUNNER_TEMP/e3r2c0"
          ${{ matrix.python }} - "$RUNNER_TEMP/e3r2c0/summary.json" <<'PY'
          import json,os,sys
          with open(sys.argv[1],encoding="utf-8") as f: x=json.load(f)
          assert x["decisionRunsAllowed"] is False and x["productVerdict"]=="NOT_QUALIFIED"
          assert x["planCalls"]==64 and x["consumerPid"]!=x["externalObserverPid"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            print("## CORE011 E3-R2C0 original eager published Roslyn DLL Plan",file=f)
            print("RunId: "+x["runId"],file=f)
            print("Plan calls: "+str(x["planCalls"])+", reused chunks: "+str(x["expectedPlan"]["reusedChunks"])+
                  ", missing chunks: "+str(x["expectedPlan"]["missingChunks"]),file=f)
            print("CPU ms: "+str(round(x["batchCpuMilliseconds"],3))+
                  ", allocated bytes: "+str(x["allocatedBytes"])+
                  ", native external sampled private resident max MiB: "+
                  str(round(x["externalPrivateResidentSampledPeakBytes"]/1048576,3)),file=f)
            print("NuGet hashes are observed, not independently pre-frozen. NO PRODUCT DECISION.",file=f)
          PY
      - name: Archive source-free CSM, original observer trace and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core011-e3r2c0-${{ matrix.platform }}
          path: ${{ runner.temp }}/e3r2c0/
          if-no-files-found: warn
          retention-days: 90
