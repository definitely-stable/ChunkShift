name: Repository holdout qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-ingest-lab/holdout-geometry-lock.json'
      - 'tools/repository-ingest-lab/holdout_contract.py'
      - 'tools/repository-ingest-lab/holdout_qualify.py'
      - 'tools/repository-ingest-lab/test_holdout_contract.py'
      - '.github/workflows/repository-holdout-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ingest-screen
  cancel-in-progress: false

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Validate contracts
        run: python -B -m unittest discover -s tools/repository-ingest-lab -p "test_*.py"
      - name: Exercise real D/C without retaining performance metrics
        shell: pwsh
        run: |
          python -B tools/repository-ingest-lab/holdout_qualify.py --lane "${{ matrix.os }}" --output "$env:RUNNER_TEMP/holdout-qualification"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summary = Get-Content "$env:RUNNER_TEMP/holdout-qualification/evidence/summary.json" -Raw | ConvertFrom-Json
          if ($summary.samples -ne 16 -or $summary.decision -ne "CORRECTNESS_ONLY" -or $summary.commit -ne (git rev-parse HEAD).Trim()) { throw "Qualification identity/count mismatch" }
      - name: Archive structural evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: holdout-qualification-${{ matrix.os }}
          path: ${{ runner.temp }}/holdout-qualification/evidence/
          if-no-files-found: warn
          retention-days: 90
