name: PATCH-ENC-005 Phase A

on:
  workflow_dispatch:
    inputs:
      dataset-role:
        description: "Development split to measure"
        required: true
        default: calibration
        type: choice
        options:
          - calibration
      run-date:
        description: "Frozen RunId UTC date (YYYYMMDD)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: patch-enc-005-phase-a-${{ inputs.dataset-role }}-${{ inputs.run-date }}-${{ github.run_number }}-${{ github.sha }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  preflight:
    name: evidence-identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUN_DATE: ${{ inputs.run-date }}
    steps:
      - name: Validate frozen evidence identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "PATCH-ENC-005 decision evidence rejects GitHub workflow re-runs." >&2
            exit 2
          fi
          if (( GITHUB_RUN_NUMBER > 999 )); then
            echo "PATCH-ENC-005 NNN identity supports workflow run numbers 000..999." >&2
            exit 2
          fi
          sequence="$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          [[ "$sequence" =~ ^[0-9]{3}$ ]]
          python3 - "$RUN_DATE" <<'PY'
          import datetime as dt
          import re
          import sys
          value = sys.argv[1]
          if not re.fullmatch(r"\d{8}", value):
              raise SystemExit("run-date must be YYYYMMDD")
          dt.datetime.strptime(value, "%Y%m%d")
          PY

  timing-attempt-1:
    needs: preflight
    name: timing-a1-${{ inputs.dataset-role }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}
      - name: Materialize frozen development corpus
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock
      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Run frozen timing attempt 1
        shell: bash
        env:
          DATASET_ROLE: ${{ inputs.dataset-role }}
          # MSBuild consumes PLATFORM and changes the no-build launch path.
          EVIDENCE_PLATFORM: ${{ matrix.platform }}
          RUN_DATE: ${{ inputs.run-date }}
        run: |
          set -euo pipefail
          case "$DATASET_ROLE" in
            calibration) families="dotnet-aspnetcore-win-x64,dotnet-runtime-linux-arm64" ;;
            evaluation) families="node-win-x64,node-linux-x64,tzdata,chunkshift-source" ;;
            *) echo "unsupported development role: $DATASET_ROLE" >&2; exit 2 ;;
          esac
          python=python3
          command -v python3 >/dev/null || python=python
          RUN_SEQUENCE="$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          run_id="PATCH-ENC-005/RUN-$RUN_DATE-$RUN_SEQUENCE-$GITHUB_SHA-$EVIDENCE_PLATFORM"
          "$python" benchmarks/scripts/run_patch_enc_005_paired.py \
            --corpus "$HOME/patch-corpus" \
            --output artifacts/patch-enc-005/attempt-1 \
            --run-id "$run_id" \
            --source-commit "$GITHUB_SHA" \
            --platform "$EVIDENCE_PLATFORM" \
            --dataset-role "$DATASET_ROLE" \
            --families "$families" \
            --attempt 1
      - name: Upload attempt 1
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-enc-005-${{ inputs.dataset-role }}-attempt-1-${{ matrix.platform }}
          path: artifacts/patch-enc-005/attempt-1
          if-no-files-found: error
          retention-days: 90

  timing-attempt-2:
    name: timing-a2-${{ inputs.dataset-role }} (${{ matrix.platform }})
    needs: timing-attempt-1
    if: needs.timing-attempt-1.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download attempt 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-enc-005-${{ inputs.dataset-role }}-attempt-1-${{ matrix.platform }}
          path: artifacts/patch-enc-005/attempt-1
      - name: Determine whether retry needs benchmark runtime
        id: retry
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          needed="$("$python" -c 'import json; print("false" if json.load(open("artifacts/patch-enc-005/attempt-1/dispatch.json", encoding="utf-8"))["valid"] else "true")')"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Setup .NET
        if: steps.retry.outputs.needed == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore corpus sources
        if: steps.retry.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}
      - name: Materialize frozen development corpus
        if: steps.retry.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock
      - name: Build benchmark lab
        if: steps.retry.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Run timing attempt 2 or record skip
        shell: bash
        env:
          DATASET_ROLE: ${{ inputs.dataset-role }}
          EVIDENCE_PLATFORM: ${{ matrix.platform }}
          RUN_DATE: ${{ inputs.run-date }}
        run: |
          set -euo pipefail
          case "$DATASET_ROLE" in
            calibration) families="dotnet-aspnetcore-win-x64,dotnet-runtime-linux-arm64" ;;
            evaluation) families="node-win-x64,node-linux-x64,tzdata,chunkshift-source" ;;
            *) echo "unsupported development role: $DATASET_ROLE" >&2; exit 2 ;;
          esac
          python=python3
          command -v python3 >/dev/null || python=python
          RUN_SEQUENCE="$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          run_id="PATCH-ENC-005/RUN-$RUN_DATE-$RUN_SEQUENCE-$GITHUB_SHA-$EVIDENCE_PLATFORM"
          "$python" benchmarks/scripts/run_patch_enc_005_paired.py \
            --corpus "$HOME/patch-corpus" \
            --output artifacts/patch-enc-005/attempt-2 \
            --run-id "$run_id" \
            --source-commit "$GITHUB_SHA" \
            --platform "$EVIDENCE_PLATFORM" \
            --dataset-role "$DATASET_ROLE" \
            --families "$families" \
            --attempt 2 \
            --prior-dispatch artifacts/patch-enc-005/attempt-1/dispatch.json
      - name: Upload attempt 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-enc-005-${{ inputs.dataset-role }}-attempt-2-${{ matrix.platform }}
          path: artifacts/patch-enc-005/attempt-2
          if-no-files-found: error
          retention-days: 90

  finalize:
    name: finalize-${{ inputs.dataset-role }} (${{ matrix.platform }})
    needs: [timing-attempt-1, timing-attempt-2]
    if: needs.timing-attempt-1.result == 'success' && needs.timing-attempt-2.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download timing attempts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-enc-005-${{ inputs.dataset-role }}-attempt-*-${{ matrix.platform }}
          path: artifacts/attempts
      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}
      - name: Materialize frozen development corpus
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock
      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Finalize apply, trace and independent-decoder evidence
        shell: bash
        env:
          DATASET_ROLE: ${{ inputs.dataset-role }}
          EVIDENCE_PLATFORM: ${{ matrix.platform }}
          RUN_DATE: ${{ inputs.run-date }}
        run: |
          set -euo pipefail
          case "$DATASET_ROLE" in
            calibration) families="dotnet-aspnetcore-win-x64,dotnet-runtime-linux-arm64" ;;
            evaluation) families="node-win-x64,node-linux-x64,tzdata,chunkshift-source" ;;
            *) echo "unsupported development role: $DATASET_ROLE" >&2; exit 2 ;;
          esac
          python=python3
          command -v python3 >/dev/null || python=python
          RUN_SEQUENCE="$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          run_id="PATCH-ENC-005/RUN-$RUN_DATE-$RUN_SEQUENCE-$GITHUB_SHA-$EVIDENCE_PLATFORM"
          attempt1="artifacts/attempts/patch-enc-005-$DATASET_ROLE-attempt-1-$EVIDENCE_PLATFORM/dispatch.json"
          attempt2="artifacts/attempts/patch-enc-005-$DATASET_ROLE-attempt-2-$EVIDENCE_PLATFORM/dispatch.json"
          "$python" benchmarks/scripts/finalize_patch_enc_005_phase_a.py \
            --corpus "$HOME/patch-corpus" \
            --output artifacts/patch-enc-005/final \
            --attempt-one "$attempt1" \
            --attempt-two "$attempt2" \
            --run-id "$run_id" \
            --source-commit "$GITHUB_SHA" \
            --platform "$EVIDENCE_PLATFORM" \
            --dataset-role "$DATASET_ROLE" \
            --families "$families"
      - name: Upload final platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-enc-005-${{ inputs.dataset-role }}-paired-${{ matrix.platform }}
          path: artifacts/patch-enc-005/final
          if-no-files-found: error
          retention-days: 90

  cross-platform:
    name: patch-byte-determinism
    needs: finalize
    if: needs.finalize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-enc-005-${{ inputs.dataset-role }}-paired-*
          path: artifacts/platforms
      - name: Verify cross-platform patch bytes
        run: |
          python3 benchmarks/scripts/check_patch_enc_005_cross_platform.py \
            --input artifacts/platforms \
            --output artifacts/cross-platform.json
      - name: Upload cross-platform gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-enc-005-${{ inputs.dataset-role }}-cross-platform
          path: artifacts/cross-platform.json
          if-no-files-found: error
          retention-days: 90

  memory:
    needs: preflight
    name: memory-${{ inputs.dataset-role }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Restore corpus sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/patch-corpus/sources
          key: patch-corpus-sources-${{ hashFiles('docs/benchmarks/patch-corpus/source-assets.sha256') }}
      - name: Materialize frozen development corpus
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          command -v python3 >/dev/null || python=python
          "$python" benchmarks/scripts/materialize_patch_corpus.py \
            --root "$HOME/patch-corpus" \
            --sources "$HOME/patch-corpus/sources" \
            --download --lock
      - name: Build benchmark lab
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
          dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - name: Run frozen Phase-A memory population
        shell: bash
        env:
          DATASET_ROLE: ${{ inputs.dataset-role }}
          EVIDENCE_PLATFORM: ${{ matrix.platform }}
          RUN_DATE: ${{ inputs.run-date }}
        run: |
          set -euo pipefail
          case "$DATASET_ROLE" in
            calibration) families="dotnet-aspnetcore-win-x64,dotnet-runtime-linux-arm64" ;;
            evaluation) families="node-win-x64,node-linux-x64,tzdata,chunkshift-source" ;;
            *) echo "unsupported development role: $DATASET_ROLE" >&2; exit 2 ;;
          esac
          RUN_SEQUENCE="$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          run_id="PATCH-ENC-005/RUN-$RUN_DATE-$RUN_SEQUENCE-$GITHUB_SHA-$EVIDENCE_PLATFORM"
          mkdir -p artifacts/patch-enc-005/memory
          lanes="csp H4-L1-R2 H7-L1-R2-E75 H9-L9-K4-C16-R1M H9-L12-K4-C16-R1M H9-L15-K4-C16-R1M"
          for lane in $lanes
          do
            dotnet run --project benchmarks/ChunkShift.Benchmarks/ChunkShift.Benchmarks.csproj -c Release --no-build -- \
              patch-lab memory \
              --corpus "$HOME/patch-corpus" \
              --output "artifacts/patch-enc-005/memory/$lane.json" \
              --families "$families" \
              --min-bytes 1048576 \
              --population max-base-target \
              --apply-check boundary \
              --lane "$lane" \
              --execution h2-w2 \
              --run-id "$run_id"
          done
      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-enc-005-${{ inputs.dataset-role }}-memory-${{ matrix.platform }}
          path: artifacts/patch-enc-005/memory
          if-no-files-found: error
          retention-days: 90

  evaluate-calibration:
    name: calibration-evaluator
    needs: [cross-platform, memory]
    if: inputs.dataset-role == 'calibration' && needs.cross-platform.result == 'success' && needs.memory.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download paired evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-enc-005-calibration-paired-*
          path: artifacts/paired

      - name: Download memory evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-enc-005-calibration-memory-*
          path: artifacts/memory

      - name: Download cross-platform gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-enc-005-calibration-cross-platform
          path: artifacts/cross

      - name: Compile frozen Phase-A calibration verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/evaluate_patch_enc_005_phase_a.py \
            --source-commit "$GITHUB_SHA" \
            --paired linux-x64=artifacts/paired/patch-enc-005-calibration-paired-linux-x64/paired.json \
            --paired linux-arm64=artifacts/paired/patch-enc-005-calibration-paired-linux-arm64/paired.json \
            --paired win-x64=artifacts/paired/patch-enc-005-calibration-paired-win-x64/paired.json \
            --memory linux-x64=artifacts/memory/patch-enc-005-calibration-memory-linux-x64 \
            --memory linux-arm64=artifacts/memory/patch-enc-005-calibration-memory-linux-arm64 \
            --memory win-x64=artifacts/memory/patch-enc-005-calibration-memory-win-x64 \
            --cross-platform artifacts/cross/cross-platform.json \
            --output artifacts/evaluation
          python3 artifacts/evaluation/recompute.py \
            --compact artifacts/evaluation/compact.json \
            --expected-verdict artifacts/evaluation/verdict.json
          cat artifacts/evaluation/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload calibration decision inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-enc-005-calibration-evaluation
          path: artifacts/evaluation
          if-no-files-found: error
          retention-days: 90
