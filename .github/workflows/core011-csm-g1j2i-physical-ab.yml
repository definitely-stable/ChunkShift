name: CORE011 CSM G1-J2I actual physical FastCDC16k isolated A-B

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core011-csm-g1j2i-physical-ab.yml"
      - "benchmarks/scripts/core011_csm_g1j2i_physical_ab.py"
      - "benchmarks/scripts/test_core011_csm_g1j2i_physical_ab.py"
      - "docs/benchmarks/CORE011-CSM-001-G1J2I-PHYSICAL-AB-PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core011-g1j2i-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-physical-csp-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Exact GitHub-hosted source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Pinned .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Frozen source mutation tests and strict no-decision J1 lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v benchmarks/scripts/test_core011_csm_g1j2i_physical_ab.py
          python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json
          if python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json \
            --decision-ready; then
            echo "G1-J2I forbids a product decision" >&2
            exit 1
          fi
      - name: Two SHA-pinned product families x stable64k and lab16k real CSP create/apply
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/core011_csm_g1j2i_physical_ab.py \
            --output-dir "$RUNNER_TEMP/core011-g1j2i-data" \
            --worktree-root "$RUNNER_TEMP/core011-g1j2i-worktrees" \
            --run-id "CORE011-CSM-001/G1J2I-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:8}-linux-x64"
          python3 - "$RUNNER_TEMP/core011-g1j2i-data" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assert [x.name for x in root.iterdir()]==["summary.json"]
          d=json.loads((root/"summary.json").read_text())
          assert d["schema"]=="chunkshift.core011.g1j2i-real-physical-ab.v1"
          assert d["decisionRunsAllowed"] is False and d["budgetsLocked"] is False
          assert d["verdict"]=="NO_VERDICT_EXPLORATORY"
          assert set(d["families"])=={"roslyn","newtonsoft"}
          for f in d["families"].values():
              assert set(f["variants"])=={"stable64k","lab16k"}
              for variant in f["variants"].values():
                  assert len(variant["physicalCsp"])==2
                  assert all(v["exactOriginalTargetReconstructed"] for v in variant["physicalCsp"].values())
          assert d["sourceMutation"]["onlyDisposableGitWorktree"] is True
          assert not (root/"private").exists()
          print("J2I actual lab/profile semantics and both physical modes fully reconstruct original targets; no product verdict")
          PY
      - name: Archive only source-free summary or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core011-csm-g1j2i-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core011-g1j2i-data/summary.json
            ${{ runner.temp }}/core011-g1j2i-data/failure.json
          if-no-files-found: warn
          retention-days: 90
