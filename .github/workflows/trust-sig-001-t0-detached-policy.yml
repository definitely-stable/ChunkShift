name: TRUST-SIG-001 T0 detached policy lab

# PR-only benchmark-level crypto and cursor adversarial checks.
on:
  pull_request:
    paths:
      - "benchmarks/ChunkShift.Benchmarks/PatchLab/Tree/PatchTreeDetachedPolicyLab.cs"
      - "benchmarks/ChunkShift.Benchmarks.Tests/PatchLab/PatchTreeDetachedPolicyLabTests.cs"
      - "docs/benchmarks/TRUST-SIG-001-T0-DETACHED-POLICY-PROTOCOL.md"
      - ".github/workflows/trust-sig-001-t0-detached-policy.yml"

permissions:
  contents: read

jobs:
  trust-policy-ubuntu:
    name: T0 signature and replay controls (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
      - run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - run: dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~PatchTreeDetachedPolicyLabTests
      - run: echo "LAB-ONLY; no trusted durable cursor, TUF, production envelope, or filesystem publisher." >> "$GITHUB_STEP_SUMMARY"
  trust-policy-windows:
    name: T0 signature and replay controls (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore benchmarks/ChunkShift.Benchmarks.slnx
      - run: dotnet build benchmarks/ChunkShift.Benchmarks.slnx -c Release --no-restore
      - run: dotnet test benchmarks/ChunkShift.Benchmarks.Tests/ChunkShift.Benchmarks.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~PatchTreeDetachedPolicyLabTests
