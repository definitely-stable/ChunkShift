name: Repository file fsync EIO capability

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-crash-lab/**'
      - '.github/workflows/repository-fsync-eio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fsync-eio:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Test syscall oracle negative controls
        run: python -B -m unittest discover -s tools/repository-crash-lab -p test_fsync_eio_oracle.py -v
      - name: Witness actual fsync EIO after successful buffered write
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/repository-crash-lab/run_fsync_eio.py
          python -B -c 'import json,pathlib,sys; root=pathlib.Path(sys.argv[1]); r=json.loads((root/"result.json").read_text()); m=json.loads((root/"manifest.json").read_text()); assert m["commit"]==sys.argv[2] and r["failure"]["syscalls"]=={"write":65536,"fsync_errno":5,"same_fd":True} and all(r[x]["syscalls"]=={"write":65536,"fsync_errno":0,"same_fd":True} for x in ("control","repair")) and r["linear"]==r["restored_table"] and r["cleanup"]=="confirmed" and r["outcome"]=="pass"; import hashlib; assert (root/"faulted-physical-block.bin").read_bytes()==(root/"before.bin").read_bytes()[4096:8192] and hashlib.sha256((root/"faulted-physical-block.bin").read_bytes()).hexdigest()==r["physical_block_sha256"]' "$RUNNER_TEMP/repository-fsync-eio-evidence" "$(git rev-parse HEAD)"
      - name: Preserve original syscall traces and physical block witness
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-fsync-eio-${{ matrix.os }}
          path: ${{ runner.temp }}/repository-fsync-eio-evidence/
          if-no-files-found: warn
          retention-days: 90
