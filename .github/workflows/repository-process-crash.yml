name: Repository process crash baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/repository-crash-lab/**'
      - 'src/ChunkShift.Repository/**'
      - '.github/workflows/repository-process-crash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crash:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Test locked crash oracle negative controls
        run: python -B -m unittest discover -s tools/repository-crash-lab -p test_crash_oracle.py -v
      - name: Kill at actual private-pack boundaries and inspect from new process
        shell: pwsh
        run: |
          python -B tools/repository-crash-lab/run.py --output "$env:RUNNER_TEMP/repository-crash"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(Get-Content "$env:RUNNER_TEMP/repository-crash/evidence/cases.jsonl" | ForEach-Object { $_ | ConvertFrom-Json })
          if ($rows.Count -ne 14 -or @($rows | Where-Object { $_.outcome -ne "pass" }).Count -ne 0) { throw "Crash matrix incomplete" }
          $ready = @($rows | Where-Object { $_.boundary -eq "Ready:1" })
          if ($ready.Count -ne 2 -or @($ready | Where-Object { $_.raw_witness.restored_sha256 -ne "79df7a3236a66a983fc9fbf3a921c2a017fd6310267bf296d150f749d9c54e96" }).Count -ne 0) { throw "Missing Ready reconstruction witness" }
      - name: Preserve diagnostics and structural evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repository-process-crash-${{ matrix.os }}
          path: ${{ runner.temp }}/repository-crash/evidence/
          if-no-files-found: warn
          retention-days: 90
