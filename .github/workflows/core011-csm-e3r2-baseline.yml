name: CORE011 CSM E3-R2 eager baseline calibration

on:
  pull_request:
    branches:
      - research/core011-csm-004-e3r1-reader-correctness
      - main
    paths:
      - ".github/workflows/core011-csm-e3r2-baseline.yml"
      - "docs/benchmarks/CORE011-CSM-004-E3-R2-CALIBRATION.md"
      - "benchmarks/ChunkShift.Benchmarks/CsmE3R2BaselineHarness.cs"
      - "benchmarks/ChunkShift.Benchmarks/Program.cs"
      - "benchmarks/experiments/core011-csm-e3r2-calibration.v1.json"
      - "benchmarks/scripts/core011_csm_e3r2.py"
      - "benchmarks/scripts/test_core011_csm_e3r2.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core011-e3r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-calibration:
    strategy:
      fail-fast: false
      matrix:
        replicate: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    name: GitHub-hosted replica ${{ matrix.replicate }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Checkout pinned R2 PR tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: .NET 10 pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify E3-R2 path scope; unchanged product reader
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/research/core011-csm-004-e3r1-reader-correctness...HEAD > "$RUNNER_TEMP/e3r2-scope.txt"
          cat "$RUNNER_TEMP/e3r2-scope.txt"
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/core011-csm-e3r2-baseline.yml|docs/benchmarks/CORE011-CSM-004-E3-R2-CALIBRATION.md|benchmarks/ChunkShift.Benchmarks/CsmE3R2BaselineHarness.cs|benchmarks/ChunkShift.Benchmarks/Program.cs|benchmarks/experiments/core011-csm-e3r2-calibration.v1.json|benchmarks/scripts/core011_csm_e3r2.py|benchmarks/scripts/test_core011_csm_e3r2.py) ;;
              *) echo "unexpected E3-R2 modified path: $f" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/e3r2-scope.txt"
          test -z "$(git diff --name-only origin/research/core011-csm-004-e3r1-reader-correctness...HEAD -- src/ tests/ Directory.Packages.props)"
      - name: Strict contract negative tests and R0 no-decision guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmarks/scripts/core011_csm_e3r2.py benchmarks/scripts/test_core011_csm_e3r2.py
          python3 -m unittest -v benchmarks/scripts/test_core011_csm_e3r2.py
          python3 benchmarks/scripts/core011_csm_e3_guard.py
          if python3 benchmarks/scripts/core011_csm_e3_guard.py --decision-ready; then
            echo "E3 decision gate unexpectedly unlocked" >&2
            exit 1
          fi
      - name: Build genuine CSM in external process and calibrate 4 source-free consumers
        shell: bash
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=8 HEAD)
          rid="CORE011-CSM-004/RUN-$(date -u +%Y%m%d)-$GITHUB_RUN_ID-$short-r${{ matrix.replicate }}-linux-x64"
          python3 benchmarks/scripts/core011_csm_e3r2.py \
            --run-id "$rid" \
            --replicate ${{ matrix.replicate }} \
            --output-dir "$RUNNER_TEMP/core011-e3r2-calibration"
          python3 - "$RUNNER_TEMP/core011-e3r2-calibration/summary.json" <<'PY'
          import json,os,statistics,sys
          with open(sys.argv[1],encoding="utf-8") as src:
            s=json.load(src)
          assert s["mode"]=="baseline-only" and s["decisionRunsAllowed"] is False
          assert s["budgetsLocked"] is False and s["consumerCount"]==4 and s["builderCount"]==2
          assert s["verdict"]=="CALIBRATION_ONLY_NO_PRODUCT_VERDICT"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            print("## E3-R2-A unmodified eager reader; baseline calibration only",file=f)
            print("RunId: "+s["runId"],file=f)
            print("| Source MiB | Readers | Alloc KiB/op median | CPU ms/batch median | Natural idle RSS MiB |",file=f)
            print("|---:|---:|---:|---:|---|",file=f)
            for c in s["cells"]:
              idle=" → ".join(str(round(v/1048576,2)) for v in c["idleWorkingSetBytes"])
              print("| "+str(c["sizeMiB"])+" | "+str(c["workers"])+" | "+
                str(round(statistics.median(c["allocationBytesPerOperation"])/1024,2))+
                " | "+str(round(statistics.median(c["cpuMs"]),2))+" | "+idle+" |",file=f)
            print("No candidate measured. No budget locked. No product adoption.",file=f)
          PY
      - name: Upload original CSM bytes/fixture digests, raw rounds and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core011-csm-e3r2-r${{ matrix.replicate }}
          path: ${{ runner.temp }}/core011-e3r2-calibration/
          if-no-files-found: warn
          retention-days: 90
