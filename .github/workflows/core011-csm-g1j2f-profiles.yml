name: CORE011 CSM G1-J2F immutable Roslyn profile sensitivity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/core011-csm-g1j2f-profiles.yml"
      - "benchmarks/ChunkShift.Benchmarks/CsmG1j2fProfileHarness.cs"
      - "benchmarks/ChunkShift.Benchmarks/Program.cs"
      - "benchmarks/scripts/core011_csm_g1j2f_profile_sensitivity.py"
      - "benchmarks/scripts/test_core011_csm_g1j2f_profile_sensitivity.py"
      - "docs/benchmarks/CORE011-CSM-001-G1J2F-PROFILE-PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core011-g1j2f-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-profile-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: GitHub-hosted exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: .NET 10 pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Mutations and zero-decision lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v benchmarks/scripts/test_core011_csm_g1j2f_profile_sensitivity.py
          python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json
          if python3 benchmarks/scripts/core011_csm_g1j_contract.py \
            --contract benchmarks/experiments/core011-csm-g1j-contract.v1.json \
            --decision-ready; then
            echo "G1-J2F forbids product CPU decision runs" >&2
            exit 1
          fi
      - name: Compare all five frozen profile pairs against original Roslyn byte identities
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/scripts/core011_csm_g1j2f_profile_sensitivity.py \
            --output-dir "$RUNNER_TEMP/core011-g1j2f-data" \
            --run-id "CORE011-CSM-001/G1J2F-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:8}-linux-x64"
          python3 - "$RUNNER_TEMP/core011-g1j2f-data/summary.json" <<'PY'
          from pathlib import Path
          import json,sys
          d=json.loads(Path(sys.argv[1]).read_text())
          assert d["verdict"]=="NO_VERDICT_EXPLORATORY"
          assert len(d["allLanes"])==5 and len(d["profiles"])==5
          assert d["profiles"]["stable-fastcdc64k"]["reusedChunks"]==0
          assert d["profiles"]["stable-fastcdc64k"]["missingChunks"]==81
          for k in d["allLanes"]:
              x=d["profiles"][k]
              assert x["reusedChunks"]+x["missingChunks"]==x["targetChunks"]
              assert x["reusedBytes"]+x["missingBytes"]==6697264
          print("J2F frozen exact source, 5 lanes, original public CSM PASS; no product decision.")
          PY
      - name: Archive complete scanner output and physical CSM without original DLLs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core011-csm-g1j2f-${{ github.run_id }}
          path: ${{ runner.temp }}/core011-g1j2f-data/
          retention-days: 90
          if-no-files-found: warn
